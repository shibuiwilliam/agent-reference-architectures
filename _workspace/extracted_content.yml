1:
  design: "```mermaid\nflowchart LR\n    U[クライアント] -->|\"POST /tasks\"| GW[API Gateway / 受付]\n    GW -->|\"202 + job_id\"| U\n    GW -->|enqueue| Q[(Job Queue)]\n    Q --> W[Agent Worker]\n    W -->|状態保存|\
    \ S[(State Store)]\n    W -->|進捗/結果 push| PS[(Pub/Sub)]\n    PS -->|SSE / WebSocket| U\n```\n\n受付APIはジョブをキュー（SQS / Pub/Sub / Redis Stream など）に投入し、その状態を `pending → running → (partial) → done / failed\
    \ / timeout` として外部ストアに永続化します。中間トークンや進捗は別チャネルを通じてストリーミングします。"
  primary_decision: decisions/tradeoffs-catalog/sync-vs-async.md
  summary: "AIエージェントにリサーチや資料作成を任せると、処理に数分以上かかることも珍しくありません。これを通常のHTTPリクエストのように同期で待つと、ロードバランサやプロキシのタイムアウトで途中切断されてしまいます。\n\nこのパターンでは、ユーザーからのリクエストに対して同期レスポンスを返すのではなく、受付時に `session_id` / `job_id` を即座に発行して `202\
    \ Accepted` を返します。実処理はキューやワークフローエンジンへ渡し、ワーカー群が背後で実行します。進捗と最終結果は polling・SSE・WebSocket・Webhook で受け取ります。Web層は「受付」だけを担い、エージェント実行層と独立にスケールします。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F4]` レイテンシ予算・`[F1]`\
    \ 可逆性\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の タイムアウト / [相反](../../decisions/tradeoffs.md) の 同期↔非同期・プッシュ↔プル\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
2:
  design: "```mermaid\nflowchart LR\n    W[Agent Worker] -->|\"read/write\"| SS[(Session Store)]\n    W -->|\"checkpoint\"| CP[Checkpoint Log]\n    LB[Load Balancer] -->|\"任意のworkerへ\"| W\n    SS -->|\"\
    復元\"| W2[別 Worker（再開）]\n```\n\nセッション状態は各ステップの完了時にストアへ書き出します（チェックポイント）。キーは `session_id` で、TTLを付けて古いセッションを自動的に失効させます。復元時は最新のチェックポイントを読み込み、副作用のあるステップについては冪等キーを用いて重複実行を防ぎます。"
  primary_decision: decisions/tradeoffs-catalog/in-context-vs-external.md
  summary: "エージェントが数十分かけて調査を進めている途中でプロセスがクラッシュしたら、最初からやり直しになります――これは本番環境では許容できません。\n\nこのパターンでは、エージェントのセッション状態（会話履歴、中間結果、ステップカウンタ、取得済みコンテキスト）をインメモリではなく外部の耐久ストアに書き出します。これにより、プロセスが落ちてもストアから状態を復元し、最後のチェックポイントから再開できるようになります。また、ステートレスなワーカーが任意のセッションをピックアップできるため、スケールアウトやローリングデプロイとも両立しやすくなっています。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F1]` 可逆性\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の チェックポイント頻度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
3:
  design: "```mermaid\nflowchart TD\n    WF[Workflow Engine] -->|\"1. データ取得\"| S1[ETLステップ]\n    WF -->|\"2. 分類判断\"| AN[Agent Node / LLM]\n    AN -->|\"構造化結果\"| WF\n    WF -->|\"3. 後処理\"| S2[DB書き込み]\n  \
    \  WF -->|\"4. 通知\"| S3[Slack / Email]\n```\n\nエージェントノードはワークフローの1タスクとして呼ばれ、入力スキーマと出力スキーマが契約化されています。タイムアウト・リトライ・フォールバックはワークフロー側で定義します。"
  primary_decision: decisions/tradeoffs-catalog/workflow-vs-agent.md
  summary: "「データを取得して、分類して、DBに書き込んで、通知する」といった業務フローの大半は定型処理であり、AI判断が必要なのは一部のステップだけです。それなのにフロー全体をエージェントに委ねると、順序の再現性が失われ、監査もコスト管理も難しくなります。\n\nこのパターンでは、ワークフローエンジン（DAG実行器）が骨格となり、定型ステップを決定論的に実行します。そのうえで、LLMの判断力が必要なノード――分類、要約、計画立案など――だけをエージェントに委ねます。骨格が全体の進行を制御するため、監査ログの取得やリトライ制御は既存のワークフロー技術で対応できます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F6]` タスクの変動性・`[F8]` 説明責任・規制\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の ワークフロー↔エージェント\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
4:
  design: "```mermaid\nsequenceDiagram\n    participant O as Orchestrator\n    participant A as サービスA\n    participant B as サービスB\n    participant C as サービスC\n    O->>A: ステップ1実行\n    A-->>O: OK\n    O->>B:\
    \ ステップ2実行\n    B-->>O: OK\n    O->>C: ステップ3実行\n    C-->>O: 失敗\n    O->>B: 補償2（取り消し）\n    O->>A: 補償1（取り消し）\n```\n\nオーケストレータ（ワークフローエンジンまたはエージェント自身）が実行済みステップのスタックを保持し、失敗検知で補償を逆順に発火します。各補償アクションも冪等に設計します。"
  primary_decision: decisions/dials/checkpoint-frequency.md
  summary: "たとえばエージェントが「カレンダー予約 → チケット作成 → メール送信」を自動実行する場面を考えてみましょう。メール送信で失敗したとき、予約とチケットだけが残って不整合が生じてしまいます。送ったメールは取り消せませんし、予約も手動でキャンセルしなければなりません。\n\nSagaパターンでは、各ステップに対応する補償アクション（予約取り消し、チケットクローズ、訂正メール送信）を事前に定義しておき、失敗時に逆順で実行します。これは分散トランザクションのSagaパターンを、エージェントの文脈に適用したものです。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F1]` 可逆性・`[F2]` 失敗コスト\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
5:
  design: "```mermaid\nflowchart TD\n    Start[ループ開始 + 予算注入] --> Check{残予算 > 0?}\n    Check -->|Yes| Step[LLM推論 + ツール実行]\n    Step -->|予算消費を記録| Check\n    Check -->|No| Degrade[縮退: 最善結果を返却]\n```\n\n予算は構造体として保持し、LLM呼び出し・ツール実行ごとに消費量を加算します。残予算はプロンプトにも含め、LLM自身にも「あと何ステップか」を認識させます。"
  primary_decision: decisions/dials/budget-cap.md
  summary: "エージェントに「この技術を調べて」と頼んだら、関連論文を延々と読み続けて数百回のAPI呼び出しと数万トークンを消費していた――そんな暴走が本番で起きたら、コストもレイテンシも制御不能になります。\n\nエージェントの ReAct / Plan-Execute ループは、本質的に終了条件が不確定であり、無限ループや想定外の深掘りが起こりえます。このパターンでは、ループ開始時に予算（wall-clock時間、最大ステップ数、累積トークン数、API呼び出し回数、金額上限）を注入し、各イテレーションで残予算をチェックします。予算を超過した場合は、「現時点の最善回答を返す」「要約して終了する」「人間にエスカレーションする」のいずれかに縮退させます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F7]` コスト感度・スケール・`[F3]` 1リクエストの価値\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の タイムアウト・予算上限\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
6:
  design: "```mermaid\nflowchart TD\n    Loop[推論ループ] --> CP{中断ポイント}\n    CP -->|\"中断信号なし\"| Next[次ステップ実行]\n    Next --> Loop\n    CP -->|\"中断信号あり\"| Save[状態永続化]\n    Save --> Pause[一時停止 / 返却]\n    Pause\
    \ -->|\"再開指示\"| Loop\n```\n\n各ステップ間にチェックポイントを挿入し、中断フラグ（Redis / DB / インメモリ）をポーリングまたはイベントで受信します。中断後のセッション状態は [#2 Durable Agent Session](02-durable-agent-session.md) で永続化します。"
  primary_decision: foundations/forces/f4-latency-budget.md
  summary: "ユーザーが「やっぱり違う条件で調べてほしい」と思ったのに、エージェントが止まらずに古い指示のまま走り続けている――そんな状況は無駄なコスト消費だけでなく、誤った副作用まで生みかねません。\n\nこのパターンでは、エージェントの推論ループに**中断ポイント**を設け、外部からのキャンセル信号や方針変更を受け取れるようにします。中断時には、現在のステップを安全に完了（またはロールバック）したうえで、状態を永続化して停止します。ユーザーが方針を修正した後は、同じセッションから再開できます。「止められないエージェント」は本番運用で最も危険な存在であり、中断可能性は安全弁として欠かせません。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F4]` レイテンシ予算\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
7:
  design: "```mermaid\nflowchart LR\n    W[Agent Worker] -->|\"イベント発行\"| PS[Pub/Sub / Stream]\n    PS -->|\"SSE\"| UI[クライアント UI]\n    PS -->|\"永続化\"| LOG[(イベントログ)]\n```\n\nワーカーは各ステップで構造化イベント（ステップ名、入出力の要約、所要時間、残予算）を発行します。イベントはPub/Sub経由でクライアントへSSE/WebSocketで配信されると同時に、永続ストアにも蓄積されて監査ログとして機能します。クライアント側では進捗バーやステップリストとして描画します。"
  primary_decision: decisions/tradeoffs-catalog/push-vs-pull.md
  summary: "エージェントに調査を任せたまま2分間画面が無反応だったら、ユーザーは「フリーズしたのでは」と不安になり、ブラウザをリロードしたくなります。処理が順調に進んでいたとしても、見えなければ伝わりません。\n\nこのパターンでは、ステップ完了・ツール呼び出し・中間判断などのイベントを、構造化された進捗メッセージとしてリアルタイムに配信します。単なるトークンストリーミングではなく、「何を意図し、何を実行し、何が返ったか」というセマンティックな進捗を送る点が特徴です。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F4]` レイテンシ予算\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の プッシュ↔プル\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
8:
  design: "```mermaid\nflowchart LR\n    P[Planner] -->|計画| E[Executor]\n    E -->|実行結果| R[Reviewer]\n    R -->|OK| Out[最終出力]\n    R -->|差し戻し| P\n```\n\nPlanner はタスク分解と順序付けを担い、構造化された計画（JSON やステップリスト）を出力します。Executor\
    \ は計画を逐次実行し、各ステップの結果を記録します。Reviewer は実行結果を計画の意図・品質基準と照合し、不合格なら理由を添えて Planner へ差し戻します。差し戻しループには回数上限を設け、[#5 Time-Budgeted Agent Loop](../01-execution/05-time-budgeted-agent-loop.md) と組み合わせて暴走を防ぎます。"
  primary_decision: decisions/tradeoffs-catalog/plan-vs-react.md
  summary: "人間のチームでも、企画書を書いた本人がレビューまで担当すると、見落としやバイアスが入りやすくなります。LLMにも同じことが起きます。1つのLLMに「考えて・やって・確かめて」をすべて任せると、自分の計画を自分で検証するという構造的な利益相反が生まれてしまいます。\n\nPlanner-Executor-Reviewer は、計画（Plan）・実行（Execute）・検証（Review）を独立したロール――場合によっては別モデルや別プロンプト――に分離する構成です。Planner\
    \ がステップ列を生成し、Executor がツール呼び出しや副作用を実行し、Reviewer が結果を検証して差し戻しまたは承認します。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト・`[F3]` 1リクエストの価値\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md)\
    \ の Plan↔ReAct\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
9:
  design: "```mermaid\nflowchart TD\n    U[ユーザー] --> S[Supervisor]\n    S -->|検索タスク| A[Search Specialist]\n    S -->|コード生成| B[Code Specialist]\n    S -->|データ分析| C[Analytics Specialist]\n    A --> S\n  \
    \  B --> S\n    C --> S\n    S --> U\n```\n\nSupervisor は各 Specialist の能力・コスト・レイテンシをメタデータとして保持し、タスクに応じて委譲先を選択します。Specialist は自身のドメインに最適化されたプロンプト・ツールセット・場合によっては専用モデルを持ちます。Supervisor は Specialist の出力を検証・統合し、必要なら別の\
    \ Specialist へ再委譲します。"
  primary_decision: decisions/tradeoffs-catalog/single-vs-multi-agent.md
  summary: "カスタマーサポートで「技術的な質問」「請求の問い合わせ」「返品手続き」が同じ窓口に届く場面を考えてみましょう。1つの汎用エージェントにすべてを任せると、プロンプトが肥大化し、コンテキスト窓の浪費と専門性の希薄化が同時に起きてしまいます。\n\nSupervisor-Specialist は、ルーティングと品質管理を担う Supervisor と、特定ドメインに特化した Specialist\
    \ 群に分ける構成です。Supervisor はタスクの意図を解釈し、適切な Specialist を選択・呼び出したうえで、結果を統合して返します。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F6]` タスクの変動性・`[F7]` コスト感度・スケール\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md)\
    \ の シングル↔マルチエージェント\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
10:
  design: "```mermaid\nflowchart LR\n    T[タスク] --> A1[Agent A]\n    T --> A2[Agent B]\n    T --> A3[Agent C]\n    A1 --> J[Judge / Aggregator]\n    A2 --> J\n    A3 --> J\n    J --> Out[最終回答]\n```\n\n\
    各エージェントは独立に回答を生成します。Judge（またはAggregator）は回答群を比較し、一致度・根拠の質・論理整合性を基に最終回答を選択または合成します。Debate 変種では、エージェント同士が互いの回答を批判し、数ラウンドの議論を経て収束させます。"
  primary_decision: decisions/tradeoffs-catalog/same-vs-different-model.md
  summary: "医療判断や金融リスク評価で、1人の専門家の意見だけで結論を出すのはリスクが高いです。LLMでも同じで、単一エージェントの回答はモデルのバイアスやハルシネーションに左右されやすくなります。\n\nAgent Ensemble は、複数のエージェント（異なるモデル・プロンプト・温度設定など）に同じタスクを与え、結果を集約する手法です。集約方法には多数決（Majority Vote）、スコアリング、または\
    \ Debate（相互批判による収束）があります。これは機械学習のアンサンブル手法をエージェントレベルに適用したものと捉えられます。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト・`[F3]` 1リクエストの価値\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md)\
    \ の Best-of-N / [相反](../../decisions/tradeoffs.md) の 同一↔別モデル検証\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
11:
  design: "```mermaid\nflowchart LR\n    Input[ユーザー入力] --> LLM1[LLM: 意図解釈]\n    LLM1 -->|構造化パラメータ| Core[決定論コア<br/>ルール・計算・状態遷移]\n    Core -->|結果データ| LLM2[LLM: 応答生成]\n    LLM2 --> Output[ユーザー応答]\n```\n\n\
    入力側の LLM が自然言語を構造化パラメータに変換し（[#14 Structured Output Contract](../03-io-contract/14-structured-output-contract.md)）、決定論コアがビジネスロジックを実行し、出力側の LLM が結果を人間向けに整形します。コアは通常のユニットテスト・型検査・形式検証が適用でき、監査ログも確定的に残せます。"
  primary_decision: decisions/tradeoffs-catalog/prompt-vs-code.md
  summary: "保険の査定金額や融資審査の判定をLLMに任せたとしたら、同じ入力に対して毎回異なる金額が返ってくる可能性があります。これは業務として許容できません。「間違ってはならない処理」と「柔軟さが求められる処理」は本質的に異なります。\n\n決定論コア・確率論エッジは、ビジネスルール・状態遷移・金額計算・権限判定など確実性が必須の処理を従来のコードで書き、LLMの利用は自然言語の解釈、非構造データの分類、ユーザー向け文章の生成など柔軟さが必要な周辺に限定する構成です。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト・`[F8]` 説明責任・規制\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の ワークフロー↔エージェント・プロンプト↔コード制御\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
12:
  design: "```mermaid\nflowchart TD\n    BB[(Blackboard<br/>共有状態)]\n    C[Controller] -->|監視・選択| BB\n    A1[Agent A] -->|読み書き| BB\n    A2[Agent B] -->|読み書き| BB\n    A3[Agent C] -->|読み書き| BB\n    C -->|起動指示|\
    \ A1\n    C -->|起動指示| A2\n    C -->|起動指示| A3\n```\n\n黒板はタスクの現在状態――入力データ、中間仮説、部分結果、最終出力――を構造化して保持します。各エージェントは黒板の特定領域を購読し、自分の専門で処理できる状態になったら結果を書き戻します。Controller は黒板の変化（新しい仮説の追加、信頼度の更新など）に基づいて次のエージェントを起動します。"
  primary_decision: decisions/tradeoffs-catalog/orchestration-vs-choreography.md
  summary: "複数のエージェントが協調して1つの問題を解く場面で、エージェント同士を直接呼び出しで結合すると、参加者が増えるたびに接続が爆発的に増えてしまいます。会議室のホワイトボードのように、全員が同じ場所に書き込み・読み取りできる共有空間があれば、この複雑さを回避できます。\n\nBlackboard パターンは、共有のデータストア――黒板（Blackboard）――を介してエージェントを間接的に協調させる古典的なAIアーキテクチャです。各エージェント（Knowledge\
    \ Source）は黒板を読み、自分が貢献できる部分があれば結果を書き込みます。コントローラが黒板の状態変化を監視し、次に動くべきエージェントを選択します。エージェント同士は互いの存在を知らなくてよい構造です。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F6]` タスクの変動性\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md)\
    \ の 中央集権↔コレオグラフィ\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
13:
  design: "```mermaid\nflowchart LR\n    U[ユーザー] -->|自然言語| NLB[Boundary Adapter]\n    NLB -->|\"{ intent, slots, confidence }\"| V[Validator]\n    V -->|valid| R[Router / Executor]\n    V -->|invalid /\
    \ low confidence| CL[Clarification Loop]\n    CL -->|再質問| U\n```\n\nBoundary Adapter は LLM またはルールベースの NLU で実装します。出力は固定スキーマの JSON で、下流は自然言語を一切扱いません。confidence が閾値を下回る場合は [#16 Ambiguity Negotiation](16-ambiguity-negotiation.md)\
    \ へ委譲して確認を挟みます。"
  primary_decision: foundations/forces/f5-input-trust.md
  summary: "ユーザーが「先月の売上レポートを出して」と言ったとき、「先月」はいつからいつまでか、「売上」はどの部門か、「出す」はメール送信なのか画面表示なのか。自然言語にはこうした曖昧さや省略が常につきまとい、そのまま下流に流すと処理ロジックを汚染してしまいます。\n\n本パターンは、入力の最前段に「翻訳層」を配置し、自由文を意図（intent）・パラメータ（slots）・確信度（confidence）に分解します。下流は構造化された契約だけを受け取るため、通常のバリデーションやルーティングをそのまま適用できます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
14:
  design: "```mermaid\nflowchart LR\n    LLM[LLM] -->|JSON / 構造化テキスト| VAL[Schema Validator]\n    VAL -->|pass| DS[下流システム]\n    VAL -->|fail| RETRY[再生成 / フォールバック]\n    RETRY --> LLM\n```\n\nスキーマは JSON Schema・Pydantic\
    \ モデル・Protocol Buffers 等で定義します。LLM の structured output モード（OpenAI `response_format`、Anthropic tool_use）を使えば生成段階で準拠率が上がりますが、バリデーションは省略しません。"
  primary_decision: decisions/tradeoffs-catalog/structured-vs-freeform.md
  summary: "LLMに「JSONで返して」と頼んでも、ある時はコードブロック付き、ある時は余計な説明文付き、ある時はフィールド名が微妙に違う――このフォーマットの揺れが後続のパース処理を壊してしまう場面は実装者なら誰しも経験があります。\n\n本パターンでは、出力スキーマを事前に定義し、LLMにスキーマ準拠の構造化データを生成させます。生成後にバリデータで検証し、不適合であれば再生成またはフォールバックを行います。API応答・DB書き込み・ワークフロー遷移など、後続が決定論的な処理であればすべてに適用できます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の 構造化↔自由出力\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
15:
  design: "```mermaid\nflowchart LR\n    CTX[コンテキスト] --> LLM[LLM]\n    LLM -->|\"{ action, params, reason }\"| DEC[Decision Validator]\n    DEC -->|approved| EXE[Deterministic Executor]\n    DEC -->|rejected|\
    \ FB[フォールバック / 再判断]\n    EXE --> RESULT[実行結果]\n```\n\nLLM の出力は `{ action: \"approve_refund\", params: { order_id: \"...\", amount: 1200 }, reason: \"...\" }` のような判断レコードであり、実際の返金処理は決定論的コードが実行します。reason\
    \ フィールドは監査ログに記録されます。"
  primary_decision: decisions/tradeoffs-catalog/llm-vs-tool.md
  summary: "返金処理をLLMに直接実行させたら、ハルシネーションで存在しない注文に対して返金が走ってしまった――そんな事故は、LLMに「実行」まで任せてしまうことで起きます。判断だけを任せて、実行は信頼できるコードに委ねれば、誤判断があっても実行前に食い止められます。\n\n本パターンでは、通常の Structured Output とは逆に、LLMに最終成果物ではなく「次に何をすべきか」「どの分岐を取るか」という判断だけを構造化で出力させます。実際の実行・データ操作・副作用は決定論的なコードが担います。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の LLM推論↔ツール委譲\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
16:
  design: "```mermaid\nflowchart TD\n    IN[ユーザー入力] --> ANA[曖昧度判定]\n    ANA -->|明確| EXEC[実行]\n    ANA -->|曖昧| NEG[交渉ループ]\n    NEG -->|選択肢提示 / 確認質問| U[ユーザー]\n    U -->|回答| NEG\n    NEG -->|確定| EXEC\n```\n\
    \n曖昧度の判定は、LLM の confidence スコア、スロット充足率、あるいは明示的な分類器で行います。交渉ループには最大ラウンド数を設定し、収束しなければエスカレーションします。"
  primary_decision: foundations/forces/f1-reversibility.md
  summary: "「このファイルを削除して」と言われたとき、候補が3つあったらどれを消すべきでしょうか。エージェントが「たぶんこれだろう」と推測して実行した結果、大切なファイルが消えてしまったら取り返しがつきません。\n\n本パターンでは、ユーザー入力の曖昧度が閾値を超えた場合に実行を保留し、選択肢の提示や確認質問によってユーザーと意図を交渉します。交渉の結果は構造化された確定意図として下流に渡します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F1]` 可逆性・`[F2]` 失敗コスト\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
17:
  design: "```mermaid\nflowchart LR\n    AG[Agent] -->|tool call| GW[Tool Gateway]\n    GW -->|authz check| POL[Policy Engine]\n    GW -->|rate limit| RL[Rate Limiter]\n    GW -->|proxy| T1[Tool A]\n  \
    \  GW -->|proxy| T2[MCP Server B]\n    GW -->|proxy| T3[Tool C]\n    GW -->|audit log| LOG[(Audit Store)]\n```\n\nゲートウェイはリバースプロキシとして動作し、各リクエストに対して (1) 認可判定、(2) レート制限、(3) 入力サニタイズ、(4) プロキシ転送、(5) レスポンスログ記録を順に行います。また、ツール定義（スキーマや説明文）もゲートウェイが集約し、エージェントに対して一元的に公開します。"
  primary_decision: decisions/tradeoffs-catalog/llm-vs-tool.md
  summary: "エージェントが使えるツールは、検索API、データベース、メール送信、ファイル操作など多岐にわたります。これらに個別に接続していると、「誰がどのツールをいつ呼んだか」の追跡が困難になり、認可ポリシーもツールごとにバラバラになりがちです。\n\n本パターンでは、すべてのツール呼び出しをゲートウェイ経由に統一し、認証・認可・レート制限・入出力ログを単一のレイヤーで処理します。新しいツールを追加する際も、ゲートウェイに登録するだけで既存のポリシーがそのまま適用されます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度・`[F8]` 説明責任・規制\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
18:
  design: 'セッション開始時に Binder がユーザーのロール、タスク種別、リスクレベルを評価し、ツールカタログから該当セッションで許可するツールだけを抽出してエージェントに注入します。セッション途中でツールを追加する場合は、あらためて再評価を経る必要があります。


    権限の粒度はツール単位にとどまらず、ツール内のパラメータ制約（たとえば `delete` は禁止し `read` のみ許可するなど）まで含めることができます。'
  primary_decision: decisions/dials/exposed-tool-count.md
  summary: "たとえば、問い合わせ対応用のエージェントにデータベースの削除権限やインフラ変更用のツールまで見えていたら、プロンプトインジェクション一発で取り返しのつかない操作が実行されかねません。ツール数が増えるほど、こうした「使う予定のないツールが呼ばれてしまう」事故のリスクは増大します。\n\n本パターンでは、セッション開始時にタスク種別・ユーザー権限・コンテキストに基づいて、利用可能なツールセットを動的に絞り込みます。エージェントから見ると「存在しないツールはそもそも呼べない」ため、攻撃面と事故の影響範囲を構造的に縮小できます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度・`[F2]` 失敗コスト\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の 露出ツール数\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
19:
  design: "```mermaid\nsequenceDiagram\n    participant A as Agent\n    participant GW as Tool Gateway\n    participant T as Tool\n    participant U as User / Policy\n\n    A->>GW: tool_call(dry_run=true)\n\
    \    GW->>T: simulate\n    T-->>GW: preview (affected rows, cost, diff)\n    GW-->>A: preview result\n    A->>U: 影響範囲を提示\n    U-->>A: approve / reject\n    A->>GW: tool_call(dry_run=false, approval_token)\n\
    \    GW->>T: execute\n    T-->>GW: result\n```\n\nドライランの実装はツール側が `--dry-run` フラグをサポートするのが理想ですが、ゲートウェイ側でトランザクションを開始→結果取得→ロールバックする方式でも実現できます。"
  primary_decision: foundations/forces/f1-reversibility.md
  summary: "エージェントが「本番データベースから1万件のレコードを削除」と判断したとき、その操作がいきなり実行されたらどうなるでしょうか。誤った判断であれば、取り返しのつかない結果がそのまま反映されてしまいます。\n\n本パターンでは、副作用を持つ操作を2つのフェーズに分けます。第1フェーズ（ドライラン）では実際の変更を行わず、「何が起きるか」を算出して提示します。第2フェーズ（本実行）は、ユーザーまたは自動承認ポリシーによる承認を得てから実行します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F1]` 可逆性・`[F2]` 失敗コスト\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
20:
  design: "```mermaid\nflowchart LR\n    AG[Agent] -->|code / command| SB[Sandbox Runtime]\n    SB -->|isolated exec| ENV[Container / VM / WASM]\n    ENV -->|stdout / result| SB\n    SB -->|sanitized output|\
    \ AG\n    ENV -.->|blocked| NET[外部ネットワーク]\n    ENV -.->|blocked| FS[ホストFS]\n```\n\nサンドボックスには以下の制約を適用します: (1) ファイルシステムは一時ディレクトリのみ書き込み可、(2) ネットワークはホワイトリスト制、(3) 実行時間・メモリに上限を設定、(4) 終了後にサンドボックスを破棄。"
  primary_decision: foundations/forces/f5-input-trust.md
  summary: "エージェントが生成したPythonスクリプトをホスト環境でそのまま実行したら、無限ループでCPUを食い尽くしたり、意図しないファイルを削除したりする事態は十分にありえます。LLMが生成するコードは常に正しいとは限らず、プロンプトインジェクションで悪意あるコードが混入する可能性もあります。\n\n本パターンでは、ツール実行をコンテナ・VM・WASM などの隔離環境に閉じ込め、ファイルシステム・ネットワーク・CPU/メモリにリソース制限を適用します。エージェントには実行結果だけを安全なチャネル経由で返します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
21:
  design: "```mermaid\nflowchart LR\n    AG[Agent] --> GW[MCP Gateway]\n    GW --> A1[MCP: 社内DB<br/>高信頼]\n    GW --> A2[MCP: 外部API<br/>中信頼]\n    GW --> A3[MCP: ユーザー提供<br/>低信頼]\n    style A1 fill:#c8e6c9\n\
    \    style A2 fill:#fff9c4\n    style A3 fill:#ffcdd2\n```\n\n分離の粒度は信頼レベルごとに分けるのが基本ですが、規制要件によっては MCP サーバー1つにつき1プロセスまで細かく分離することもあります。各アダプタにはネットワークポリシー・シークレットスコープ・リソース制限を個別に適用します。"
  primary_decision: foundations/forces/f5-input-trust.md
  summary: "社内データベースのMCPサーバーと、外部の第三者APIを接続するMCPサーバーを同じプロセスで動かしていたらどうなるでしょうか。外部APIアダプタの脆弱性を突かれた場合、攻撃者が社内DBのクレデンシャルまで手に入れてしまう可能性があります。\n\n本パターンでは、信頼レベル・データ分類・障害ドメインの異なる MCP サーバーを個別のプロセスまたはコンテナに分離します。ゲートウェイ（[#17](17-tool-mcp-gateway.md)）がルーティングを担い、各アダプタは自身の信頼境界内でのみ動作します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度・`[F8]` 説明責任・規制\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
22:
  design: "```mermaid\nflowchart LR\n    AG[Agent<br/>内部モデル] --> ACL[Anti-Corruption Layer]\n    ACL -->|変換| LEG[レガシーAPI<br/>外部モデル]\n    LEG -->|応答| ACL\n    ACL -->|変換| AG\n```\n\nACL は (1) リクエスト変換（内部から外部へ）、(2)\
    \ レスポンス変換（外部から内部へ）、(3) エラー正規化の3つの役割を担います。外部 API のフィールド名変更やバージョンアップは ACL の内部で吸収するため、エージェント側のプロンプトやロジックには影響が及びません。"
  primary_decision: foundations/forces/f8-accountability.md
  summary: "レガシーERPでは顧客IDが `CUST_NO`、CRMでは `customer_id`、会計システムでは `KNR` と呼ばれている――こうしたバラバラな命名やデータ形式が、エージェントのプロンプトやツール定義にそのまま流れ込むと、プロンプトが肥大化しモデルの理解精度が下がってしまいます。\n\nAnti-Corruption Layer（ACL）はドメイン駆動設計に由来するパターンで、外部モデルとエージェント内部モデルの間に翻訳層を挟みます。エージェント側は自分のドメイン語彙だけを扱い、ACL\
    \ が双方向の変換を担います。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
23:
  design: "```mermaid\nflowchart TB\n    Agent[エージェント] -->|参照| WM[短期メモリ<br/>セッション内]\n    Agent -->|検索| LM[(長期メモリ<br/>永続ストア)]\n    Agent -->|検索| SM[(共有メモリ<br/>チーム知識)]\n    WM -->|昇格| LM\n    LM -->|公開| SM\n\
    ```\n\n短期メモリはセッションのメッセージ履歴そのものであり、コンテキストウィンドウの上限に達すると要約やスライディングウィンドウで圧縮します。長期メモリへの昇格は [#25 Memory Write Gate](25-memory-write-gate.md) で制御し、無条件には書き込みません。共有メモリはベクトルDB やナレッジグラフとして実装し、テナントやロールに基づいてアクセス制御をかけます。"
  primary_decision: decisions/tradeoffs-catalog/in-context-vs-external.md
  summary: "チャットボットと長時間やり取りしていると、序盤に伝えた要件や好みを「忘れて」しまうことがあります。これはLLMのコンテキストウィンドウに上限があるためで、すべての情報を一度に保持することはできません。Layered Memory は記憶を3つの層に分離します。**短期メモリ**（ワーキングメモリ）は現セッション内のやり取りを保持し、**長期メモリ**はセッションをまたいで永続化されたファクトやユーザー嗜好を格納します。そして**共有メモリ**は、複数エージェント間で参照可能な知識ストアとして機能します。各層は書き込み・読み出しのポリシーが異なり、プロンプトへの注入タイミングも個別に制御されます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の 要約タイミング / [相反](../../decisions/tradeoffs.md) の 文脈内↔外部状態\n    - **意思決定の進め方**:\
    \ [意思決定の進め方](../../decisions/decision-flow.md)"
24:
  design: "```mermaid\nflowchart LR\n    Q[ユーザー入力] --> R[Retriever<br/>検索・抽出]\n    R --> VS[(ベクトルDB)]\n    R --> SQL[(業務DB)]\n    R --> API[外部API]\n    R --> Ranker[Reranker<br/>関連度順位付け]\n    Ranker -->\
    \ Pack[Context Pack<br/>トークン予算内に組立]\n    Pack --> LLM[LLM推論]\n```\n\n検索クエリはユーザー入力をそのまま使う場合と、LLMでクエリ変換（HyDE、クエリ分解など）を行う場合があります。取得したチャンクはRerankerで関連度を再順位付けし、トークン予算を超える分を切り捨てます。組み立て順序は「システム指示 → 取得文脈 →\
    \ 会話履歴 → ユーザー入力」が基本形です。"
  primary_decision: decisions/tradeoffs-catalog/rag-vs-finetuning.md
  summary: "社内の最新マニュアルや個別顧客の契約内容について質問したとき、モデルの学習データだけでは正しい答えが返ってきません。こうした「モデルが知らない情報」を使って正確に回答するには、外部から必要な文脈を取り込む仕組みが必要になります。Context Pack は、長期メモリ・外部ドキュメント・API応答・ユーザー履歴といった複数のソースから関連情報を検索し、トークン予算内に収まるよう選別・圧縮してプロンプトへ組み立てる工程を指します。RAG（Retrieval-Augmented\
    \ Generation）はこのパターンの代表的な実装ですが、検索ソースはベクトルDBに限らず、SQL・API・ファイルシステムなど多岐にわたります。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F4]` レイテンシ予算・`[F7]` コスト感度・スケール\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md)\
    \ の 検索 top-k / 投入量 / [相反](../../decisions/tradeoffs.md) の RAG↔FT↔ロングコンテキスト\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
25:
  design: "```mermaid\nflowchart LR\n    Session[セッション内やり取り] --> Extract[抽出・候補化]\n    Extract --> Gate{Write Gate<br/>分類・検証}\n    Gate -->|承認| LM[(長期メモリ)]\n    Gate -->|棄却| Drop[破棄]\n    Gate -->|要確認| Human[人間レビュー]\n\
    ```\n\nゲートの実装は段階的に選ぶことができます。最も軽量なのはルールベース（キーワードフィルタ、PII検出）であり、次にLLMによる要約・分類判定、最も厳格なのは人間承認を挟む方式です。書き込み時にはメタデータ（出典セッションID、タイムスタンプ、信頼度スコア）を付与しておき、後から監査や失効ができるようにします。"
  primary_decision: decisions/dials/memory-write-eagerness.md
  summary: "ユーザーが冗談で言ったことや、一時的な検証用データまでエージェントが「永久に覚えて」しまったら、次のセッションで的外れな応答を返したり、個人情報が意図せず残り続けたりします。エージェントがセッション中に得た情報をすべて長期メモリに書き込んでしまうと、誤情報・一時的な文脈・個人情報が無差別に蓄積され、後続セッションの品質を劣化させてしまいます。Memory Write Gate\
    \ は、短期メモリから長期メモリへの昇格パスに検証ロジックを挟むパターンです。書き込み候補を「保存すべきか」「分類（ファクト/嗜好/手順）」「機密度」の観点で評価し、条件を満たしたものだけを永続化します。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md)\
    \ の メモリ書き込み積極度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
26:
  design: '記憶エントリには以下のメタデータを付与します。


    - **TTL**: 作成時に設定する絶対有効期限（例: 90日）

    - **鮮度スコア**: 参照されるたびに更新し、長期間未参照のエントリはスコアが減衰

    - **上書きフラグ**: 同一キーの新しい記憶が書き込まれた場合に旧版を無効化


    失効処理はバッチ（日次の掃除ジョブ）またはクエリ時フィルタ（検索時にTTL超過分を除外する方式）で実装します。規制要件でデータ保持期間が定められている場合 `[F8]` は、TTLをその期間に合わせたうえで、削除ログを監査証跡として残しておきます。'
  primary_decision: decisions/dials/memory-ttl.md
  summary: "昨年の価格表や旧バージョンの仕様書をエージェントが「正しい情報」として参照し続けたら、顧客に誤った見積もりを出してしまう事態は十分に起きえます。長期メモリに情報を蓄積し続けると、古い事実が新しい事実と矛盾してしまい、エージェントの判断品質が低下します。Forgetting and Expiration は、すべての記憶エントリに有効期限または鮮度メトリクスを設定し、期限切れのエントリを検索結果から除外するか物理削除する仕組みを導入するパターンです。「忘れる」ことを設計上の機能として明示的に扱うことで、記憶の衛生を維持します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の メモリ TTL\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
27:
  design: "```mermaid\nflowchart LR\n    Q[質問] --> Search[根拠検索]\n    Search --> Judge{根拠は<br/>十分か?}\n    Judge -->|十分| Gen[回答生成<br/>引用付き]\n    Judge -->|不十分| Decline[不明と回答<br/>or 追加質問]\n    Gen --> Out[出典付き回答]\n\
    ```\n\n検索フェーズでは [#24 Context Pack / Assembly](../05-memory-context/24-context-pack-assembly.md) と同じ仕組みを使いますが、ここでは「回答可能か」の判定ステップが加わります。引用形式はインライン脚注（`[1]`）やメタデータブロックなど、下流の用途に合わせて選びます。"
  primary_decision: decisions/tradeoffs-catalog/rag-vs-finetuning.md
  summary: "LLMは「自信たっぷりに間違える」ことがあります。確信度が高くても事実に基づいていなければ、特に法務・医療・金融の領域では深刻な問題になりかねません。Evidence-First Answer は、この問題に対処するために、回答生成のワークフローを「まず根拠を集め、次にそれに基づいて回答を構成する」という二段階に分離するパターンです。根拠が見つからない場合は「わからない」と明示的に返します。回答には引用（出典ドキュメント、チャンク、URL）を付与し、ユーザーや監査者が検証できるようにします。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の RAG↔FT↔ロングコンテキスト\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
28:
  design: "```mermaid\nflowchart LR\n    Gen[生成エージェント] -->|ドラフト| V[Verifier / Critic]\n    V -->|合格| Out[最終出力]\n    V -->|不合格 + 理由| Gen\n```\n\n検証の実装は複数の手法を組み合わせることができます。たとえば、LLMベースの批評（「この回答に事実誤認はないか」）、ルールベースのチェック（JSON\
    \ Schema検証、禁止語検出）、外部ツール呼び出し（計算結果の再検算、URLの存在確認）などがあります。リトライ回数には上限を設け、上限を超えた場合は人間へのエスカレーションか安全なフォールバックを返します。"
  primary_decision: decisions/tradeoffs-catalog/inline-vs-post-verification.md
  summary: "自分で書いたレポートの誤りに自分では気づきにくいのと同様に、生成と検証を同一のエージェントに任せると、自身の誤りを見逃しやすくなります（自己確証バイアス）。Verifier Agent は、生成されたドラフトを別のエージェント（Critic）が受け取り、事実整合性・フォーマット遵守・ポリシー違反などの観点で検査するパターンです。不合格であれば生成側へフィードバックを返して修正を要求します。このように生成と検証の関心を分離することで、検査基準を独立に進化させることができます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト・`[F4]` レイテンシ予算\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の インライン↔事後検証・同一↔別モデル検証\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
29:
  design: "```mermaid\nflowchart LR\n    In[ユーザー入力] --> IG[入力ガードレール]\n    IG -->|安全| Agent[エージェント]\n    IG -->|危険| Block[遮断応答]\n    Agent --> OG[出力ガードレール]\n    OG -->|合格| Out[最終出力]\n    OG -->|軽度違反| Agent\n\
    \    OG -->|重度違反| Block\n```\n\n入力ガードレールはプロンプトインジェクション検出、トピック制限、PII検出を行います。出力ガードレールは有害性判定、ファクトチェック、フォーマット検証を行います。Self-Correction は、出力ガードレールの指摘を追加コンテキストとしてエージェントへフィードバックし、再生成させるループです。再試行回数は `[F4]` に応じて上限を設けます。"
  primary_decision: decisions/tradeoffs-catalog/inline-vs-post-verification.md
  summary: "公開チャットボットに悪意あるプロンプトが入力されたり、エージェントがポリシーに反する回答を返してしまったりする場面は、ユーザー数が増えるほど避けがたくなります。Guardrail Sidecar は、エージェントの入力（ユーザープロンプト）と出力（生成テキスト・ツール呼び出し）の両方をインターセプトし、ポリシー違反・有害コンテンツ・プロンプトインジェクションを検出するミドルウェアです。違反を検出した場合、軽度であれば生成側に修正指示を戻して\
    \ Self-Correction を促し、重度であれば応答を遮断して安全なフォールバックを返します。本体のエージェントロジックとは独立にデプロイ・更新できるのが特徴です。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度・`[F4]` レイテンシ予算\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md)\
    \ の ガードレール厳しさ・自己修正ループ回数 / [相反](../../decisions/tradeoffs.md) の インライン↔事後検証\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
30:
  design: "```mermaid\nflowchart LR\n    Agent[エージェント] -->|アクション要求| PE[Policy Engine<br/>OPA / CEL / Python]\n    PE -->|allow| Exec[実行]\n    PE -->|deny + 理由| Agent\n    Repo[(ポリシーリポジトリ<br/>Git管理)] -->|デプロイ|\
    \ PE\n```\n\nポリシーはGitリポジトリで管理し、変更はPRレビューを経てデプロイします。判定ログ（入力・ポリシーID・結果）はすべて記録し、監査証跡とします。ポリシーの例: 「1回のAPI呼び出しで削除できるレコードは10件まで」「個人の医療情報を含む応答は禁止」「営業時間外の送金操作は不許可」。"
  primary_decision: decisions/tradeoffs-catalog/prompt-vs-code.md
  summary: "「個人の医療情報を出力してはいけない」「1回の削除は10件まで」――こうした制約をプロンプトに自然言語で書いただけでは、LLMが指示を無視する確率をゼロにすることはできません。Policy-as-Code は、行動制約をOPA（Open Policy Agent）、Rego、CEL、Python関数といった決定論的コードとして定義し、エージェントの出力やツール呼び出しを判定する外部ゲートを設けるパターンです。プロンプトによるソフトな制御と、コードによるハードな制御を組み合わせることで、規制要件\
    \ `[F8]` を確実に充足できます。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト・`[F8]` 説明責任・規制\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の ガードレール厳しさ / [相反](../../decisions/tradeoffs.md)\
    \ の プロンプト↔コード制御\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
31:
  design: "```mermaid\nflowchart LR\n    Agent[エージェント] -->|高リスク操作| CP[Checkpoint<br/>一時停止]\n    CP -->|通知| Human[人間レビュアー]\n    Human -->|承認| Resume[実行再開]\n    Human -->|却下| Cancel[中止 / 代替]\n    Human -->|修正|\
    \ Agent\n```\n\nチェックポイントの配置は、操作の不可逆性 `[F1]` と失敗コスト `[F2]` に基づいて決めます。すべてのステップに承認を入れるとスループットが大幅に低下するため、リスク評価に基づく選択的な配置が重要になります。承認リクエストには操作の要約・影響範囲・根拠を含め、人間が短時間で判断できるようにしておきます。"
  primary_decision: decisions/dials/autonomy-level.md
  summary: "エージェントが顧客への送金を実行しようとしている、本番データベースのテーブルを削除しようとしている――こうした場面で、もし判断が間違っていたら取り返しがつきません。エージェントの自律性が高まるほど、誤った判断が不可逆な結果をもたらすリスクも増していきます。Human Approval Checkpoint は、ワークフロー上の特定ポイントでエージェントの実行を一時停止し、人間に「承認/却下/修正」の判断を求めるパターンです。承認待ちの間、エージェントのセッション状態は永続化され、承認が得られた後に処理を再開します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト・`[F1]` 可逆性\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の HITL頻度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
32:
  design: "```mermaid\nflowchart LR\n    U[リクエスト] --> A[Agent Orchestrator]\n    A -->|span: think| LLM[LLM Call]\n    A -->|span: tool| T[Tool Execution]\n    A -->|span: verify| V[Verifier]\n    LLM -->\
    \ TS[(Trace Store)]\n    T --> TS\n    V --> TS\n    TS --> D[Dashboard / Replay]\n```\n\nオーケストレータの各ステップがスパンを生成し、Trace Storeへ非同期に送出します。Trace Storeは追記専用（append-only）で、改竄に対する耐性を備えています。ダッシュボードやリプレイツールを通じてトレースを可視化し、フィルタリング・検索・集計を行えます。"
  primary_decision: decisions/dials/trace-sampling-rate.md
  summary: "エージェントが誤った回答を返したとき、「なぜそうなったのか」を追跡できなければ改善のしようがありません。どのツールを呼び、どんな中間結果を得て、最終回答に至ったのかを再構成できることが、本番運用では不可欠です。\n\nこのパターンでは、エージェントが1リクエストを処理する過程で踏むステップ（LLM呼び出し、ツール実行、内部判断）を、分散トレーシングのスパンとして追記専用ストアに書き出します。各スパンには入力・出力・レイテンシ・トークン数・モデルバージョンを付与し、セッション単位でツリー構造にまとめます。こうすることで「なぜその結果になったか」をあとから再構成でき、障害分析・コンプライアンス監査・品質改善の土台になります。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の トレースサンプリング率\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
33:
  design: 'プロンプトはGitまたはプロンプトレジストリでバージョン管理し、デプロイ時にハッシュまたはタグで固定します。モデルはスナップショット指定（例: `gpt-4o-2024-11-20`）で呼び出し、本番では `latest` エイリアスを使いません。ツールはAPIバージョンヘッダまたはMCPサーバーのイメージタグで固定します。これら三者の組み合わせをリリースバンドルとして管理し、変更は
    [#34 Evaluation CI/CD](34-evaluation-ci-cd.md) を通過してからロールアウトします。'
  primary_decision: decisions/dials/prompt-storage.md
  summary: "「昨日まで正常に動いていたエージェントが、今朝突然おかしな回答を返すようになった」――LLMプロバイダがモデルを静かに更新していた、というケースは珍しくありません。原因を特定しようにも、何が変わったのかが分からなければ手の打ちようがありません。\n\nエージェントの挙動は、プロンプトテンプレート、LLMモデルのバージョン、ツール（MCP含む）のAPIバージョンの組み合わせによって決まります。いずれかが気づかないうちに変わると出力が変動し、障害原因の特定が難しくなります。本パターンでは三者それぞれにバージョン識別子を付与し、デプロイ設定で固定します。さらにトレースにもバージョンを記録することで、「いつ・何が変わったか」を常に追跡できるようにします。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の プロンプト保存先・粒度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
34:
  design: "```mermaid\nflowchart LR\n    Dev[変更 PR] --> CI[CI Pipeline]\n    CI --> Eval[Eval Runner]\n    Eval --> DS[(Eval Dataset)]\n    Eval --> Agent[Agent Under Test]\n    Agent --> LLM[LLM]\n   \
    \ Eval --> Score[スコア算出]\n    Score -->|pass/fail| Gate[Merge Gate]\n```\n\nPRが作成されるとCIが評価ランナーを起動します。評価ランナーはデータセットの各ケースをAgentに投入し、応答をLLM-as-Judge・ルールベース判定・人間アノテーションといった方法で採点します。スコアがベースラインを下回った場合は、PRをブロックします。"
  primary_decision: foundations/forces/f8-accountability.md
  summary: "プロンプトを1行変えただけで、これまで正しく処理できていたケースが壊れる――エージェント開発ではそうした回帰が日常的に起こりえます。手動で確認していては網羅性も再現性も追いつきません。\n\n従来のソフトウェアCI/CDがユニットテストや結合テストでゲートするのと同様に、エージェントの変更もマージ前に評価（Eval）スイートを通過させます。具体的には、評価データセット（入力＋期待出力または判定基準）を用意し、変更後のエージェントに流して正答率・品質スコア・レイテンシ・コストを自動計測します。閾値を下回ればマージをブロックし、回帰をデプロイ前に食い止めます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
35:
  design: "```mermaid\nflowchart LR\n    TS[(Trace Store)] -->|本番ログ抽出| Sampler[Sampler]\n    Sampler --> Replay[Replay Runner]\n    Replay --> NewAgent[新バージョン Agent]\n    Replay --> Diff[差分比較]\n    Diff\
    \ --> Report[レポート / Gate]\n```\n\nまずSamplerが本番トレースから評価対象を抽出します（全量または層化サンプリング）。次にReplay Runnerがトレース内のユーザー入力・ツール応答をスタブとして新Agentに投入し、出力を取得します。差分比較では旧出力とのテキスト類似度・品質スコア・レイテンシ・コストを評価し、その結果をレポートまたはデプロイゲートに渡します。"
  primary_decision: foundations/forces/f8-accountability.md
  summary: "モデルをアップグレードしたい、プロンプトを大幅に書き換えたい――しかし「本番で何が変わるのか」が分からないまま切り替えるのは怖いものです。合成テストデータだけでは、実際のユーザーが投げてくる多様なクエリを再現しきれないことも多くあります。\n\n本パターンでは、[#32 Agent Trace](32-agent-trace.md) で蓄積した本番トレース（入力・コンテキスト・ツール応答）を、新しいプロンプト・モデル・ツールバージョンのエージェントに再投入し、出力の差分を比較します。本番特有の入力分布やエッジケースに対して変更の影響を事前に評価できるのが大きな利点です。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制・`[F9]` プロバイダ信頼度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
36:
  design: "```mermaid\nflowchart LR\n    LB[Load Balancer / Router] -->|95%| Old[旧版 Agent]\n    LB -->|5%| New[新版 Agent]\n    Old --> M[(Metrics)]\n    New --> M\n    M --> Judge[比較判定]\n    Judge -->|劣化検知|\
    \ LB\n```\n\nルーターがトラフィックを旧版と新版に重み付きで振り分けます。両者のメトリクス（正答率、レイテンシp50/p99、トークンコスト、エラー率）を同一基盤で収集し、統計的に比較します。有意な劣化が検知された場合は、新版への振り分けを0%に戻します。問題がなければ徐々に比率を上げていき、最終的に100%へ切り替えます。"
  primary_decision: foundations/forces/f9-provider-reliability.md
  summary: "評価CIを通過したからといって、新バージョンを全ユーザーに一気に展開するのはリスクが大きいです。オフライン評価ではカバーしきれなかったエッジケースが本番で顕在化し、全ユーザーに影響が及ぶ事態は避けたいところです。\n\n本パターンでは、シャドーモード（本番リクエストを複製して新版で処理するが、結果はユーザーに返さない）またはカナリアモード（トラフィックの一部だけを新版に振る）により段階的に投入し、品質・レイテンシ・コストのメトリクスを監視します。閾値を超えた劣化を検知した場合は自動でロールバックします。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F9]` プロバイダ信頼度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
37:
  design: "```mermaid\nflowchart LR\n    Req[リクエスト] --> GW[Semantic Gateway]\n    GW -->|簡単| Small[軽量モデル]\n    GW -->|複雑| Large[大型モデル]\n    GW -->|高価値| Premium[最高性能モデル]\n    Small --> Res[レスポンス]\n    Large\
    \ --> Res\n    Premium --> Res\n```\n\nゲートウェイはリクエストを軽量な分類器（小型LLM、ルールベース、Embedding分類）で難易度判定し、コスト予算テーブルと照合してモデルを選定します。分類器自体のコスト・レイテンシが低いことが前提となります。また、分類ミスへの備えとして、回答品質が低ければ上位モデルで再試行するフォールバックも設計に含めておきます。"
  primary_decision: decisions/dials/model-tier-routing.md
  summary: "「今日の天気は？」という質問と、複雑な法律文書の要約を、同じ最高性能モデルで処理する必要はありません。しかし、全リクエストを大型モデルに送っていればAPI費用は線形に膨張しますし、すべてを安価なモデルに任せれば複雑なタスクの品質が落ちてしまいます。\n\nセマンティックゲートウェイはリクエストを受け取り、難易度分類・価値推定・コスト制約をもとに最適なモデルへルーティングします。単純な質問は軽量モデルで即答し、複雑な推論は大型モデルへ送ります。これにより、平均コストを大幅に下げつつ品質を維持できます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F7]` コスト感度・スケール・`[F3]` 1リクエストの価値\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の モデル階層\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
38:
  design: "```mermaid\nflowchart LR\n    Q[クエリ] --> Emb[Embedding]\n    Emb --> VS[(Vector Store)]\n    VS -->|hit| Cache[キャッシュ応答]\n    VS -->|miss| LLM[LLM呼び出し]\n    LLM --> Store[結果をキャッシュ保存]\n    LLM\
    \ --> Res[レスポンス]\n    Cache --> Res\n```\n\nクエリのEmbeddingをベクトルストアで近傍検索します。類似度が閾値以上かつTTL内であればキャッシュヒットとして応答を返します。ミス時はLLMを呼び、応答とEmbeddingをペアでストアに書き込みます。"
  primary_decision: decisions/dials/cache-similarity.md
  summary: "カスタマーサポートのエージェントには「送料はいくら？」「返品の手続きは？」といった類似の質問が繰り返し寄せられます。表現は毎回微妙に異なるため完全一致キャッシュではヒットしませんが、意味的にはほぼ同じであり、毎回LLMを呼ぶのはコストとレイテンシの無駄です。\n\nセマンティック結果キャッシュはクエリをEmbeddingに変換し、ベクトル類似度が閾値を超える過去の応答があればそれを返す仕組みです。LLM呼び出しを省略できるため、レイテンシとコストの両方を削減できます。キャッシュミス時は通常通りLLMを呼び、結果をキャッシュに追加します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F4]` レイテンシ予算・`[F7]` コスト感度・スケール\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の キャッシュ類似度閾値\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
39:
  design: プロンプトを3層に構成します。第1層はシステムプロンプト＋行動規範（全リクエスト共通で、変更頻度が低い）です。第2層はFew-shot例・ドメインナレッジ（タスクカテゴリ共通）です。第3層はユーザー入力・セッション固有コンテキスト（リクエスト固有）です。第1層・第2層が共通prefixとなりキャッシュの対象になります。なお、第2層の並び順もハッシュ等で安定化させ、順序の変動によってキャッシュが無効化されるのを防ぎます。
  primary_decision: foundations/forces/f7-cost-sensitivity.md
  summary: "RAGで大量のコンテキストをプロンプトに含めると、入力トークン数が数千〜数万に膨らみ、コストとレイテンシが悪化します。しかしその大半はシステムプロンプトやFew-shot例など、リクエスト間で共通の内容であることが多いです。\n\n多くのLLMプロバイダは、プロンプトのprefix部分が一致する場合にキャッシュを適用し、入力トークンのコストとTime to First Token（TTFT）を削減してくれます。本パターンでは、システムプロンプト・Few-shot例・共通コンテキストをプロンプトの先頭に安定的に配置し、リクエストごとに変わる部分（ユーザー入力・動的コンテキスト）を末尾に置きます。こうしてprefix長を一定以上に保つことで、キャッシュヒット率を高めます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F7]` コスト感度・スケール・`[F4]` レイテンシ予算\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
40:
  design: "```mermaid\nflowchart TD\n    Req[リクエスト] --> Primary[プライマリモデル]\n    Primary -->|成功| Res[レスポンス]\n    Primary -->|失敗/タイムアウト| FB1[フォールバックモデル]\n    FB1 -->|成功| Res\n    FB1 -->|失敗| FB2[キャッシュ応答 /\
    \ ルールベース]\n    FB2 -->|成功| Res\n    FB2 -->|失敗| Err[縮退エラーメッセージ]\n```\n\nフォールバックチェーンを定義し、上位が失敗すると順に下位へ降りていきます。各段階ではタイムアウト・リトライ上限を設定し、遷移を高速に行います。回復検知（ヘルスチェック）によりプライマリが復旧したことを確認できれば、フォールバックを解除します。"
  primary_decision: decisions/tradeoffs-catalog/fail-fast-vs-degradation.md
  summary: "ある朝、主力LLMプロバイダが障害を起こし、エージェントが一切応答しなくなった――このような事態は実際に起こりえます。エージェントが複数ステップの処理途中で止まれば、セッション全体が無駄になってしまいます。\n\n外部LLMプロバイダは100%の可用性を保証しません。障害・レート制限・レイテンシ悪化が発生した際には、代替モデルへのフォールバック、機能縮退（一部機能をルールベースで代替）、キャッシュ応答の利用、最終手段としてのエラーメッセージ表示を段階的に実行します。ユーザーには「完全停止」ではなく「品質は下がるが動く」状態を提供するのが狙いです。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F9]` プロバイダ信頼度\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の リトライ回数 / [相反](../../decisions/tradeoffs.md) の Fail-fast↔縮退\n    - **意思決定の進め方**:\
    \ [意思決定の進め方](../../decisions/decision-flow.md)"
41:
  design: "```mermaid\nflowchart LR\n    R[リクエスト] --> GW[API Gateway]\n    GW -->|tenant_id 検証| D{ディスパッチャ}\n    D --> RT_A[Runtime A<br/>テナントA専用]\n    D --> RT_B[Runtime B<br/>テナントB専用]\n    RT_A --> M_A[(Memory\
    \ A)]\n    RT_B --> M_B[(Memory B)]\n    RT_A --> T_A[Tools A]\n    RT_B --> T_B[Tools B]\n```\n\nディスパッチャはテナントIDに基づき、専用のランタイムインスタンス（またはコンテナ／名前空間）へルーティングします。メモリストアはテナントごとにスキーマまたはプレフィックスで分離し、ツールバインディングにもテナント固有の認可スコープを適用します。ログにはテナントIDを必ず付与し、テナントをまたぐ検索を防ぐアクセス制御を設けます。"
  primary_decision: foundations/forces/f5-input-trust.md
  summary: "SaaS型のエージェントサービスで、ある顧客の問い合わせ内容が別の顧客への回答に混入してしまったら、信頼の失墜だけでなく法的責任にも発展しかねません。複数テナントが同一インフラを共有する環境では、LLMのコンテキスト窓やメモリストア、ツール呼び出し先がテナント間で混在すると、プロンプトインジェクションや単純なバグによってこうした漏洩が起こりえます。\n\n本パターンでは、リクエスト受付時にテナントIDを検証し、以降の実行パス全体――コンテキスト、メモリ、ツールバインディング、ログ――をテナント単位で隔離します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度・`[F8]` 説明責任・規制\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
42:
  design: "```mermaid\nflowchart LR\n    U[ユーザー入力] --> FW_IN[入力ファイアウォール<br/>PII検出・マスク]\n    FW_IN --> AG[エージェント]\n    AG --> FW_OUT[出力ファイアウォール<br/>機密検査・除去]\n    FW_OUT --> R[レスポンス]\n    AG --> T[ツール呼び出し]\n\
    \    T --> FW_T[ツール境界検査]\n    FW_T --> EXT[外部システム]\n```\n\n入力側ではPII（氏名・メール・電話番号・クレジットカード番号等）を正規表現＋NERモデルで検出し、マスクまたはトークン化してからLLMに渡します。出力側では機密ラベル付きデータの露出がないかを検査します。ツール呼び出しの引数・戻り値についても同様に検査の対象とします。"
  primary_decision: foundations/forces/f5-input-trust.md
  summary: "ユーザーがクレジットカード番号や住所を含むメッセージを送ったとき、LLMがそれをそのまま要約やツール呼び出しの引数に含めてしまったら、深刻な情報漏洩になります。LLMは入力に含まれた個人情報や機密データを、意図せず出力に混入させることがあります。\n\n本パターンでは、エージェントへの入力前と出力後の両方にファイアウォール層を設置し、PII検出・機密分類・マスキング・ブロックを実行します。データが信頼境界を越えるたびに検査することで、プロンプトインジェクション経由の情報抽出にも対処できます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度・`[F8]` 説明責任・規制\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
43:
  design: '被害限定は単一コンポーネントではなく、複数の制約を組み合わせて実現します。


    1. **最小権限**: セッションごとにツール・データアクセスを必要最小限に束縛します

    2. **操作上限**: 1セッションあたりの書き込み回数・金額・影響範囲に上限を設けます

    3. **不可逆操作の遅延**: 削除・送金・公開などは即時実行せず、承認キューに入れます

    4. **影響範囲の分離**: 1エージェントが触れるリソースのスコープを限定します


    これらを重ねることで、単一の防御が破られても被害が全体に波及しません。'
  primary_decision: foundations/forces/f5-input-trust.md
  summary: "メールの本文に仕込まれた悪意ある指示により、エージェントが顧客データを外部に送信してしまう――プロンプトインジェクションによるこうした「騙し」を100%防ぐことは、現時点のLLMでは極めて困難です。\n\nConfused Deputy（混乱した代理人）問題とは、権限を持つ主体が第三者に騙されて、その権限を意図しない操作に使われてしまうことを指します。LLMエージェントは自然言語入力を信頼境界なく処理するため、間接プロンプトインジェクションにより「騙される」リスクが常にあります。本パターンは「騙されること自体は防げない」という前提に立ち、騙された場合でも被害半径（Blast\
    \ Radius）を最小化する設計を採ります。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
44:
  design: "```mermaid\nflowchart LR\n    U[信頼できない入力] --> Q[隔離LLM<br/>ツール権限なし]\n    Q -->|構造化中間表現| V[バリデーション]\n    V --> P[特権LLM<br/>ツール実行可]\n    P --> T[ツール / 副作用]\n```\n\n隔離LLMは自然言語の解析・分類・要約のみを行い、出力は JSON\
    \ スキーマ等の構造化フォーマットに制約します。バリデーション層でスキーマ検証・範囲チェックを行った後、特権LLMが構造化入力に基づいてツール呼び出しを実行します。特権LLMは生の自然言語入力に一切触れません。"
  primary_decision: foundations/forces/f5-input-trust.md
  summary: "メール本文を読んで自動返信するエージェントを考えてみましょう。もしメール本文にプロンプトインジェクションが仕込まれていたら、返信だけでなく送金や顧客データの送信といった副作用まで実行されてしまう可能性があります。外部入力を処理するLLMにそのままツール実行権限を与えることの危険性は大きいです。\n\n本パターンでは、信頼できない入力を扱う「隔離LLM（Quarantined LLM）」と、実際に副作用を実行する「特権LLM（Privileged\
    \ LLM）」を別プロセス・別権限で動かします。隔離LLMの出力は構造化された中間表現に限定し、特権LLMはその中間表現のみを入力として受け取る仕組みです。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F5]` 入力の信頼度・`[F2]` 失敗コスト\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
45:
  design: "```mermaid\nflowchart TB\n    BL[ビジネスロジック] --> AI[Agent Runtime Interface<br/>run / call_tool / get_state]\n    AI --> IM_A[実装A: LangGraph]\n    AI --> IM_B[実装B: 自前ループ]\n    AI --> IM_C[実装C:\
    \ OpenAI SDK]\n```\n\n抽象インタフェースは最小限の操作――`run(task)`, `call_tool(name, args)`, `get_state()`, `set_state()`――を定義します。各フレームワーク固有の機能はアダプタ層で変換します。ビジネスロジック（プロンプト、ワークフロー定義、検証ルール）はインタフェースの上に書き、実装の切り替えはDI（依存注入）や設定ファイルで行います。"
  primary_decision: decisions/tradeoffs-catalog/build-vs-buy.md
  summary: "半年前に選んだエージェントフレームワークの開発が停滞し、セキュリティパッチも出なくなった――フレームワークのライフサイクルが短いこの領域では、こうした事態は珍しくありません。コードベース全体がそのSDKに密結合していたら、移行は大規模な書き換えになってしまいます。\n\nLangChain、CrewAI、Semantic Kernel、OpenAI Agents SDK――エージェントフレームワークは乱立しており、いずれも成熟途上にあります。本パターンでは、エージェントの実行（ループ制御・ツール呼び出し・状態管理）を抽象インタフェースで囲い、実装を差し替え可能にします。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F9]` プロバイダ信頼度・`[F8]` 説明責任・規制\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の ビルド↔バイ・単一↔マルチプロバイダ\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
46:
  design: "```mermaid\nflowchart LR\n    APP[アプリケーション] -->|統一API| CL[互換レイヤー]\n    CL -->|OpenAI形式| M1[GPT-4o]\n    CL -->|Anthropic形式| M2[Claude]\n    CL -->|Gemini形式| M3[Gemini]\n    CL -->|OpenAI互換| M4[vLLM\
    \ / Ollama]\n```\n\n互換レイヤーは以下を担います: (1) リクエストの正規化（メッセージ形式、システムプロンプトの扱い）、(2) function calling / tool use スキーマの相互変換、(3) レスポンスの統一フォーマットへの変換、(4) トークン数・コストの統一計算。モデル固有のパラメータ（temperature、top_p等）はパススルーしますが、デフォルト値の差異は正規化します。"
  primary_decision: decisions/tradeoffs-catalog/single-vs-multi-provider.md
  summary: "OpenAIからAnthropicに切り替えたら、function callingの仕様が違ってコードが動かなくなった。急いでフォールバックしたいのに、プロバイダごとにAPIの呼び方が違うため即座に対応できない。こうした摩擦は、マルチモデル運用やプロバイダ障害対応で頻繁に発生します。\n\n本パターンでは、呼び出し側とモデルの間に互換レイヤーを挿入し、リクエスト／レスポンスの正規化、function\
    \ callingスキーマの変換、トークンカウントの統一を行います。OpenAI、Anthropic、Google、オープンソースモデルといったプロバイダ間の差異を吸収し、設定変更だけでモデルを切り替えられるようにします。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F9]` プロバイダ信頼度\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md)\
    \ の 単一↔マルチプロバイダ\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
47:
  design: '各エージェントは起動時またはデプロイ時にレジストリへ自身の能力を登録します。レジストリは以下のフィールドを持ちます:


    - `agent_id`: 一意識別子

    - `capabilities`: 対応可能なタスク種別のリスト

    - `tools`: バインドされたツール一覧と権限スコープ

    - `cost_profile`: 平均トークン消費・API呼び出し単価

    - `status`: active / degraded / offline

    - `version`: プロンプト・モデル・ツールのバージョン


    オーケストレータやルーターはレジストリを参照してタスクを適切なエージェントに振り分けます。監査時はレジストリのスナップショットから「誰が何をできたか」を再現できます。'
  primary_decision: foundations/forces/f8-accountability.md
  summary: "組織内のエージェントが10を超えたあたりから、「この質問はどのエージェントに聞けばいいのか」「あのエージェントにはどんな権限が付いているのか」が誰にも分からない状況が生まれやすくなります。インシデント時に影響範囲を特定しようとしても、属人知識に頼るしかないのでは対応が遅れてしまいます。\n\n本パターンでは、エージェントごとのメタデータ――能力記述、利用可能ツール、権限スコープ、コスト実績、ヘルスステータス――を構造化したレジストリに登録し、ディスカバリ・ルーティング・監査に利用します。いわば、サービスメッシュにおけるサービスレジストリのエージェント版です。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
48:
  design: "```mermaid\nflowchart LR\n    R[リクエスト] --> RT[ルーティング層]\n    RT -->|対象外| OLD[既存システム]\n    RT -->|対象| AG[エージェント]\n    AG -->|成功| RES[レスポンス]\n    AG -->|失敗/低信頼| OLD\n```\n\nルーティング層は、リクエストの種別・テナント・地域・信頼度スコア等に基づいて振り分けを決定します。初期は全トラフィックを既存システムに流しつつ、エージェントにもシャドーで送り、出力を比較します。品質が一定水準を満たしたカテゴリから順にエージェントへ切り替えていきます。エージェントが失敗した場合のフォールバック先として、既存システムは残しておきます。"
  primary_decision: foundations/forces/f2-failure-cost.md
  summary: "長年運用してきたルールベースの問い合わせ対応システムを、AIエージェントに一気に置き換えたら、想定外のケースで大量のエラーが発生した――こうしたビッグバンリリースの失敗は避けたい場面です。\n\nStrangler Fig（絞め殺しの木）パターンでは、既存システムの前段にルーティング層を置き、条件に合うトラフィックだけをエージェントに流します。成功が確認できたら対象を段階的に広げ、最終的に旧システムを退役させていきます。マーティン・ファウラーのStrangler\
    \ Fig Applicationパターンをエージェント導入に適用したものです。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト・`[F8]` 説明責任・規制\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の ビルド↔バイ\n    - **意思決定の進め方**:\
    \ [意思決定の進め方](../../decisions/decision-flow.md)"
49:
  design: "```mermaid\nflowchart TB\n    subgraph Workbench\n        PL[計画パネル<br/>ステップ一覧]\n        PR[進捗タイムライン<br/>完了/実行中/待機]\n        AR[成果物パネル<br/>中間出力プレビュー]\n        AP[承認パネル<br/>確認・修正・拒否]\n    end\n\
    \    AG[エージェント] -->|状態更新| PL\n    AG -->|ストリーミング| PR\n    AG -->|中間成果物| AR\n    AG -->|承認リクエスト| AP\n    AP -->|承認/拒否| AG\n```\n\nエージェントは各ステップの状態変更・中間成果物・承認リクエストをイベントとして発行します。Workbenchはこれらをリアルタイムで受信し、各パネルに反映します。ユーザーはタイムラインから過去のステップを確認したり、承認パネルから介入したりできます。"
  primary_decision: foundations/forces/f4-latency-budget.md
  summary: "エージェントに30分かかるリサーチを任せたとき、チャット画面で延々とメッセージを眺めるだけでは「いま何をしているのか」「いつ自分の判断が必要なのか」がわかりません。チャットUIだけでは、エージェントの長時間タスクを管理しきれません。\n\nAgent Workbenchは、チャットに加えて計画ビュー・進捗タイムライン・成果物パネル・承認ボタンを統合した操作画面を提供します。計画の全体像、各ステップの進捗、中間成果物のプレビュー、承認待ちの操作がひとつの画面で把握できるため、ユーザーは適切なタイミングで介入できます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F4]` レイテンシ予算\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
50:
  design: '1. ユーザーがタスクを指示

    2. エージェントが計画を生成し、構造化データ（JSON / YAML）としてUIに返す

    3. UIが計画をステップ一覧として表示。各ステップは編集・削除・並べ替え可能

    4. ユーザーが「実行」を押すと、編集後の計画でエージェントが動作

    5. 実行中に計画変更が必要になった場合、エージェントが再計画を提案し再度編集を受け付ける


    計画の構造は [#14 Structured Output Contract](../03-io-contract/14-structured-output-contract.md) でスキーマ化し、UIとエージェント間の契約とします。'
  primary_decision: decisions/tradeoffs-catalog/plan-vs-react.md
  summary: "エージェントに「競合分析レポートを作って」と依頼したら、見当違いの情報源を調べ始め、30分後に出来上がったレポートが的外れだった――実行前に計画を確認できていれば防げた失敗です。\n\nエージェントにタスクを依頼すると、内部的に実行計画（ステップの列）を生成します。この計画を「ブラックボックスのまま即実行」するのではなく、ユーザーに提示して編集の機会を与えます。ステップの追加・削除・並べ替え・パラメータ修正を受け付けたうえで実行に移ることで、エージェントの判断ミスを実行前に修正できます。探索的タスクほど計画の精度が低くなりやすいため\
    \ `[F6]`、人間による修正が大きな価値を持ちます。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F6]` タスクの変動性\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の Plan↔ReAct\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
51:
  design: "```mermaid\nflowchart LR\n    AG[エージェント] -->|自信度チェック| D{エスカレーション<br/>条件判定}\n    D -->|条件OK| EX[続行・実行]\n    D -->|条件NG| ES[エスカレーション]\n    ES -->|文脈・選択肢| H[人間オペレータ]\n    H -->|判断・指示| AG\n```\n\n\
    エスカレーション条件は以下のように定義します:\n\n- **確信度閾値**: モデルの出力スコアやセルフアセスメントが閾値を下回る\n- **権限不足**: 必要なツール権限がセッションにバインドされていない\n- **ポリシー違反**: [#30 Policy-as-Code Guardrail](../06-reliability/30-policy-as-code-guardrail.md)\
    \ が実行をブロック\n- **再試行上限**: 同一ステップの失敗回数が上限に達した\n\nエスカレーション時には、タスクの文脈・これまでの実行履歴・エージェントの判断候補と根拠を構造化して人間に渡します。人間は判断を下してエージェントに返すか、タスクを自ら引き取ります。"
  primary_decision: foundations/forces/f2-failure-cost.md
  summary: "カスタマーサポートのエージェントが、返金ポリシーの判断に迷ったまま誤った回答を送ってしまい、顧客とのトラブルに発展した――「分からない」ときに無理に答えるより、人間に引き継ぐほうがはるかに安全です。\n\nエージェントがすべてのタスクを自律的に完了できるわけではありません。判断の確信度が低い、必要な権限を持たない、ポリシーで自動実行が禁じられている――こうした状況で無理に続行すると、誤りが拡大してしまいます。本パターンでは、エージェントにエスカレーション条件を定義し、条件に該当した場合にタスクの文脈・進捗・判断根拠を人間に引き継ぎます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F2]` 失敗コスト・`[F4]` レイテンシ予算\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
52:
  design: 'Constitutionは階層構造を持ちます:


    1. **組織レベル**: 全エージェント共通の原則（データ保護方針、倫理規定、法令遵守）

    2. **ドメインレベル**: 業務領域固有のルール（金融なら適合性原則、医療なら診断禁止等）

    3. **エージェントレベル**: 個別エージェントの行動制約（操作範囲、権限上限）


    各レベルの原則はYAML / JSON等の機械可読形式で管理し、バージョン管理します。デプロイ時にテンプレートエンジンがシステムプロンプトに注入し、[#30 Policy-as-Code Guardrail](../06-reliability/30-policy-as-code-guardrail.md) のルールとしても展開します。'
  primary_decision: foundations/forces/f8-accountability.md
  summary: "あるエージェントは個人情報を含む回答を返し、別のエージェントは同じ質問をブロックする――システムプロンプトにアドホックで「やるな」「気をつけろ」と書いているだけでは、エージェント間で行動基準がばらつき、こうした不整合が生まれやすくなります。\n\nAgent Constitutionは、組織レベルの行動原則――倫理規定、データ取扱い方針、エスカレーション条件、禁止操作――を構造化した文書として定義し、全エージェントのシステムプロンプトやガードレールに自動的に注入する仕組みです。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制・`[F2]` 失敗コスト\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
53:
  design: "```mermaid\nflowchart LR\n    CH[変更提案<br/>プロンプト/モデル/ツール] --> VCS[バージョン管理]\n    VCS --> CI[評価CI<br/>回帰テスト]\n    CI -->|合格| CA[カナリアデプロイ<br/>少量トラフィック]\n    CA -->|品質OK| AP[承認]\n    AP --> PROD[本番展開]\n\
    \    CI -->|不合格| FB[フィードバック]\n    CA -->|品質NG| RB[ロールバック]\n```\n\n変更対象ごとの管理方法:\n\n- **プロンプト**: Git管理、差分レビュー、評価スイートで回帰検知\n- **モデル**: バージョンピン留め、切り替え前に評価実行、[#36 Shadow / Canary Deployment](../07-observability/36-shadow-canary-deployment.md)\
    \ で段階投入\n- **ツール**: 追加・削除・権限変更をPRベースで管理、影響範囲をレジストリで確認\n- **ポリシー / Constitution**: [#52 Agent Constitution](52-agent-constitution.md) の変更を含む"
  primary_decision: foundations/forces/f8-accountability.md
  summary: "チームメンバーがプロンプトを1行書き換えただけで、本番のエージェントが突然おかしな回答を返すようになった――しかし変更履歴がないため、誰が・いつ・何を変えたのかが分かりません。エージェントの世界では、こうした「見えない変更」が障害の原因になることが珍しくありません。\n\n従来のソフトウェアはコード変更をCI/CDで検証しますが、エージェントの「挙動」はプロンプト1行の変更で大きく変わりえます。モデルバージョンのアップデート、ツールの追加・削除、ポリシーの修正――いずれもコード変更と同等以上のインパクトを持ちます。本パターンでは、これらの変更をすべてバージョン管理し、評価スイートの実行・カナリアデプロイ・承認フローを経てから本番に適用する変更管理プロセスを構築します。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制・`[F9]` プロバイダ信頼度\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
54:
  design: "```mermaid\nflowchart LR\n    Agent[Agent] -->|emit| Collector[Collector / Buffer]\n    Collector --> Hot[(Hot Store<br/>直近N日)]\n    Hot -->|TTL超過| Cold[(Cold Store<br/>長期保存)]\n    Hot --> Dash[Dashboard\
    \ / Alert]\n    Cold --> Audit[監査・Replay]\n```\n\nCollectorがデータを受け取り、まずHot層（時系列DB・検索エンジン）へ書き込みます。TTLポリシーに基づいて、期限切れのデータをHot層からCold層（オブジェクトストレージ＋カラムナDB）へ移行します。監査やリプレイが必要なときは、Cold層からバッチクエリで取得します。"
  primary_decision: decisions/dials/trace-sampling-rate.md
  summary: "エージェントのトレースをすべてリアルタイム検索可能なDBに置いておくと、月間数百万リクエスト規模ではストレージ費用が急激に膨らんでいきます。かといって全部をオブジェクトストレージに移してしまうと、障害発生時に「直近1時間のトレースを見たい」という要求にすぐ応えられません。\n\n二層観測では、直近データ（数時間〜数日）をHot層に保持してリアルタイムのアラート・ダッシュボードに活用し、古いデータはCold層へ自動移行して長期保存・監査用途に備えます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F8]` 説明責任・規制・`[F7]` コスト感度・スケール\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の トレースサンプリング率・ログ保持期間\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
55:
  design: "```mermaid\nflowchart TD\n    P[\"親エージェント<br/>deadline=30s, budget=$0.50\"] -->|\"deadline=15s, budget=$0.20\"| C1[子エージェントA]\n    P -->|\"deadline=10s, budget=$0.15\"| C2[子エージェントB]\n    C1 -->|\"\
    deadline=5s, budget=$0.05\"| T1[ツール呼び出し]\n```\n\n各呼び出しで `{deadline, token_budget, cost_budget, max_steps}` をコンテキストとして渡します。子は受け取った予算を超えてはならず、自身がさらに委譲する場合は残りから按分します。deadlineはwall-clock時刻で渡し、クロックスキューの影響を受けにくくします。"
  primary_decision: decisions/dials/budget-cap.md
  summary: "親エージェントの期限が30秒なのに、子エージェントの1つが25秒を使い切ってしまったら、残りの子エージェントや後続処理は時間切れで動けなくなります。マルチエージェント構成では、こうした予算の食い潰しが容易に起きてしまいます。\n\nこのパターンでは、親が自身の残り期限（deadline）と残予算（トークン・金額・ステップ数）を子に明示的に渡し、子はその範囲内でのみ動作するようにします。これは、gRPCのdeadline\
    \ propagationと同じ考え方をエージェントの呼出ツリーに適用したものです。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F7]` コスト感度・スケール・`[F3]` 1リクエストの価値\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の 予算上限\n\
    \    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
56:
  design: リクエストを受けたら、まず軽量な難易度推定（入力の長さ・複雑度スコア・ドメイン分類）を行います。その推定結果に応じて、エージェントの実行パラメータを動的に設定します。具体的には、最大推論ステップ数、思考トークン上限（thinking budget）、検証器の起動有無、アンサンブル数などを調整します。また、推定が外れた場合に備えて、初回応答の自信度が低ければ上位の努力レベルで再試行するエスカレーション機構も組み込んでおきます。
  primary_decision: foundations/forces/f7-cost-sensitivity.md
  summary: "「明日の予定を教えて」と「この契約書のリスクを分析して」では、必要な推論の深さがまったく異なります。前者に5段階の検証を行うのは無駄であり、後者を1ステップで済ませるのは危険です。\n\n[#37 Semantic Gateway](37-semantic-gateway-cost-aware-router.md) がモデルを切り替えるのに対し、Adaptive Effortは同一モデル内でも投入する計算量を調整します。簡単なクエリには短い思考・少ないステップで即答し、複雑・高リスクなクエリにはChain-of-Thoughtの深化、複数パスの検証、追加のツール呼び出しを行います。「すべてに全力」ではなく、難易度と失敗コストに応じて計算資源を傾斜配分する考え方です。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F7]` コスト感度・スケール・`[F2]` 失敗コスト\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の モデル階層\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
57:
  design: '| レベル | 動作 | 人間の関与 |

    |--------|------|------------|

    | L0 | 提案を提示するのみ | 人間がすべて実行 |

    | L1 | 実行計画を提示し承認後に実行 | 事前承認 |

    | L2 | 自動実行し事後に通知 | 事後レビュー |

    | L3 | 完全自動。異常時のみ通知 | 例外時のみ |


    昇格条件は定量的に定めます（たとえば、直近100タスクの成功率が95%以上で L1→L2 に昇格するなど）。降格条件も同様に定め（重大インシデント発生で即時降格など）、一方通行にしないことが重要です。レベルはタスク種別ごとに独立して管理します。たとえば「メール下書きはL2だが、送金はL1」のように粒度を分けることができます。'
  primary_decision: decisions/dials/autonomy-level.md
  summary: "新しく配属された社員にいきなり全権限を渡すことはしません。まずは提案を出してもらい、上長が承認し、実績を見ながら徐々に裁量を広げていきます。エージェントの自律性も同じ発想で管理できます。最初から完全な自律権を与えるのはリスクが高いですが、すべてを人間承認にしてしまうと自動化の意味がなくなってしまいます。Autonomy Ladder は自律レベルを明示的な段階（たとえば L0\
    \ 提案のみ → L1 承認後実行 → L2 事後通知付き自動実行 → L3 完全自動）として定義し、エージェントの実績・成功率・失敗履歴に基づいてレベルを上下させる仕組みを導入するパターンです。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F1]` 可逆性・`[F2]` 失敗コスト\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md)\
    \ の 自律性レベル\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
58:
  design: "```mermaid\nflowchart TD\n    Req[リクエスト受信] --> Start[処理開始]\n    Start --> Timer{閾値内に完了?}\n    Timer -->|Yes| Sync[\"200 + 結果を返却\"]\n    Timer -->|No| Promote[\"ジョブ昇格<br/>202 + job_id\"]\n   \
    \ Promote --> Q[(Job Queue)]\n    Q --> W[Agent Worker]\n    W -->|完了通知| Client[SSE / Polling]\n```\n\n閾値は設定可能にし、ファサード内部ではタイマーと処理を並行して走らせます。昇格時には進行中の状態をそのままワーカーに引き継ぎます（プロセス間なら [#2 Durable Agent Session](02-durable-agent-session.md)\
    \ 経由）。"
  primary_decision: decisions/tradeoffs-catalog/sync-vs-async.md
  summary: "チャットボットに「こんにちは」と送ったのにポーリングやWebSocket接続を要求されるのは煩雑すぎます。かといって、重い調査タスクを同期で待たせるとタイムアウトします。同じエンドポイントに軽い処理と重い処理が混在する場合、一律のAPI設計ではどちらかを犠牲にせざるを得ません。\n\nこのパターンでは、同期ファサードがまず処理を開始し、閾値時間内に完了すればそのままレスポンスを返します。超えそうになった場合はバックグラウンドジョブに昇格させ、`202\
    \ Accepted + job_id` を返して非同期モードに切り替えます。\n\n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F4]` レイテンシ予算・`[F1]` 可逆性\n    - **関与する決定**: [程度（ダイヤル）](../../decisions/tuning-dials.md) の タイムアウト / [相反](../../decisions/tradeoffs.md)\
    \ の 同期↔非同期\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"
59:
  design: "スペクトラム上の位置付けを以下の軸で判断します。\n\n| 判断軸 | ワークフロー寄り | エージェント寄り |\n|--------|-----------------|-----------------|\n| 手順の変動性 `[F6]` | 定型・既知 | 探索的・未知 |\n| 失敗コスト `[F2]` | 高い（不可逆） | 低い（やり直し可） |\n| 説明責任 `[F8]`\
    \ | 監査必須 | ベストエフォート可 |\n\n```mermaid\nflowchart LR\n    T[サブタスク] --> Eval{変動性 x 失敗コスト}\n    Eval -->|\"低変動 x 高コスト\"| WF[決定論ワークフロー]\n    Eval -->|\"高変動 x 低コスト\"| AG[自律エージェント]\n    Eval -->|\"中間\"| HY[ガードレール付きエージェント]\n\
    ```"
  primary_decision: decisions/tradeoffs-catalog/workflow-vs-agent.md
  summary: "「ワークフローで固く組むべきか、エージェントに自由に任せるべきか」――チーム内でこの議論が堂々巡りになることは少なくありません。実際には、定型の請求処理と探索的なリサーチが同じシステムに同居しており、一律のアプローチでは片方が犠牲になりがちです。\n\nこのパターンでは、サブタスクごとにタスクの変動性 `[F6]` と失敗コスト `[F2]` を評価し、決定論的ワークフロー・ガードレール付きエージェント・自律エージェントのいずれで実行するかを選定します。設計時の判断フレームワークとして使えるほか、実行時に動的に切り替える仕組みとしても構成できます。\n\
    \n!!! info \"意思決定上の位置づけ\"\n    - **必要にするフォース**: `[F6]` タスクの変動性・`[F2]` 失敗コスト\n    - **関与する決定**: [相反](../../decisions/tradeoffs.md) の ワークフロー↔エージェント・シングル↔マルチエージェント\n    - **意思決定の進め方**: [意思決定の進め方](../../decisions/decision-flow.md)"

