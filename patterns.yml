    summary: '「今日の天気は？」という質問と、複雑な法律文書の要約を、同じ最高性能モデルで処理する必要はありません。しかし、全リクエストを大型モデルに送っていればAPI費用は線形に膨張しますし、すべてを安価なモデルに任せれば複雑なタスクの品質が落ちてしまいます。


      セマンティックゲートウェイはリクエストを受け取り、難易度分類・価値推定・コスト制約をもとに最適なモデルへルーティングします。単純な質問は軽量モデルで即答し、複雑な推論は大型モデルへ送ります。これにより、平均コストを大幅に下げつつ品質を維持できます。'
    design: "```mermaid\nflowchart LR\n    Req[リクエスト] --> GW[Semantic Gateway]\n    GW -->|簡単| Small[軽量モデル]\n    GW -->|複雑| Large[大型モデル]\n    GW -->|高価値| Premium[最高性能モデル]\n    Small --> Res[レスポンス]\n   \
      \ Large --> Res\n    Premium --> Res\n```\n\nゲートウェイはリクエストを軽量な分類器（小型LLM、ルールベース、Embedding分類）で難易度判定し、コスト予算テーブルと照合してモデルを選定します。分類器自体のコスト・レイテンシが低いことが前提となります。また、分類ミスへの備えとして、回答品質が低ければ上位モデルで再試行するフォールバックも設計に含めておきます。"
