    summary: '長年運用してきたルールベースの問い合わせ対応システムを、AIエージェントに一気に置き換えたら、想定外のケースで大量のエラーが発生した――こうしたビッグバンリリースの失敗は避けたい場面です。


      Strangler Fig（絞め殺しの木）パターンでは、既存システムの前段にルーティング層を置き、条件に合うトラフィックだけをエージェントに流します。成功が確認できたら対象を段階的に広げ、最終的に旧システムを退役させていきます。マーティン・ファウラーのStrangler Fig Applicationパターンをエージェント導入に適用したものです。'
    design: "```mermaid\nflowchart LR\n    R[リクエスト] --> RT[ルーティング層]\n    RT -->|対象外| OLD[既存システム]\n    RT -->|対象| AG[エージェント]\n    AG -->|成功| RES[レスポンス]\n    AG -->|失敗/低信頼| OLD\n```\n\nルーティング層は、リクエストの種別・テナント・地域・信頼度スコア等に基づいて振り分けを決定します。初期は全トラフィックを既存システムに流しつつ、エージェントにもシャドーで送り、出力を比較します。品質が一定水準を満たしたカテゴリから順にエージェントへ切り替えていきます。エージェントが失敗した場合のフォールバック先として、既存システムは残しておきます。"
    primary_decision: foundations/forces/f2-failure-cost.md
- id: 11-ux
  roman: XI
  title: UI/UX・人間協調
  summary: チャットだけでは扱えない長時間・多段階・副作用付き作業を人間が御する面。
  patterns:
  - num: 49
    slug: agent-workbench
    title: Agent Workbench｜エージェントワークベンチ
    tagline: 計画/進捗/承認を一画面管理
    forces:
