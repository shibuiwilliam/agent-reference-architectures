    summary_plain: 全ツール・MCPサーバ呼び出しを単一ゲートウェイに集約し、認証・認可・レート制限・入力サニタイズ・監査ログを統一的に適用する。
    selection_criteria:
      primary_trigger: F5=mixed AND F8=high（複数ツール/MCPサーバの認可・監査一元化）
      skip_if:
      - 1–2ツールで認証不要
      - ゲートウェイレイテンシが許容不可
      combine_with:
        always:
        - 18
        if_mcp:
        - 21
        if_trace:
        - 32
      alternatives: []
    prevents_anti_patterns: []
    summary: 'エージェントが使えるツールは、検索API、データベース、メール送信、ファイル操作など多岐にわたります。これらに個別に接続していると、「誰がどのツールをいつ呼んだか」の追跡が困難になり、認可ポリシーもツールごとにバラバラになりがちです。


      本パターンでは、すべてのツール呼び出しをゲートウェイ経由に統一し、認証・認可・レート制限・入出力ログを単一のレイヤーで処理します。新しいツールを追加する際も、ゲートウェイに登録するだけで既存のポリシーがそのまま適用されます。'
    design: "```mermaid\nflowchart LR\n    AG[Agent] -->|tool call| GW[Tool Gateway]\n    GW -->|authz check| POL[Policy Engine]\n    GW -->|rate limit| RL[Rate Limiter]\n    GW -->|proxy| T1[Tool A]\n\
      \    GW -->|proxy| T2[MCP Server B]\n    GW -->|proxy| T3[Tool C]\n    GW -->|audit log| LOG[(Audit Store)]\n```\n\nゲートウェイはリバースプロキシとして動作し、各リクエストに対して (1) 認可判定、(2) レート制限、(3) 入力サニタイズ、(4) プロキシ転送、(5) レスポンスログ記録を順に行います。また、ツール定義（スキーマや説明文）もゲートウェイが集約し、エージェントに対して一元的に公開します。"
    primary_decision: decisions/tradeoffs-catalog/llm-vs-tool.md
  - num: 18
    slug: least-privilege-tool-binding
    title: Least-Privilege Tool Binding｜最小権限バインディング
    tagline: セッション毎に最小権限を束縛
    forces:
