    summary_plain: セッション開始時にタスク種別・ユーザーロール・リスクレベルに基づいてエージェントに見えるツールセットを動的に制限し、不要なツールへのアクセスを構造的に排除する。
    selection_criteria:
      primary_trigger: F5=low AND F2=high（10以上のツールまたはマルチテナント）
      skip_if:
      - 2–3ツールで全ユーザー同一権限
      - 探索的ディスカバリが必要
      combine_with:
        always:
        - 17
        if_damage_limit:
        - 43
        if_dual_llm:
        - 44
      alternatives: []
    prevents_anti_patterns:
    - ap-10
    summary: 'たとえば、問い合わせ対応用のエージェントにデータベースの削除権限やインフラ変更用のツールまで見えていたら、プロンプトインジェクション一発で取り返しのつかない操作が実行されかねません。ツール数が増えるほど、こうした「使う予定のないツールが呼ばれてしまう」事故のリスクは増大します。


      本パターンでは、セッション開始時にタスク種別・ユーザー権限・コンテキストに基づいて、利用可能なツールセットを動的に絞り込みます。エージェントから見ると「存在しないツールはそもそも呼べない」ため、攻撃面と事故の影響範囲を構造的に縮小できます。'
    design: 'セッション開始時に Binder がユーザーのロール、タスク種別、リスクレベルを評価し、ツールカタログから該当セッションで許可するツールだけを抽出してエージェントに注入します。セッション途中でツールを追加する場合は、あらためて再評価を経る必要があります。


      権限の粒度はツール単位にとどまらず、ツール内のパラメータ制約（たとえば `delete` は禁止し `read` のみ許可するなど）まで含めることができます。'
    primary_decision: decisions/dials/exposed-tool-count.md
  - num: 19
    slug: dry-run-first-tool-execution
    title: Dry-Run First Tool Execution｜ドライラン優先実行
    tagline: 副作用はまず模擬実行→承認
    forces:
    - F1
    - F2
    related:
    - 4
    - 31
    - 15
    dials: []
    tradeoffs: []
    when_to_use: データ変更（削除・API書き込み）、インフラ変更（Terraform的操作）
    when_not:
