    design: "```mermaid\nflowchart LR\n    Gen[生成エージェント] -->|ドラフト| V[Verifier / Critic]\n    V -->|合格| Out[最終出力]\n    V -->|不合格 + 理由| Gen\n```\n\n検証の実装は複数の手法を組み合わせることができます。たとえば、LLMベースの批評（「この回答に事実誤認はないか」）、ルールベースのチェック（JSON\
