    summary: エージェントが顧客への送金を実行しようとしている、本番データベースのテーブルを削除しようとしている――こうした場面で、もし判断が間違っていたら取り返しがつきません。エージェントの自律性が高まるほど、誤った判断が不可逆な結果をもたらすリスクも増していきます。Human Approval Checkpoint は、ワークフロー上の特定ポイントでエージェントの実行を一時停止し、人間に「承認/却下/修正」の判断を求めるパターンです。承認待ちの間、エージェントのセッション状態は永続化され、承認が得られた後に処理を再開します。
    design: "```mermaid\nflowchart LR\n    Agent[エージェント] -->|高リスク操作| CP[Checkpoint<br/>一時停止]\n    CP -->|通知| Human[人間レビュアー]\n    Human -->|承認| Resume[実行再開]\n    Human -->|却下| Cancel[中止 / 代替]\n    Human\
      \ -->|修正| Agent\n```\n\nチェックポイントの配置は、操作の不可逆性 `[F1]` と失敗コスト `[F2]` に基づいて決めます。すべてのステップに承認を入れるとスループットが大幅に低下するため、リスク評価に基づく選択的な配置が重要になります。承認リクエストには操作の要約・影響範囲・根拠を含め、人間が短時間で判断できるようにしておきます。"
