# patterns.yml — 59パターンの正本（single source of truth）
# scripts/scaffold.py がこのファイルから docs/ 配下のスタブを生成します。
# scripts/generate.py がこのファイル + decisions.yml から機械可読成果物を生成します。
# 新パターンの追加・改名・並び替えは必ずここで行い、mkdocs.yml の nav も合わせて更新すること。

version: "1.0.0"

site:
  title: "AIエージェント本番アーキテクチャ・パターン"
  principle: "確率的なコアを、決定論的な殻——契約・検証・予算・権限・観測——で囲む。"

forces:
  - { id: F1, name: 可逆性, note: "失敗をやり直せるか" }
  - { id: F2, name: 失敗コスト, note: "金銭/法務/安全の痛み" }
  - { id: F3, name: 1リクエストの価値, note: "売上/意思決定への寄与" }
  - { id: F4, name: レイテンシ予算, note: "ユーザーの待機耐性" }
  - { id: F5, name: 入力の信頼度, note: "攻撃/汚染の混入可能性" }
  - { id: F6, name: タスクの変動性, note: "定型↔探索" }
  - { id: F7, name: コスト感度・スケール, note: "QPS・月間コスト上限" }
  - { id: F8, name: 説明責任・規制, note: "監査・コンプラ要件" }
  - { id: F9, name: プロバイダ信頼度, note: "外部LLMの可用性" }

categories:
  - id: "01-execution"
    roman: "I"
    title: "実行・セッション・オーケストレーション"
    summary: "長時間・予測不能・失敗しうる実行を、Web層から切り離して安全に走らせる土台。"
    patterns:
      - num: 1
        slug: request-to-job-gateway
        title: "Request-to-Job Gateway｜非同期受付ゲートウェイ"
        tagline: "1リクエストを非同期ジョブとして受け付ける"
        forces: [F4, F1]
        related: [2, 7, 58]
        dials: [timeout]
        tradeoffs: [sync-vs-async, push-vs-pull]
        when_to_use: "マルチステップの調査・コンテンツ生成・分析など、数秒〜数分かかるタスク"
        when_not: ["F4=低（数秒以内に同期で完了できるタスク）"]
        element_tech: [FastAPI, "Next.js API Routes", SQS, "Cloud Pub/Sub", Kafka, "Cloud Tasks", Celery, Redis, PostgreSQL, SSE, WebSocket]
      - num: 2
        slug: durable-agent-session
        title: "Durable Agent Session｜耐久エージェントセッション"
        tagline: "状態を永続化し中断・再開に耐える"
        forces: [F1]
        related: [1, 6, 4, 32]
        dials: [checkpoint-frequency]
        tradeoffs: [in-context-vs-external]
        when_to_use: "マルチステップの研究・コード生成・データパイプライン、ローリングデプロイ環境"
        when_not: ["単発LLM呼び出し", "シリアライズコストが利益を上回るリアルタイム対話"]
        element_tech: [Redis, PostgreSQL, DynamoDB, Temporal, "Azure Durable Functions", "JSON/Protobuf"]
      - num: 3
        slug: workflow-backbone-agent-node
        title: "Workflow Backbone + Agent Node｜決定論骨格＋ノード"
        tagline: "骨格は決定論、判断だけ委譲"
        forces: [F6, F8]
        related: [59, 11, 5, 14]
        dials: []
        tradeoffs: [workflow-vs-agent]
        when_to_use: "固定手順にAI判断を組み込む場面、規制業種で再現性が必要"
        when_not: ["F6=高（探索的タスク）", "手順が動的に変化する場合"]
        element_tech: [Temporal, Airflow, "Step Functions", Prefect, Hatchet, LangGraph, "OpenAI Agents SDK"]
      - num: 4
        slug: agent-saga
        title: "Agent Saga｜補償トランザクション"
        tagline: "副作用連鎖を補償で巻き戻す"
        forces: [F1, F2]
        related: [2, 19, 31, 1]
        dials: [checkpoint-frequency]
        tradeoffs: []
        when_to_use: "複数外部システムへの書き込み連鎖（カレンダー→チケット→メール）"
        when_not: ["読み取り専用", "単一サービスのDBトランザクションで完結", "物理的に不可逆な操作"]
        element_tech: [Temporal, "Step Functions", "冪等キー"]
      - num: 5
        slug: time-budgeted-agent-loop
        title: "Time-Budgeted Agent Loop｜予算付きループ"
        tagline: "時間・回数・コストを予算化し暴走を止める"
        forces: [F7, F3]
        related: [55, 6, 37]
        dials: [budget-cap, timeout]
        tradeoffs: []
        when_to_use: "SaaSでのコスト制限、マルチテナントの公平性確保"
        when_not: ["バッチで必要な分だけ使う方針（ただしコスト上限は常に推奨）"]
        element_tech: ["フレームワーク callback/middleware", "LLM usage API", "ツール呼び出しカウンタ"]
      - num: 6
        slug: interruptible-agent
        title: "Interruptible Agent｜中断可能エージェント"
        tagline: "途中で停止・方針修正できる"
        forces: [F4]
        related: [2, 5, 31, 7]
        dials: []
        tradeoffs: []
        when_to_use: "長時間稼働のインタラクティブエージェント、人間が途中で方針変更する場面"
        when_not: ["サブ秒完了タスク", "フラグチェックのオーバーヘッドが許容できない超低レイテンシパス"]
        element_tech: ["Redis Pub/Sub", "DB flag", WebSocket, "graceful shutdown"]
      - num: 7
        slug: streaming-progress
        title: "Streaming Progress｜進捗ストリーミング"
        tagline: "過程を監査可能な要約で逐次表示"
        forces: [F4]
        related: [1, 6, 32]
        dials: []
        tradeoffs: [push-vs-pull]
        when_to_use: "5秒以上のタスク、ユーザーのインタラクティブ監視、規制トレースログ"
        when_not: ["サブ秒処理", "バッチのサイレントモード"]
        element_tech: [SSE, WebSocket, "gRPC streaming", "Redis Streams", Kafka, "JSON Lines"]
      - num: 55
        slug: deadline-budget-cascade
        title: "Deadline & Budget Cascade｜期限・予算のカスケード"
        tagline: "期限・予算を呼出ツリーへ伝播"
        forces: [F7, F3]
        related: [5, 9, 37]
        dials: [budget-cap]
        tradeoffs: []
        when_to_use: "マルチエージェント構成、再帰的ツール呼び出し、SaaSの厳格なコスト制限"
        when_not: ["単一エージェントの1ショット", "オーバーヘッドが利益を超える軽量タスク"]
        element_tech: ["gRPC metadata", "HTTP header context", "コンテキストオブジェクト"]
      - num: 58
        slug: sync-facade-over-async-core
        title: "Sync Facade over Async Core｜同期ファサード"
        tagline: "短ければ同期、超えたら非同期へ昇格"
        forces: [F4, F1]
        related: [1, 2, 7]
        dials: [timeout]
        tradeoffs: [sync-vs-async]
        when_to_use: "軽い挨拶と重い調査が同じエンドポイントに混在するハイブリッドワークロード"
        when_not: ["一様に高速または低速", "全非同期専用クライアント設計"]
        element_tech: ["FastAPI asyncio.wait_for", "Next.js AbortController"]
      - num: 59
        slug: workflow-agent-spectrum-selector
        title: "Workflow–Agent Spectrum Selector｜選定メタ"
        tagline: "サブタスク毎に決定論↔自律を選定"
        forces: [F6, F2]
        related: [3, 11, 57, 48]
        dials: []
        tradeoffs: [workflow-vs-agent]
        when_to_use: "複数サブタスクのシステム設計、定型と探索が混在するタスク"
        when_not: ["単一タスクの自明なケース", "全て明確に定型または探索"]
        element_tech: ["スコアリングマトリクス", "動的分類器"]

  - id: "02-composition"
    roman: "II"
    title: "エージェント構成・分担"
    summary: "単一エージェントの能力・コンテキスト窓・自己誤認の限界を、役割分離で超える。"
    patterns:
      - num: 8
        slug: planner-executor-reviewer
        title: "Planner-Executor-Reviewer｜計画・実行・検証の分離"
        tagline: "計画/実行/検証を別ロールに分ける"
        forces: [F2, F3]
        related: [10, 28, 50, 5]
        dials: [self-correction-loops]
        tradeoffs: [plan-vs-react]
        when_to_use: "コード生成→テスト→修正、レポートのファクトチェック、検証基準が明確なマルチステップ調査"
        when_not: ["単純Q&A", "計算オーバーヘッドがタスクを上回る", "F4=低（リアルタイム）"]
        element_tech: ["LangGraph", "CrewAI", "LLM/ルール検証"]
      - num: 9
        slug: supervisor-specialist-agents
        title: "Supervisor & Specialist Agents｜統括と専門"
        tagline: "統括役が専門役へ委譲する"
        forces: [F6, F7]
        related: [8, 12, 47, 37]
        dials: []
        tradeoffs: [single-vs-multi-agent]
        when_to_use: "多様なタスク種別（FAQ/技術/請求）、マルチモーダル、ドメイン専門性が分離可能"
        when_not: ["タスク種別が少ない", "専門化の利益が薄い", "専門家間の密結合"]
        element_tech: ["LangGraph conditional routing", "OpenAI Swarm", "カスタムルーティング"]
      - num: 10
        slug: agent-ensemble-debate
        title: "Agent Ensemble & Debate｜アンサンブル・討論"
        tagline: "複数で解き合議・討論で頑健化"
        forces: [F2, F3]
        related: [8, 28, 37]
        dials: [best-of-n]
        tradeoffs: [same-vs-different-model]
        when_to_use: "高リスク判断（医療・金融）、正確性検証、不一致検出が高価値"
        when_not: ["大量低コストリクエスト（N倍コスト）", "主観的クリエイティブ", "F4=厳格（同期）"]
        element_tech: ["並列 asyncio/thread pool", "モデルミックス", "投票/スコアリング"]
      - num: 11
        slug: deterministic-core-probabilistic-edge
        title: "Deterministic Core, Probabilistic Edge｜決定論コア"
        tagline: "中核は決定論、周辺だけAI"
        forces: [F2, F8]
        related: [3, 14, 30]
        dials: []
        tradeoffs: [prompt-vs-code]
        when_to_use: "金融・保険・医療プロトコル、正確な金額・ロジックが必須"
        when_not: ["探索的リサーチ", "クリエイティブ生成", "ルールが曖昧でコード化困難"]
        element_tech: ["Drools/OPA", "ルールエンジン", "ステートマシン", "テンプレート+LLM"]
      - num: 12
        slug: blackboard
        title: "Blackboard｜共有黒板"
        tagline: "共有黒板で疎結合に協調"
        forces: [F6]
        related: [9, 23, 3]
        dials: []
        tradeoffs: [orchestration-vs-choreography]
        when_to_use: "複雑なマルチエージェント分析、動的なエージェント参加、探索的問題解決"
        when_not: ["固定順序ワークフロー（#3を使用）", "高競合の並行書き込み"]
        element_tech: ["Redis", "PostgreSQL JSONB", "Firebase", "Pub/Sub"]

  - id: "03-io-contract"
    roman: "III"
    title: "入出力・契約化"
    summary: "自然言語と確率的出力を、通常ソフトが安全に扱える「契約」に変換する境界。"
    patterns:
      - num: 13
        slug: natural-language-boundary-adapter
        title: "Natural Language Boundary Adapter｜自然言語境界"
        tagline: "自然言語を構造化意図へ変換"
        forces: [F5]
        related: [14, 16, 29]
        dials: []
        tradeoffs: []
        when_to_use: "明確なアクション分類（注文・チケット・検索）、有限のインテント種別"
        when_not: ["自由形式の創作", "インテント列挙が曖昧"]
        element_tech: ["LLM function calling", "Claude tool_use", "Rasa", "Dialogflow", "Amazon Lex", "JSON Schema", "Pydantic"]
      - num: 14
        slug: structured-output-contract
        title: "Structured Output Contract｜構造化出力契約"
        tagline: "出力をスキーマで契約化"
        forces: [F8]
        related: [13, 15, 30]
        dials: []
        tradeoffs: [structured-vs-freeform]
        when_to_use: "APIレスポンス生成、フォーム入力、データ抽出、ワークフロールーティング"
        when_not: ["自由テキスト（レポート・メール）", "フォーマットが表現力を潰す場合"]
        element_tech: ["OpenAI response_format", "Anthropic tool_use", "Pydantic", "Zod", "JSON Schema", "Instructor"]
      - num: 15
        slug: inverted-structured-output
        title: "Inverted Structured Output｜反転構造化出力"
        tagline: "最終実行でなく中間判断を出させる"
        forces: [F2]
        related: [14, 3, 19]
        dials: []
        tradeoffs: [llm-vs-tool]
        when_to_use: "承認・分類・ルーティング判断、判断のみ（実行はコード）"
        when_not: ["LLMが最終成果物を生成する場合（コード・テキスト）", "選択肢が無限"]
        element_tech: ["Function calling", "Enum actions", "決定論的 executor"]
      - num: 16
        slug: ambiguity-negotiation
        title: "Ambiguity Negotiation｜曖昧性交渉"
        tagline: "曖昧なら確認してから実行"
        forces: [F1, F2]
        related: [13, 31, 51]
        dials: []
        tradeoffs: []
        when_to_use: "可逆な操作、複数解釈可能な入力（ファイル削除）、スロット不足の入力"
        when_not: ["リアルタイム即時応答", "事前構造化されたフォーム入力"]
        element_tech: ["Confidence/logprobs", "スロット充填率", "インタラクティブUI"]

  - id: "04-tools-mcp"
    roman: "IV"
    title: "ツール・MCP・外部システム接続"
    summary: "「考える主体」が外部世界に副作用を起こすための、権限・隔離・冪等性の層。"
    patterns:
      - num: 17
        slug: tool-mcp-gateway
        title: "Tool / MCP Gateway｜ツール・MCPゲートウェイ"
        tagline: "ツール接続を集約し認可・監査"
        forces: [F5, F8]
        related: [18, 21, 32]
        dials: []
        tradeoffs: []
        when_to_use: "複数ツール/MCPシステム、マルチテナント、認可・監査の一元化が必要"
        when_not: ["1–2ツール", "認証不要", "超低レイテンシ不許容"]
        element_tech: ["MCP Gateway/Proxy", "Kong", "Envoy", "AWS API Gateway", "OPA/Cedar", "OpenTelemetry"]
      - num: 18
        slug: least-privilege-tool-binding
        title: "Least-Privilege Tool Binding｜最小権限バインディング"
        tagline: "セッション毎に最小権限を束縛"
        forces: [F5, F2]
        related: [17, 43, 44]
        dials: [exposed-tool-count]
        tradeoffs: []
        when_to_use: "10以上のツール、マルチテナント、ユーザー毎に異なる権限"
        when_not: ["2–3ツールで全ユーザー同一権限", "探索的ディスカバリが必要"]
        element_tech: ["MCP tools/list フィルタリング", "RBAC/ABAC", "OPA/Cedar"]
      - num: 19
        slug: dry-run-first-tool-execution
        title: "Dry-Run First Tool Execution｜ドライラン優先実行"
        tagline: "副作用はまず模擬実行→承認"
        forces: [F1, F2]
        related: [4, 31, 15]
        dials: []
        tradeoffs: []
        when_to_use: "データ変更（削除・API書き込み）、インフラ変更（Terraform的操作）"
        when_not: ["読み取り専用", "失敗コスト低", "リアルタイム速度重視"]
        element_tech: ["--dry-run フラグ", "DB transaction→result→rollback", "API dryRun パラメータ", "diff-view UI"]
      - num: 20
        slug: sandboxed-tool-runtime
        title: "Sandboxed Tool Runtime｜サンドボックス実行"
        tagline: "コード/操作を隔離環境で実行"
        forces: [F5]
        related: [18, 21, 43]
        dials: []
        tradeoffs: []
        when_to_use: "コード実行エージェント、データ分析、ユーザー提供コード、CI/CD"
        when_not: ["直接FS/ネットアクセスが必須", "デプロイ/sysadmin ネイティブ"]
        element_tech: ["Docker gVisor", "Firecracker", "WASM", "AWS Lambda", "Cloud Run", "Modal", "cgroups/seccomp"]
      - num: 21
        slug: mcp-adapter-isolation
        title: "MCP Adapter Isolation｜MCPアダプタ分離"
        tagline: "MCPを信頼境界ごとに分離"
        forces: [F5, F8]
        related: [17, 20, 41]
        dials: []
        tradeoffs: []
        when_to_use: "信頼度が異なるアダプタの混在（内部DB＋外部API）、PCI-DSS規制データ"
        when_not: ["単一アダプタ", "全て同一信頼レベル", "分離コストが利益を超える"]
        element_tech: ["Kubernetes Pod/Sidecar", "Docker Compose", "stdio/SSE MCP transport", "Vault", "AWS Secrets Manager"]
      - num: 22
        slug: anti-corruption-layer
        title: "Anti-Corruption Layer｜アンチコラプション層"
        tagline: "レガシーとの概念汚染を防ぐ翻訳層"
        forces: [F8]
        related: [48, 17, 14]
        dials: []
        tradeoffs: []
        when_to_use: "レガシーシステム統合、外部APIモデルの正規化"
        when_not: ["外部モデルが内部と一致", "変換オーバーヘッドが無視できる"]
        element_tech: ["Adapter/Facade パターン", "MCP as ACL", "Protocol Buffers", "GraphQL スキーマ変換"]

  - id: "05-memory-context"
    roman: "V"
    title: "メモリ・コンテキスト管理"
    summary: "コンテキスト窓の有限性と、主体を跨ぐ状態受け渡しを扱う。"
    patterns:
      - num: 23
        slug: layered-memory
        title: "Layered Memory｜階層化メモリ"
        tagline: "短期/長期/共有に記憶を階層化"
        forces: [F8]
        related: [24, 25, 26, 12]
        dials: [summarization-timing]
        tradeoffs: [in-context-vs-external]
        when_to_use: "長時間ユーザー対話、マルチエージェント協調、パーソナライズが必要"
        when_not: ["ステートレスな単発Q&A", "階層のオーバーヘッドが利益を超える"]
        element_tech: ["Redis TTL", "PostgreSQL+pgvector", "Pinecone", "Weaviate", "LLM要約"]
      - num: 24
        slug: context-pack-assembly
        title: "Context Pack / Assembly｜コンテキスト組立・RAG"
        tagline: "文脈を組み立てグラウンディング"
        forces: [F4, F7]
        related: [23, 27, 39]
        dials: [retrieval-top-k]
        tradeoffs: [rag-vs-finetuning]
        when_to_use: "社内ナレッジ、サポート、法務・医療の最新情報依存"
        when_not: ["モデルの汎用知識で十分", "極端なリアルタイムストリーム要求"]
        element_tech: ["Pinecone", "pgvector", "Cohere Rerank", "HyDE", "RecursiveCharacterTextSplitter"]
      - num: 25
        slug: memory-write-gate
        title: "Memory Write Gate｜メモリ書き込みゲート"
        tagline: "長期保存を承認制にする"
        forces: [F8]
        related: [23, 26, 31]
        dials: [memory-write-eagerness]
        tradeoffs: []
        when_to_use: "顧客対話履歴、医療・法務記録、マルチセッションのパーソナライズ"
        when_not: ["使い捨てタスク", "ステートレス", "ゲートのオーバーヘッドが不適"]
        element_tech: ["Presidio", "DLP", "NER", "ルール/LLM分類", "メタデータ付きKVS/VectorDB"]
      - num: 26
        slug: forgetting-and-expiration
        title: "Forgetting and Expiration｜忘却・失効"
        tagline: "記憶に失効・鮮度を持たせる"
        forces: [F8]
        related: [23, 25, 32]
        dials: [memory-ttl]
        tradeoffs: []
        when_to_use: "顧客データの継続性、ニュース・市場情報の鮮度、GDPR/データ保持コンプライアンス"
        when_not: ["法的アーカイブ（失効ではなく保持が必要）", "不変のマスタデータ"]
        element_tech: ["Redis TTL", "DynamoDB TTL", "PostgreSQL パーティションプルーニング", "cron/Cloud Scheduler"]

  - id: "06-reliability"
    roman: "VI"
    title: "信頼性・検証・ガードレール・自律"
    summary: "ハルシネーションと逸脱を出荷前に検出し回復する層。目的は制御でなく封じ込め。"
    patterns:
      - num: 27
