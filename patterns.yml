    element_tech:
    - OpenTelemetry
    - Langfuse
    - LangSmith
    - Arize Phoenix
    - ClickHouse
    - BigQuery
    - S3+Parquet
    summary_plain: エージェントの全ステップ（思考・ツール呼び出し・応答）を追記専用ログとして記録し、障害分析・監査・品質改善のための再生・追跡を可能にする。
