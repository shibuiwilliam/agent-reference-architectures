    prevents_anti_patterns:
    - ap-02
    summary: 新しく配属された社員にいきなり全権限を渡すことはしません。まずは提案を出してもらい、上長が承認し、実績を見ながら徐々に裁量を広げていきます。エージェントの自律性も同じ発想で管理できます。最初から完全な自律権を与えるのはリスクが高いですが、すべてを人間承認にしてしまうと自動化の意味がなくなってしまいます。Autonomy Ladder は自律レベルを明示的な段階（たとえば L0
      提案のみ → L1 承認後実行 → L2 事後通知付き自動実行 → L3 完全自動）として定義し、エージェントの実績・成功率・失敗履歴に基づいてレベルを上下させる仕組みを導入するパターンです。
    design: '| レベル | 動作 | 人間の関与 |

      |--------|------|------------|

      | L0 | 提案を提示するのみ | 人間がすべて実行 |

      | L1 | 実行計画を提示し承認後に実行 | 事前承認 |

      | L2 | 自動実行し事後に通知 | 事後レビュー |

      | L3 | 完全自動。異常時のみ通知 | 例外時のみ |


      昇格条件は定量的に定めます（たとえば、直近100タスクの成功率が95%以上で L1→L2 に昇格するなど）。降格条件も同様に定め（重大インシデント発生で即時降格など）、一方通行にしないことが重要です。レベルはタスク種別ごとに独立して管理します。たとえば「メール下書きはL2だが、送金はL1」のように粒度を分けることができます。'
    primary_decision: decisions/dials/autonomy-level.md
- id: 07-observability
  roman: VII
  title: 観測性・監査・評価
  summary: 非決定論を観測・再現・回帰検知可能にし、デプロイ＝挙動変更を規律化する。
  patterns:
  - num: 32
    slug: agent-trace
    title: Agent Trace｜エージェントトレース
