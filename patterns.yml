    summary_plain: プロンプト・モデル・ツール・ポリシーの全変更をGit管理し、評価スイート実行・カナリアデプロイ・PR承認フローを経て本番適用することで見えない変更による障害を防ぐ。
    selection_criteria:
      primary_trigger: F8=high OR F9=low（本番運用エージェント・規制産業・複数人開発）
      skip_if:
      - 実験フェーズで素早くイテレーション
      - 単独開発者のPoC
      combine_with:
        always:
        - 34
        if_canary:
        - 36
        if_constitution:
        - 52
        if_pinning:
        - 33
      alternatives: []
    prevents_anti_patterns: []
    summary: 'チームメンバーがプロンプトを1行書き換えただけで、本番のエージェントが突然おかしな回答を返すようになった――しかし変更履歴がないため、誰が・いつ・何を変えたのかが分かりません。エージェントの世界では、こうした「見えない変更」が障害の原因になることが珍しくありません。


      従来のソフトウェアはコード変更をCI/CDで検証しますが、エージェントの「挙動」はプロンプト1行の変更で大きく変わりえます。モデルバージョンのアップデート、ツールの追加・削除、ポリシーの修正――いずれもコード変更と同等以上のインパクトを持ちます。本パターンでは、これらの変更をすべてバージョン管理し、評価スイートの実行・カナリアデプロイ・承認フローを経てから本番に適用する変更管理プロセスを構築します。'
    design: "```mermaid\nflowchart LR\n    CH[変更提案<br/>プロンプト/モデル/ツール] --> VCS[バージョン管理]\n    VCS --> CI[評価CI<br/>回帰テスト]\n    CI -->|合格| CA[カナリアデプロイ<br/>少量トラフィック]\n    CA -->|品質OK| AP[承認]\n    AP --> PROD[本番展開]\n\
      \    CI -->|不合格| FB[フィードバック]\n    CA -->|品質NG| RB[ロールバック]\n```\n\n変更対象ごとの管理方法:\n\n- **プロンプト**: Git管理、差分レビュー、評価スイートで回帰検知\n- **モデル**: バージョンピン留め、切り替え前に評価実行、[#36 Shadow / Canary Deployment](../07-observability/36-shadow-canary-deployment.md)\
      \ で段階投入\n- **ツール**: 追加・削除・権限変更をPRベースで管理、影響範囲をレジストリで確認\n- **ポリシー / Constitution**: [#52 Agent Constitution](52-agent-constitution.md) の変更を含む"
    primary_decision: foundations/forces/f8-accountability.md
