# patterns.yml — 59パターンの正本（single source of truth）
# scripts/scaffold.py がこのファイルから docs/ 配下のスタブを生成します。
# scripts/generate.py がこのファイル + decisions.yml から機械可読成果物を生成します。
# 新パターンの追加・改名・並び替えは必ずここで行い、mkdocs.yml の nav も合わせて更新すること。

version: "1.1.0"

site:
  title: "AIエージェント本番アーキテクチャ・パターン"
  principle: "確率的なコアを、決定論的な殻——契約・検証・予算・権限・観測——で囲む。"

forces:
  - { id: F1, name: 可逆性, note: "失敗をやり直せるか" }
  - { id: F2, name: 失敗コスト, note: "金銭/法務/安全の痛み" }
  - { id: F3, name: 1リクエストの価値, note: "売上/意思決定への寄与" }
  - { id: F4, name: レイテンシ予算, note: "ユーザーの待機耐性" }
  - { id: F5, name: 入力の信頼度, note: "攻撃/汚染の混入可能性" }
  - { id: F6, name: タスクの変動性, note: "定型↔探索" }
  - { id: F7, name: コスト感度・スケール, note: "QPS・月間コスト上限" }
  - { id: F8, name: 説明責任・規制, note: "監査・コンプラ要件" }
  - { id: F9, name: プロバイダ信頼度, note: "外部LLMの可用性" }

categories:
  - id: "01-execution"
    roman: "I"
    title: "実行・セッション・オーケストレーション"
    summary: "長時間・予測不能・失敗しうる実行を、Web層から切り離して安全に走らせる土台。"
    patterns:
      - num: 1
        slug: request-to-job-gateway
        title: "Request-to-Job Gateway｜非同期受付ゲートウェイ"
        tagline: "1リクエストを非同期ジョブとして受け付ける"
        forces: [F4, F1]
        related: [2, 7, 58]
        dials: [timeout]
        tradeoffs: [sync-vs-async, push-vs-pull]
        when_to_use: "マルチステップの調査・コンテンツ生成・分析など、数秒〜数分かかるタスク"
        when_not: ["F4=低（数秒以内に同期で完了できるタスク）"]
        element_tech: [FastAPI, "Next.js API Routes", SQS, "Cloud Pub/Sub", Kafka, "Cloud Tasks", Celery, Redis, PostgreSQL, SSE, WebSocket]
        summary_plain: "ユーザーリクエストを即座にジョブIDで応答し、LLM処理をバックグラウンドで実行する。HTTPタイムアウトによる切断を防ぎ、Web層とエージェント層を独立にスケールさせる。"
        selection_criteria:
          primary_trigger: "F4=high（数秒〜数分かかるタスク）"
          skip_if: ["F4=low（数秒以内に同期で完了）", "オートコンプリートや単純分類"]
          combine_with:
            always: [2, 7]
            if_mixed_workload: [58]
          alternatives:
            - { pattern: 58, when: "同期・非同期が混在するハイブリッドワークロード" }
        prevents_anti_patterns: [ap-01, ap-07]
      - num: 2
        slug: durable-agent-session
        title: "Durable Agent Session｜耐久エージェントセッション"
        tagline: "状態を永続化し中断・再開に耐える"
        forces: [F1]
        related: [1, 6, 4, 32]
        dials: [checkpoint-frequency]
        tradeoffs: [in-context-vs-external]
        when_to_use: "マルチステップの研究・コード生成・データパイプライン、ローリングデプロイ環境"
        when_not: ["単発LLM呼び出し", "シリアライズコストが利益を上回るリアルタイム対話"]
        element_tech: [Redis, PostgreSQL, DynamoDB, Temporal, "Azure Durable Functions", "JSON/Protobuf"]
        summary_plain: "エージェントの状態を外部ストアにチェックポイント保存し、プロセス障害やローリングデプロイ後も最後の保存地点から再開できるようにする。"
        selection_criteria:
          primary_trigger: "F1=low（マルチステップの長時間タスクで中断・再開が必要）"
          skip_if: ["単発LLM呼び出し", "シリアライズコストが利益を上回るリアルタイム対話"]
          combine_with:
            always: [1]
            if_compensation_needed: [4]
            if_audit_required: [32]
          alternatives:
            - { pattern: "Temporal/Durable Functions", when: "ワークフローエンジンが耐久実行をネイティブ提供" }
        prevents_anti_patterns: []
      - num: 3
        slug: workflow-backbone-agent-node
        title: "Workflow Backbone + Agent Node｜決定論骨格＋ノード"
        tagline: "骨格は決定論、判断だけ委譲"
        forces: [F6, F8]
        related: [59, 11, 5, 14]
        dials: []
        tradeoffs: [workflow-vs-agent]
        when_to_use: "固定手順にAI判断を組み込む場面、規制業種で再現性が必要"
        when_not: ["F6=高（探索的タスク）", "手順が動的に変化する場合"]
        element_tech: [Temporal, Airflow, "Step Functions", Prefect, Hatchet, LangGraph, "OpenAI Agents SDK"]
        summary_plain: "決定論的なワークフローエンジンを骨格とし、判断が必要なノードだけをLLMエージェントに委譲する。再現性と監査性を確保しつつAI判断を組み込む。"
        selection_criteria:
          primary_trigger: "F6=low AND F8=high（固定手順＋規制要件）"
          skip_if: ["F6=high（探索的タスク）", "手順が動的に変化する場合"]
          combine_with:
            always: [14]
            if_budget_needed: [5]
          alternatives:
            - { pattern: 59, when: "サブタスクごとにワークフロー/エージェントを選定する必要がある" }
        prevents_anti_patterns: [ap-08]
      - num: 4
        slug: agent-saga
        title: "Agent Saga｜補償トランザクション"
        tagline: "副作用連鎖を補償で巻き戻す"
        forces: [F1, F2]
        related: [2, 19, 31, 1]
        dials: [checkpoint-frequency]
        tradeoffs: []
        when_to_use: "複数外部システムへの書き込み連鎖（カレンダー→チケット→メール）"
        when_not: ["読み取り専用", "単一サービスのDBトランザクションで完結", "物理的に不可逆な操作"]
        element_tech: [Temporal, "Step Functions", "冪等キー"]
        summary_plain: "複数外部システムへの書き込み連鎖で途中失敗した場合に、補償アクションを逆順に実行して一貫性を回復する分散Sagaパターンのエージェント版。"
        selection_criteria:
          primary_trigger: "F1=low AND F2=high（複数外部システムへの書き込み連鎖）"
          skip_if: ["読み取り専用", "単一サービスのDBトランザクションで完結", "物理的に不可逆な操作"]
          combine_with:
            always: [2, 19]
            if_approval_needed: [31]
          alternatives: []
        prevents_anti_patterns: []
      - num: 5
        slug: time-budgeted-agent-loop
        title: "Time-Budgeted Agent Loop｜予算付きループ"
        tagline: "時間・回数・コストを予算化し暴走を止める"
        forces: [F7, F3]
        related: [55, 6, 37]
        dials: [budget-cap, timeout]
        tradeoffs: []
        when_to_use: "SaaSでのコスト制限、マルチテナントの公平性確保"
        when_not: ["バッチで必要な分だけ使う方針（ただしコスト上限は常に推奨）"]
        element_tech: ["フレームワーク callback/middleware", "LLM usage API", "ツール呼び出しカウンタ"]
        summary_plain: "エージェントループに時間・ステップ数・トークン数・金額の予算を注入し、予算超過時にベスト・ソー・ファーの返却やエスカレーションで暴走を防ぐ。"
        selection_criteria:
          primary_trigger: "F7=high（コスト制約下でのエージェントループ）"
          skip_if: ["バッチで必要な分だけ使う方針（ただしコスト上限は常に推奨）"]
          combine_with:
            always: [55]
            if_cost_routing: [37]
          alternatives: []
        prevents_anti_patterns: [ap-01, ap-09]
      - num: 6
        slug: interruptible-agent
        title: "Interruptible Agent｜中断可能エージェント"
        tagline: "途中で停止・方針修正できる"
        forces: [F4]
        related: [2, 5, 31, 7]
        dials: []
        tradeoffs: []
        when_to_use: "長時間稼働のインタラクティブエージェント、人間が途中で方針変更する場面"
        when_not: ["サブ秒完了タスク", "フラグチェックのオーバーヘッドが許容できない超低レイテンシパス"]
        element_tech: ["Redis Pub/Sub", "DB flag", WebSocket, "graceful shutdown"]
        summary_plain: "実行中のエージェントに外部からの中断シグナルを安全に受け取るチェックポイントを挿入し、状態を保存した上で一時停止・再開を可能にする。"
        selection_criteria:
          primary_trigger: "F4=high（長時間稼働のインタラクティブエージェント）"
          skip_if: ["サブ秒完了タスク", "フラグチェックのオーバーヘッドが許容できない超低レイテンシパス"]
          combine_with:
            always: [2]
            if_budget: [5]
            if_approval: [31]
          alternatives: []
        prevents_anti_patterns: []
      - num: 7
        slug: streaming-progress
        title: "Streaming Progress｜進捗ストリーミング"
        tagline: "過程を監査可能な要約で逐次表示"
        forces: [F4]
        related: [1, 6, 32]
        dials: []
        tradeoffs: [push-vs-pull]
        when_to_use: "5秒以上のタスク、ユーザーのインタラクティブ監視、規制トレースログ"
        when_not: ["サブ秒処理", "バッチのサイレントモード"]
        element_tech: [SSE, WebSocket, "gRPC streaming", "Redis Streams", Kafka, "JSON Lines"]
        summary_plain: "5秒以上かかるタスクの各ステップを構造化された進捗イベントとしてSSE/WebSocket経由でリアルタイム配信し、ユーザーの体感待ち時間を短縮する。"
        selection_criteria:
          primary_trigger: "F4=high（5秒以上のタスクで体感レイテンシ管理が必要）"
          skip_if: ["サブ秒処理", "バッチのサイレントモード"]
          combine_with:
            always: [1]
            if_interrupt: [6]
          alternatives:
            - { pattern: "ポーリング", when: "永続接続が不可の環境" }
        prevents_anti_patterns: [ap-07]
      - num: 55
        slug: deadline-budget-cascade
        title: "Deadline & Budget Cascade｜期限・予算のカスケード"
        tagline: "期限・予算を呼出ツリーへ伝播"
        forces: [F7, F3]
        related: [5, 9, 37]
        dials: [budget-cap]
        tradeoffs: []
        when_to_use: "マルチエージェント構成、再帰的ツール呼び出し、SaaSの厳格なコスト制限"
        when_not: ["単一エージェントの1ショット", "オーバーヘッドが利益を超える軽量タスク"]
        element_tech: ["gRPC metadata", "HTTP header context", "コンテキストオブジェクト"]
        summary_plain: "マルチエージェントの呼び出しツリーで親の残り期限と予算を子に明示的に伝播し、子が孫に再分配することで全体の予算超過を防ぐ。"
        selection_criteria:
          primary_trigger: "F7=high AND マルチエージェント構成"
          skip_if: ["単一エージェントの1ショット", "伝播オーバーヘッドが利益を超える軽量タスク"]
          combine_with:
            always: [5]
            if_supervisor: [9]
          alternatives:
            - { pattern: 5, when: "単一レベルのエージェントで予算管理が十分" }
        prevents_anti_patterns: [ap-01]
      - num: 58
        slug: sync-facade-over-async-core
        title: "Sync Facade over Async Core｜同期ファサード"
        tagline: "短ければ同期、超えたら非同期へ昇格"
        forces: [F4, F1]
        related: [1, 2, 7]
        dials: [timeout]
        tradeoffs: [sync-vs-async]
        when_to_use: "軽い挨拶と重い調査が同じエンドポイントに混在するハイブリッドワークロード"
        when_not: ["一様に高速または低速", "全非同期専用クライアント設計"]
        element_tech: ["FastAPI asyncio.wait_for", "Next.js AbortController"]
        summary_plain: "全リクエストを同期で開始し閾値時間内に完了すれば即返却、超過すれば自動的に非同期ジョブに昇格して202＋ジョブIDを返す。"
        selection_criteria:
          primary_trigger: "F4=mixed（同じエンドポイントに高速・低速リクエストが混在）"
          skip_if: ["一様に高速または低速", "全非同期専用クライアント設計"]
          combine_with:
            always: [1, 2]
            if_progress: [7]
          alternatives:
            - { pattern: 1, when: "全リクエストが低速で常時非同期が適切" }
        prevents_anti_patterns: [ap-07]
      - num: 59
        slug: workflow-agent-spectrum-selector
        title: "Workflow–Agent Spectrum Selector｜選定メタ"
        tagline: "サブタスク毎に決定論↔自律を選定"
        forces: [F6, F2]
        related: [3, 11, 57, 48]
        dials: []
        tradeoffs: [workflow-vs-agent]
        when_to_use: "複数サブタスクのシステム設計、定型と探索が混在するタスク"
        when_not: ["単一タスクの自明なケース", "全て明確に定型または探索"]
        element_tech: ["スコアリングマトリクス", "動的分類器"]
        summary_plain: "サブタスクごとに変動性（F6）と失敗コスト（F2）を評価し、決定論的ワークフロー/ガード付きエージェント/完全自律エージェントを選定するメタパターン。"
        selection_criteria:
          primary_trigger: "F6=mixed AND F2=varied（定型と探索が混在するシステム設計時）"
          skip_if: ["単一タスクの自明なケース", "全て明確に定型または探索"]
          combine_with:
            always: [3]
            if_gradual: [57]
          alternatives:
            - { pattern: 3, when: "大半が定型でエージェントノードが少数" }
        prevents_anti_patterns: [ap-08]

  - id: "02-composition"
    roman: "II"
    title: "エージェント構成・分担"
    summary: "単一エージェントの能力・コンテキスト窓・自己誤認の限界を、役割分離で超える。"
    patterns:
      - num: 8
        slug: planner-executor-reviewer
        title: "Planner-Executor-Reviewer｜計画・実行・検証の分離"
        tagline: "計画/実行/検証を別ロールに分ける"
        forces: [F2, F3]
        related: [10, 28, 50, 5]
        dials: [self-correction-loops]
        tradeoffs: [plan-vs-react]
        when_to_use: "コード生成→テスト→修正、レポートのファクトチェック、検証基準が明確なマルチステップ調査"
        when_not: ["単純Q&A", "計算オーバーヘッドがタスクを上回る", "F4=低（リアルタイム）"]
        element_tech: ["LangGraph", "CrewAI", "LLM/ルール検証"]
        summary_plain: "計画・実行・検証を別ロールに分離し、Reviewerが検証基準に基づいて検査しフィードバックループで品質を担保する。"
        selection_criteria:
          primary_trigger: "F2=high AND F3=high（マルチステップ＋検証基準が明確）"
          skip_if: ["単純Q&A", "計算オーバーヘッドがタスクを上回る", "F4=low"]
          combine_with:
            always: [5]
            if_ensemble: [10]
            if_human_review: [50]
          alternatives:
            - { pattern: 28, when: "検証のみ必要で計画分離は不要" }
        prevents_anti_patterns: []
      - num: 9
        slug: supervisor-specialist-agents
        title: "Supervisor & Specialist Agents｜統括と専門"
        tagline: "統括役が専門役へ委譲する"
        forces: [F6, F7]
        related: [8, 12, 47, 37]
        dials: []
        tradeoffs: [single-vs-multi-agent]
        when_to_use: "多様なタスク種別（FAQ/技術/請求）、マルチモーダル、ドメイン専門性が分離可能"
        when_not: ["タスク種別が少ない", "専門化の利益が薄い", "専門家間の密結合"]
        element_tech: ["LangGraph conditional routing", "OpenAI Swarm", "カスタムルーティング"]
        summary_plain: "統括エージェントがインテント解釈とルーティングを担当し、ドメイン特化の専門エージェント群に最適化されたプロンプト・ツール・モデルで処理を委譲する。"
        selection_criteria:
          primary_trigger: "F6=high AND 多様なタスク種別"
          skip_if: ["タスク種別が少ない", "専門化の利益が薄い"]
          combine_with:
            if_registry: [47]
            if_budget: [55]
          alternatives:
            - { pattern: 12, when: "中央集権ルーティングがボトルネックになる場合" }
        prevents_anti_patterns: []
      - num: 10
        slug: agent-ensemble-debate
        title: "Agent Ensemble & Debate｜アンサンブル・討論"
        tagline: "複数で解き合議・討論で頑健化"
        forces: [F2, F3]
        related: [8, 28, 37]
        dials: [best-of-n]
        tradeoffs: [same-vs-different-model]
        when_to_use: "高リスク判断（医療・金融）、正確性検証、不一致検出が高価値"
        when_not: ["大量低コストリクエスト（N倍コスト）", "主観的クリエイティブ", "F4=厳格（同期）"]
        element_tech: ["並列 asyncio/thread pool", "モデルミックス", "投票/スコアリング"]
        summary_plain: "同一タスクを複数エージェント（異なるモデル・温度・プロンプト）で並列実行し、投票・スコアリング・討論で結果を集約して頑健性を高める。"
        selection_criteria:
          primary_trigger: "F2=high AND F3=high（不一致検出が高価値）"
          skip_if: ["大量低コストリクエスト（N倍コスト）", "主観的クリエイティブ", "F4=low"]
          combine_with:
            if_planning: [8]
          alternatives:
            - { pattern: 28, when: "コスト制約で単一検証器が十分" }
        prevents_anti_patterns: []
      - num: 11
        slug: deterministic-core-probabilistic-edge
        title: "Deterministic Core, Probabilistic Edge｜決定論コア"
        tagline: "中核は決定論、周辺だけAI"
        forces: [F2, F8]
        related: [3, 14, 30]
        dials: []
        tradeoffs: [prompt-vs-code]
        when_to_use: "金融・保険・医療プロトコル、正確な金額・ロジックが必須"
        when_not: ["探索的リサーチ", "クリエイティブ生成", "ルールが曖昧でコード化困難"]
        element_tech: ["Drools/OPA", "ルールエンジン", "ステートマシン", "テンプレート+LLM"]
        summary_plain: "金額計算・保険査定・規制判定などビジネスクリティカルなロジックを決定論的コードで実装し、LLMは自然言語の解釈と応答生成のみに限定する。"
        selection_criteria:
          primary_trigger: "F2=high AND F8=high（正確性と監査が必須）"
          skip_if: ["探索的リサーチ", "クリエイティブ生成", "ルールが曖昧でコード化困難"]
          combine_with:
            always: [14]
            if_workflow: [3]
            if_policy: [30]
          alternatives: []
        prevents_anti_patterns: [ap-08, ap-11]
      - num: 12
        slug: blackboard
        title: "Blackboard｜共有黒板"
        tagline: "共有黒板で疎結合に協調"
        forces: [F6]
        related: [9, 23, 3]
        dials: []
        tradeoffs: [orchestration-vs-choreography]
        when_to_use: "複雑なマルチエージェント分析、動的なエージェント参加、探索的問題解決"
        when_not: ["固定順序ワークフロー（#3を使用）", "高競合の並行書き込み"]
        element_tech: ["Redis", "PostgreSQL JSONB", "Firebase", "Pub/Sub"]
        summary_plain: "共有データストア（黒板）を介してエージェントが非同期に読み書きし、Controllerが状態変化を監視して次のエージェントを起動する疎結合協調。"
        selection_criteria:
          primary_trigger: "F6=high（実行順序が事前決定できない動的協調）"
          skip_if: ["固定順序ワークフロー", "高競合の並行書き込み"]
          combine_with:
            if_memory: [23]
            if_registry: [47]
          alternatives:
            - { pattern: 3, when: "実行順序が既知で決定論的骨格が適切" }
            - { pattern: 9, when: "中央ルーティングで十分な場合" }
