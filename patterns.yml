    summary: '保険の査定金額や融資審査の判定をLLMに任せたとしたら、同じ入力に対して毎回異なる金額が返ってくる可能性があります。これは業務として許容できません。「間違ってはならない処理」と「柔軟さが求められる処理」は本質的に異なります。


      決定論コア・確率論エッジは、ビジネスルール・状態遷移・金額計算・権限判定など確実性が必須の処理を従来のコードで書き、LLMの利用は自然言語の解釈、非構造データの分類、ユーザー向け文章の生成など柔軟さが必要な周辺に限定する構成です。'
