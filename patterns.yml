    summary_plain: テナントIDに基づきコンテキスト・メモリ・ツールバインディング・ログをテナント単位で物理的/論理的に隔離し、データ漏洩と相互干渉を構造的に防ぐ。
    selection_criteria:
      primary_trigger: F5=low AND F8=high（マルチテナントSaaS・規制業種）
      skip_if:
      - シングルテナント社内ツール
