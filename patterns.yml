        when: 実行順序が既知で決定論的骨格が適切
      - pattern: 9
        when: 中央ルーティングで十分な場合
    prevents_anti_patterns: []
    summary: '複数のエージェントが協調して1つの問題を解く場面で、エージェント同士を直接呼び出しで結合すると、参加者が増えるたびに接続が爆発的に増えてしまいます。会議室のホワイトボードのように、全員が同じ場所に書き込み・読み取りできる共有空間があれば、この複雑さを回避できます。


      Blackboard パターンは、共有のデータストア――黒板（Blackboard）――を介してエージェントを間接的に協調させる古典的なAIアーキテクチャです。各エージェント（Knowledge Source）は黒板を読み、自分が貢献できる部分があれば結果を書き込みます。コントローラが黒板の状態変化を監視し、次に動くべきエージェントを選択します。エージェント同士は互いの存在を知らなくてよい構造です。'
    design: "```mermaid\nflowchart TD\n    BB[(Blackboard<br/>共有状態)]\n    C[Controller] -->|監視・選択| BB\n    A1[Agent A] -->|読み書き| BB\n    A2[Agent B] -->|読み書き| BB\n    A3[Agent C] -->|読み書き| BB\n    C -->|起動指示|\
      \ A1\n    C -->|起動指示| A2\n    C -->|起動指示| A3\n```\n\n黒板はタスクの現在状態――入力データ、中間仮説、部分結果、最終出力――を構造化して保持します。各エージェントは黒板の特定領域を購読し、自分の専門で処理できる状態になったら結果を書き戻します。Controller は黒板の変化（新しい仮説の追加、信頼度の更新など）に基づいて次のエージェントを起動します。"
    primary_decision: decisions/tradeoffs-catalog/orchestration-vs-choreography.md
- id: 03-io-contract
  roman: III
  title: 入出力・契約化
  summary: 自然言語と確率的出力を、通常ソフトが安全に扱える「契約」に変換する境界。
  patterns:
  - num: 13
    slug: natural-language-boundary-adapter
    title: Natural Language Boundary Adapter｜自然言語境界
    tagline: 自然言語を構造化意図へ変換
    forces:
    - F5
    related:
    - 14
    - 16
    - 29
    dials: []
    tradeoffs: []
    when_to_use: 明確なアクション分類（注文・チケット・検索）、有限のインテント種別
    when_not:
    - 自由形式の創作
    - インテント列挙が曖昧
    element_tech:
    - LLM function calling
    - Claude tool_use
    - Rasa
    - Dialogflow
    - Amazon Lex
    - JSON Schema
    - Pydantic
    summary_plain: 自由形式のユーザー入力を構造化インテント（アクション・パラメータ・信頼度スコア）に変換し、下流の決定論的処理に安全に接続する境界アダプタ。
    selection_criteria:
      primary_trigger: F5=low（非構造化入力を構造化意図に変換が必要）
      skip_if:
      - 自由形式の創作
      - インテント列挙が曖昧
      combine_with:
        always:
        - 14
        if_ambiguous:
        - 16
        if_guardrail:
        - 29
      alternatives: []
    prevents_anti_patterns: []
    summary: 'ユーザーが「先月の売上レポートを出して」と言ったとき、「先月」はいつからいつまでか、「売上」はどの部門か、「出す」はメール送信なのか画面表示なのか。自然言語にはこうした曖昧さや省略が常につきまとい、そのまま下流に流すと処理ロジックを汚染してしまいます。


      本パターンは、入力の最前段に「翻訳層」を配置し、自由文を意図（intent）・パラメータ（slots）・確信度（confidence）に分解します。下流は構造化された契約だけを受け取るため、通常のバリデーションやルーティングをそのまま適用できます。'
    design: "```mermaid\nflowchart LR\n    U[ユーザー] -->|自然言語| NLB[Boundary Adapter]\n    NLB -->|\"{ intent, slots, confidence }\"| V[Validator]\n    V -->|valid| R[Router / Executor]\n    V -->|invalid\
      \ / low confidence| CL[Clarification Loop]\n    CL -->|再質問| U\n```\n\nBoundary Adapter は LLM またはルールベースの NLU で実装します。出力は固定スキーマの JSON で、下流は自然言語を一切扱いません。confidence が閾値を下回る場合は [#16 Ambiguity Negotiation](16-ambiguity-negotiation.md)\
      \ へ委譲して確認を挟みます。"
    primary_decision: foundations/forces/f5-input-trust.md
  - num: 14
    slug: structured-output-contract
    title: Structured Output Contract｜構造化出力契約
    tagline: 出力をスキーマで契約化
    forces:
    - F8
    related:
    - 13
    - 15
    - 30
    dials: []
    tradeoffs:
    - structured-vs-freeform
    when_to_use: APIレスポンス生成、フォーム入力、データ抽出、ワークフロールーティング
    when_not:
    - 自由テキスト（レポート・メール）
    - フォーマットが表現力を潰す場合
    element_tech:
    - OpenAI response_format
    - Anthropic tool_use
    - Pydantic
    - Zod
    - JSON Schema
    - Instructor
    summary_plain: LLMの出力をJSON Schemaで契約化し、structured output機能でスキーマ準拠を強制した上でバリデーションを実行してから下流に渡す。
    selection_criteria:
      primary_trigger: F8=high（下流システムがパースする構造化出力が必要）
      skip_if:
      - 自由テキスト（レポート・メール）
      - フォーマットが表現力を潰す場合
      combine_with:
        always:
        - 13
        if_inverted:
        - 15
        if_policy:
        - 30
      alternatives: []
    prevents_anti_patterns: []
    summary: 'LLMに「JSONで返して」と頼んでも、ある時はコードブロック付き、ある時は余計な説明文付き、ある時はフィールド名が微妙に違う――このフォーマットの揺れが後続のパース処理を壊してしまう場面は実装者なら誰しも経験があります。


      本パターンでは、出力スキーマを事前に定義し、LLMにスキーマ準拠の構造化データを生成させます。生成後にバリデータで検証し、不適合であれば再生成またはフォールバックを行います。API応答・DB書き込み・ワークフロー遷移など、後続が決定論的な処理であればすべてに適用できます。'
    design: "```mermaid\nflowchart LR\n    LLM[LLM] -->|JSON / 構造化テキスト| VAL[Schema Validator]\n    VAL -->|pass| DS[下流システム]\n    VAL -->|fail| RETRY[再生成 / フォールバック]\n    RETRY --> LLM\n```\n\nスキーマは JSON\
      \ Schema・Pydantic モデル・Protocol Buffers 等で定義します。LLM の structured output モード（OpenAI `response_format`、Anthropic tool_use）を使えば生成段階で準拠率が上がりますが、バリデーションは省略しません。"
    primary_decision: decisions/tradeoffs-catalog/structured-vs-freeform.md
  - num: 15
    slug: inverted-structured-output
    title: Inverted Structured Output｜反転構造化出力
    tagline: 最終実行でなく中間判断を出させる
    forces:
    - F2
    related:
    - 14
    - 3
    - 19
    dials: []
    tradeoffs:
    - llm-vs-tool
    when_to_use: 承認・分類・ルーティング判断、判断のみ（実行はコード）
    when_not:
    - LLMが最終成果物を生成する場合（コード・テキスト）
    - 選択肢が無限
    element_tech:
    - Function calling
    - Enum actions
    - 決定論的 executor
    summary_plain: LLMに最終操作ではなく中間判断（アクション・パラメータ・理由）を構造化出力させ、実際の実行は決定論的コードが行う。判断と実行の分離で安全性を確保。
    selection_criteria:
      primary_trigger: F2=high（LLMが判断し決定論コードが実行すべき）
      skip_if:
      - LLMが最終成果物を直接生成する場合
      - 選択肢が無限
      combine_with:
        always:
        - 14
        if_workflow:
        - 3
        if_dryrun:
        - 19
      alternatives: []
    prevents_anti_patterns:
    - ap-11
    summary: '返金処理をLLMに直接実行させたら、ハルシネーションで存在しない注文に対して返金が走ってしまった――そんな事故は、LLMに「実行」まで任せてしまうことで起きます。判断だけを任せて、実行は信頼できるコードに委ねれば、誤判断があっても実行前に食い止められます。


      本パターンでは、通常の Structured Output とは逆に、LLMに最終成果物ではなく「次に何をすべきか」「どの分岐を取るか」という判断だけを構造化で出力させます。実際の実行・データ操作・副作用は決定論的なコードが担います。'
    design: "```mermaid\nflowchart LR\n    CTX[コンテキスト] --> LLM[LLM]\n    LLM -->|\"{ action, params, reason }\"| DEC[Decision Validator]\n    DEC -->|approved| EXE[Deterministic Executor]\n    DEC -->|rejected|\
      \ FB[フォールバック / 再判断]\n    EXE --> RESULT[実行結果]\n```\n\nLLM の出力は `{ action: \"approve_refund\", params: { order_id: \"...\", amount: 1200 }, reason: \"...\" }` のような判断レコードであり、実際の返金処理は決定論的コードが実行します。reason\
      \ フィールドは監査ログに記録されます。"
    primary_decision: decisions/tradeoffs-catalog/llm-vs-tool.md
  - num: 16
    slug: ambiguity-negotiation
    title: Ambiguity Negotiation｜曖昧性交渉
    tagline: 曖昧なら確認してから実行
    forces:
    - F1
    - F2
    related:
    - 13
    - 31
    - 51
    dials: []
    tradeoffs: []
    when_to_use: 可逆な操作、複数解釈可能な入力（ファイル削除）、スロット不足の入力
    when_not:
    - リアルタイム即時応答
    - 事前構造化されたフォーム入力
    element_tech:
    - Confidence/logprobs
    - スロット充填率
    - インタラクティブUI
    summary_plain: 入力の曖昧さを信頼度スコアやスロット充填率で検出し、操作が不可逆な場合は実行前にユーザーに確認・選択肢を提示して意図を確定させる。
    selection_criteria:
      primary_trigger: F1=low AND F2=high（曖昧入力＋不可逆操作）
      skip_if:
      - リアルタイム即時応答
      - 事前構造化されたフォーム入力
      combine_with:
        if_boundary:
        - 13
        if_approval:
        - 31
        if_escalation:
        - 51
      alternatives:
      - pattern: 推測実行＋取り消し
        when: F1=high（操作が可逆）
    prevents_anti_patterns: []
    summary: '「このファイルを削除して」と言われたとき、候補が3つあったらどれを消すべきでしょうか。エージェントが「たぶんこれだろう」と推測して実行した結果、大切なファイルが消えてしまったら取り返しがつきません。


      本パターンでは、ユーザー入力の曖昧度が閾値を超えた場合に実行を保留し、選択肢の提示や確認質問によってユーザーと意図を交渉します。交渉の結果は構造化された確定意図として下流に渡します。'
    design: "```mermaid\nflowchart TD\n    IN[ユーザー入力] --> ANA[曖昧度判定]\n    ANA -->|明確| EXEC[実行]\n    ANA -->|曖昧| NEG[交渉ループ]\n    NEG -->|選択肢提示 / 確認質問| U[ユーザー]\n    U -->|回答| NEG\n    NEG -->|確定| EXEC\n```\n\
      \n曖昧度の判定は、LLM の confidence スコア、スロット充足率、あるいは明示的な分類器で行います。交渉ループには最大ラウンド数を設定し、収束しなければエスカレーションします。"
    primary_decision: foundations/forces/f1-reversibility.md
- id: 04-tools-mcp
  roman: IV
  title: ツール・MCP・外部システム接続
  summary: 「考える主体」が外部世界に副作用を起こすための、権限・隔離・冪等性の層。
  patterns:
  - num: 17
    slug: tool-mcp-gateway
