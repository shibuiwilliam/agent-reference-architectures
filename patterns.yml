  - num: 50
    slug: editable-plan
    title: Editable Plan｜編集可能プラン
    tagline: 実行前に計画を人が編集
    forces:
    - F6
    related:
    - 49
    - 8
    - 51
    dials: []
    tradeoffs:
    - plan-vs-react
    when_to_use: マルチステップ、手順が変動、再実行コストが高い
    when_not:
    - 1–2ステップの自動化
    - リアルタイムゼロレビュー要求
    - 完全自律バッチ
    element_tech:
    - JSON/YAMLプラン構造
    - ドラッグ&ドロップ
    - インライン編集
    - 再計画提案ループ
    summary_plain: エージェントが生成した実行計画を実行前にユーザーに提示し、ステップの追加・削除・並べ替え・パラメータ修正を受け付けてから動作させる。
    selection_criteria:
      primary_trigger: F6=high（マルチステップで手順が結果に大きく影響）
      skip_if:
      - 1–2ステップの自明なタスク
      - リアルタイム性が求められ人間の編集待ちが不可
      combine_with:
        always:
        - 49
        if_planning:
        - 8
        if_escalation:
        - 51
      alternatives:
      - pattern: ReAct（計画なし即実行）
        when: 1–2ステップでリアルタイム性重視
    prevents_anti_patterns: []
    summary: 'エージェントに「競合分析レポートを作って」と依頼したら、見当違いの情報源を調べ始め、30分後に出来上がったレポートが的外れだった――実行前に計画を確認できていれば防げた失敗です。


      エージェントにタスクを依頼すると、内部的に実行計画（ステップの列）を生成します。この計画を「ブラックボックスのまま即実行」するのではなく、ユーザーに提示して編集の機会を与えます。ステップの追加・削除・並べ替え・パラメータ修正を受け付けたうえで実行に移ることで、エージェントの判断ミスを実行前に修正できます。探索的タスクほど計画の精度が低くなりやすいため `[F6]`、人間による修正が大きな価値を持ちます。'
    design: '1. ユーザーがタスクを指示

      2. エージェントが計画を生成し、構造化データ（JSON / YAML）としてUIに返す

      3. UIが計画をステップ一覧として表示。各ステップは編集・削除・並べ替え可能

      4. ユーザーが「実行」を押すと、編集後の計画でエージェントが動作

      5. 実行中に計画変更が必要になった場合、エージェントが再計画を提案し再度編集を受け付ける


      計画の構造は [#14 Structured Output Contract](../03-io-contract/14-structured-output-contract.md) でスキーマ化し、UIとエージェント間の契約とします。'
    primary_decision: decisions/tradeoffs-catalog/plan-vs-react.md
  - num: 51
    slug: agent-to-human-escalation
    title: Agent-to-Human Escalation｜人間へのエスカレーション
    tagline: 自信/権限不足で人間へ引き継ぎ
    forces:
    - F2
    - F4
    related:
    - 31
    - 49
    - 57
    dials: []
    tradeoffs: []
    when_to_use: サポート/法務/医療ドメイン、不確実→エスカレーションが推測より良い、専門家判断が必要
    when_not:
    - オフラインバッチで人間不在
    - 信頼度が常に高い（低複雑度）
    element_tech:
    - 信頼度スコア/self-assess
    - Slack/Teams/email通知
    - 構造化コンテキスト引継ぎ
    - SLA応答モニター
    summary_plain: 確信度閾値・権限不足・ポリシー違反・再試行上限などの条件でタスクの文脈・進捗・判断根拠を構造化して人間に引き継ぎ、自律と安全を両立する。
    selection_criteria:
      primary_trigger: F2=high AND F4=medium（誤判断の影響が大きく人間の最終判断が必要）
      skip_if:
      - 完全自律バッチ処理で人間介入不可
      - エスカレーション先が不在
      combine_with:
        if_approval:
        - 31
        if_workbench:
        - 49
        if_ladder:
        - 57
      alternatives: []
    prevents_anti_patterns: []
    summary: 'カスタマーサポートのエージェントが、返金ポリシーの判断に迷ったまま誤った回答を送ってしまい、顧客とのトラブルに発展した――「分からない」ときに無理に答えるより、人間に引き継ぐほうがはるかに安全です。


      エージェントがすべてのタスクを自律的に完了できるわけではありません。判断の確信度が低い、必要な権限を持たない、ポリシーで自動実行が禁じられている――こうした状況で無理に続行すると、誤りが拡大してしまいます。本パターンでは、エージェントにエスカレーション条件を定義し、条件に該当した場合にタスクの文脈・進捗・判断根拠を人間に引き継ぎます。'
    design: "```mermaid\nflowchart LR\n    AG[エージェント] -->|自信度チェック| D{エスカレーション<br/>条件判定}\n    D -->|条件OK| EX[続行・実行]\n    D -->|条件NG| ES[エスカレーション]\n    ES -->|文脈・選択肢| H[人間オペレータ]\n    H -->|判断・指示| AG\n```\n\
      \nエスカレーション条件は以下のように定義します:\n\n- **確信度閾値**: モデルの出力スコアやセルフアセスメントが閾値を下回る\n- **権限不足**: 必要なツール権限がセッションにバインドされていない\n- **ポリシー違反**: [#30 Policy-as-Code Guardrail](../06-reliability/30-policy-as-code-guardrail.md)\
      \ が実行をブロック\n- **再試行上限**: 同一ステップの失敗回数が上限に達した\n\nエスカレーション時には、タスクの文脈・これまでの実行履歴・エージェントの判断候補と根拠を構造化して人間に渡します。人間は判断を下してエージェントに返すか、タスクを自ら引き取ります。"
    primary_decision: foundations/forces/f2-failure-cost.md
- id: 12-governance
  roman: XII
  title: 組織・ガバナンス・ライフサイクル
  summary: エージェントを組織に来た新しい実行主体として迎える運用設計。
