    summary_plain: 計画・実行・検証を別ロールに分離し、Reviewerが検証基準に基づいて検査しフィードバックループで品質を担保する。
    selection_criteria:
      primary_trigger: F2=high AND F3=high（マルチステップ＋検証基準が明確）
      skip_if:
      - 単純Q&A
