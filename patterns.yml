    summary_plain: 倫理規定・データ取扱方針・エスカレーション条件・禁止操作を組織・ドメイン・エージェントの3階層で構造化定義し、全エージェントに自動注入する。
    selection_criteria:
      primary_trigger: F8=high AND F2=high（複数エージェント運用・規制産業）
      skip_if:
