      skip_if:
      - 単発Q&A
      - 秒で完了するタスク
      combine_with:
        always:
        - 50
        - 7
        if_approval:
        - 31
        if_escalation:
        - 51
      alternatives: []
    prevents_anti_patterns: []
    summary: 'エージェントに30分かかるリサーチを任せたとき、チャット画面で延々とメッセージを眺めるだけでは「いま何をしているのか」「いつ自分の判断が必要なのか」がわかりません。チャットUIだけでは、エージェントの長時間タスクを管理しきれません。


      Agent Workbenchは、チャットに加えて計画ビュー・進捗タイムライン・成果物パネル・承認ボタンを統合した操作画面を提供します。計画の全体像、各ステップの進捗、中間成果物のプレビュー、承認待ちの操作がひとつの画面で把握できるため、ユーザーは適切なタイミングで介入できます。'
    design: "```mermaid\nflowchart TB\n    subgraph Workbench\n        PL[計画パネル<br/>ステップ一覧]\n        PR[進捗タイムライン<br/>完了/実行中/待機]\n        AR[成果物パネル<br/>中間出力プレビュー]\n        AP[承認パネル<br/>確認・修正・拒否]\n    end\n\
      \    AG[エージェント] -->|状態更新| PL\n    AG -->|ストリーミング| PR\n    AG -->|中間成果物| AR\n    AG -->|承認リクエスト| AP\n    AP -->|承認/拒否| AG\n```\n\nエージェントは各ステップの状態変更・中間成果物・承認リクエストをイベントとして発行します。Workbenchはこれらをリアルタイムで受信し、各パネルに反映します。ユーザーはタイムラインから過去のステップを確認したり、承認パネルから介入したりできます。"
