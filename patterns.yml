    summary: '半年前に選んだエージェントフレームワークの開発が停滞し、セキュリティパッチも出なくなった――フレームワークのライフサイクルが短いこの領域では、こうした事態は珍しくありません。コードベース全体がそのSDKに密結合していたら、移行は大規模な書き換えになってしまいます。


      LangChain、CrewAI、Semantic Kernel、OpenAI Agents SDK――エージェントフレームワークは乱立しており、いずれも成熟途上にあります。本パターンでは、エージェントの実行（ループ制御・ツール呼び出し・状態管理）を抽象インタフェースで囲い、実装を差し替え可能にします。'
    design: "```mermaid\nflowchart TB\n    BL[ビジネスロジック] --> AI[Agent Runtime Interface<br/>run / call_tool / get_state]\n    AI --> IM_A[実装A: LangGraph]\n    AI --> IM_B[実装B: 自前ループ]\n    AI --> IM_C[実装C:\
      \ OpenAI SDK]\n```\n\n抽象インタフェースは最小限の操作――`run(task)`, `call_tool(name, args)`, `get_state()`, `set_state()`――を定義します。各フレームワーク固有の機能はアダプタ層で変換します。ビジネスロジック（プロンプト、ワークフロー定義、検証ルール）はインタフェースの上に書き、実装の切り替えはDI（依存注入）や設定ファイルで行います。"
