    summary_plain: 呼び出し側とモデルの間にリクエスト/レスポンス正規化・function callingスキーマ変換・トークンカウント統一を行う互換レイヤーを挿入し、設定変更だけでモデルを切り替え可能にする。
    selection_criteria:
