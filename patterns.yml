    when_to_use: 厳格なSLA、マルチプロバイダ利用可能、24/7運用（サポート・ワークフロー自動化）
    when_not:
    - 単一プロバイダ固定
    - 専門モデルのみ成功可能（特化モデル依存）
    element_tech:
    - LiteLLM Fallback
    - Portkey Gateway
    - resilience4j/Polly
    - サーキットブレーカー
    summary_plain: LLMプロバイダの障害・レート制限時に代替モデル→機能縮退→キャッシュ応答→エラーメッセージの段階的な縮退でサービスを継続する。
    selection_criteria:
      primary_trigger: F9=low（可用性SLA厳格・24/7運用）
      skip_if:
