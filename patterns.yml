    - 失敗コスト低
    - リアルタイム速度重視
    element_tech:
    - --dry-run フラグ
    - DB transaction→result→rollback
    - API dryRun パラメータ
    - diff-view UI
    summary_plain: 副作用を伴うツール呼び出しをドライラン（影響範囲の計算・差分表示のみ）と実行の2フェーズに分け、承認後にのみ実際の変更を適用する。
    selection_criteria:
      primary_trigger: F1=low AND F2=high（不可逆な副作用操作）
      skip_if:
      - 読み取り専用
      - 失敗コスト低
      - リアルタイム速度重視
      combine_with:
        always:
        - 31
        if_saga:
        - 4
      alternatives:
      - pattern: 即時実行＋Saga補償
        when: ツールが安価なロールバックをサポート
    prevents_anti_patterns: []
    summary: 'エージェントが「本番データベースから1万件のレコードを削除」と判断したとき、その操作がいきなり実行されたらどうなるでしょうか。誤った判断であれば、取り返しのつかない結果がそのまま反映されてしまいます。


      本パターンでは、副作用を持つ操作を2つのフェーズに分けます。第1フェーズ（ドライラン）では実際の変更を行わず、「何が起きるか」を算出して提示します。第2フェーズ（本実行）は、ユーザーまたは自動承認ポリシーによる承認を得てから実行します。'
    design: "```mermaid\nsequenceDiagram\n    participant A as Agent\n    participant GW as Tool Gateway\n    participant T as Tool\n    participant U as User / Policy\n\n    A->>GW: tool_call(dry_run=true)\n\
      \    GW->>T: simulate\n    T-->>GW: preview (affected rows, cost, diff)\n    GW-->>A: preview result\n    A->>U: 影響範囲を提示\n    U-->>A: approve / reject\n    A->>GW: tool_call(dry_run=false, approval_token)\n\
      \    GW->>T: execute\n    T-->>GW: result\n```\n\nドライランの実装はツール側が `--dry-run` フラグをサポートするのが理想ですが、ゲートウェイ側でトランザクションを開始→結果取得→ロールバックする方式でも実現できます。"
    primary_decision: foundations/forces/f1-reversibility.md
