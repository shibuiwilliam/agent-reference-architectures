    summary: 'RAGで大量のコンテキストをプロンプトに含めると、入力トークン数が数千〜数万に膨らみ、コストとレイテンシが悪化します。しかしその大半はシステムプロンプトやFew-shot例など、リクエスト間で共通の内容であることが多いです。


      多くのLLMプロバイダは、プロンプトのprefix部分が一致する場合にキャッシュを適用し、入力トークンのコストとTime to First Token（TTFT）を削減してくれます。本パターンでは、システムプロンプト・Few-shot例・共通コンテキストをプロンプトの先頭に安定的に配置し、リクエストごとに変わる部分（ユーザー入力・動的コンテキスト）を末尾に置きます。こうしてprefix長を一定以上に保つことで、キャッシュヒット率を高めます。'
    design: プロンプトを3層に構成します。第1層はシステムプロンプト＋行動規範（全リクエスト共通で、変更頻度が低い）です。第2層はFew-shot例・ドメインナレッジ（タスクカテゴリ共通）です。第3層はユーザー入力・セッション固有コンテキスト（リクエスト固有）です。第1層・第2層が共通prefixとなりキャッシュの対象になります。なお、第2層の並び順もハッシュ等で安定化させ、順序の変動によってキャッシュが無効化されるのを防ぎます。
