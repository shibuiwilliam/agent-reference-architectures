    design: "```mermaid\nflowchart LR\n    In[ユーザー入力] --> IG[入力ガードレール]\n    IG -->|安全| Agent[エージェント]\n    IG -->|危険| Block[遮断応答]\n    Agent --> OG[出力ガードレール]\n    OG -->|合格| Out[最終出力]\n    OG -->|軽度違反| Agent\n\
