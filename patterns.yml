        when: 検証のみ必要で計画分離は不要
    prevents_anti_patterns: []
    summary: '人間のチームでも、企画書を書いた本人がレビューまで担当すると、見落としやバイアスが入りやすくなります。LLMにも同じことが起きます。1つのLLMに「考えて・やって・確かめて」をすべて任せると、自分の計画を自分で検証するという構造的な利益相反が生まれてしまいます。


      Planner-Executor-Reviewer は、計画（Plan）・実行（Execute）・検証（Review）を独立したロール――場合によっては別モデルや別プロンプト――に分離する構成です。Planner がステップ列を生成し、Executor がツール呼び出しや副作用を実行し、Reviewer が結果を検証して差し戻しまたは承認します。'
    design: "```mermaid\nflowchart LR\n    P[Planner] -->|計画| E[Executor]\n    E -->|実行結果| R[Reviewer]\n    R -->|OK| Out[最終出力]\n    R -->|差し戻し| P\n```\n\nPlanner はタスク分解と順序付けを担い、構造化された計画（JSON やステップリスト）を出力します。Executor\
      \ は計画を逐次実行し、各ステップの結果を記録します。Reviewer は実行結果を計画の意図・品質基準と照合し、不合格なら理由を添えて Planner へ差し戻します。差し戻しループには回数上限を設け、[#5 Time-Budgeted Agent Loop](../01-execution/05-time-budgeted-agent-loop.md) と組み合わせて暴走を防ぎます。"
    primary_decision: decisions/tradeoffs-catalog/plan-vs-react.md
