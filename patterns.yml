        - 38
        if_canary:
        - 36
      alternatives:
      - pattern: Fail-fast＋人間エスカレーション
        when: 品質閾値を設けフォールバック不可時
    prevents_anti_patterns:
    - ap-09
    summary: 'ある朝、主力LLMプロバイダが障害を起こし、エージェントが一切応答しなくなった――このような事態は実際に起こりえます。エージェントが複数ステップの処理途中で止まれば、セッション全体が無駄になってしまいます。


      外部LLMプロバイダは100%の可用性を保証しません。障害・レート制限・レイテンシ悪化が発生した際には、代替モデルへのフォールバック、機能縮退（一部機能をルールベースで代替）、キャッシュ応答の利用、最終手段としてのエラーメッセージ表示を段階的に実行します。ユーザーには「完全停止」ではなく「品質は下がるが動く」状態を提供するのが狙いです。'
    design: "```mermaid\nflowchart TD\n    Req[リクエスト] --> Primary[プライマリモデル]\n    Primary -->|成功| Res[レスポンス]\n    Primary -->|失敗/タイムアウト| FB1[フォールバックモデル]\n    FB1 -->|成功| Res\n    FB1 -->|失敗| FB2[キャッシュ応答\
      \ / ルールベース]\n    FB2 -->|成功| Res\n    FB2 -->|失敗| Err[縮退エラーメッセージ]\n```\n\nフォールバックチェーンを定義し、上位が失敗すると順に下位へ降りていきます。各段階ではタイムアウト・リトライ上限を設定し、遷移を高速に行います。回復検知（ヘルスチェック）によりプライマリが復旧したことを確認できれば、フォールバックを解除します。"
    primary_decision: decisions/tradeoffs-catalog/fail-fast-vs-degradation.md
  - num: 56
    slug: adaptive-effort
    title: Adaptive Effort｜適応的努力配分
    tagline: 難易度で投入計算量を増減
    forces:
    - F7
    - F2
    related:
    - 37
    - 5
    - 28
    dials: []
    tradeoffs: []
    when_to_use: 難易度が変動するワークロード、thinking-budget API利用可能、コスト制約下の品質柔軟性
    when_not:
    - 均一な複雑さ
    - 常に最大努力が必要（医療診断）
    - コスト>>品質
    element_tech:
    - 軽量難易度分類器
    - Anthropic thinking budget
    - OpenAI reasoning effort
    - 動的 max_tokens
    summary_plain: リクエストの難易度・重要度を軽量推定器で評価し、簡単なクエリには少ない推論ステップで即答、複雑なクエリにはCoT深化・複数パス検証で投入計算量を動的調整する。
    selection_criteria:
      primary_trigger: F7=high AND F2=mixed（難易度のばらつきが大きいワークロード）
      skip_if:
      - 全リクエストが同等の複雑さ
      - 常に最大努力が必要（医療診断）
      combine_with:
        if_routing:
        - 37
        if_budget:
        - 5
        if_verify:
        - 28
      alternatives:
      - pattern: 37
        when: モデル選択レベルの最適化で十分
    prevents_anti_patterns:
    - ap-03
    summary: '「明日の予定を教えて」と「この契約書のリスクを分析して」では、必要な推論の深さがまったく異なります。前者に5段階の検証を行うのは無駄であり、後者を1ステップで済ませるのは危険です。


      [#37 Semantic Gateway](37-semantic-gateway-cost-aware-router.md) がモデルを切り替えるのに対し、Adaptive Effortは同一モデル内でも投入する計算量を調整します。簡単なクエリには短い思考・少ないステップで即答し、複雑・高リスクなクエリにはChain-of-Thoughtの深化、複数パスの検証、追加のツール呼び出しを行います。「すべてに全力」ではなく、難易度と失敗コストに応じて計算資源を傾斜配分する考え方です。'
    design: リクエストを受けたら、まず軽量な難易度推定（入力の長さ・複雑度スコア・ドメイン分類）を行います。その推定結果に応じて、エージェントの実行パラメータを動的に設定します。具体的には、最大推論ステップ数、思考トークン上限（thinking budget）、検証器の起動有無、アンサンブル数などを調整します。また、推定が外れた場合に備えて、初回応答の自信度が低ければ上位の努力レベルで再試行するエスカレーション機構も組み込んでおきます。
    primary_decision: foundations/forces/f7-cost-sensitivity.md
- id: 09-security
  roman: IX
  title: セキュリティ・マルチテナント
  summary: 自然言語I/F＝攻撃面、という前提に立った防御層。
  patterns:
  - num: 41
    slug: tenant-isolated-agent-runtime
    title: Tenant-Isolated Agent Runtime｜テナント分離ランタイム
    tagline: テナント毎に実行・記憶を分離
    forces:
    - F5
    - F8
    related:
