    summary: '医療判断や金融リスク評価で、1人の専門家の意見だけで結論を出すのはリスクが高いです。LLMでも同じで、単一エージェントの回答はモデルのバイアスやハルシネーションに左右されやすくなります。


      Agent Ensemble は、複数のエージェント（異なるモデル・プロンプト・温度設定など）に同じタスクを与え、結果を集約する手法です。集約方法には多数決（Majority Vote）、スコアリング、または Debate（相互批判による収束）があります。これは機械学習のアンサンブル手法をエージェントレベルに適用したものと捉えられます。'
    design: "```mermaid\nflowchart LR\n    T[タスク] --> A1[Agent A]\n    T --> A2[Agent B]\n    T --> A3[Agent C]\n    A1 --> J[Judge / Aggregator]\n    A2 --> J\n    A3 --> J\n    J --> Out[最終回答]\n```\n\n\
