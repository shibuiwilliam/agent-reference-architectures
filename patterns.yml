    summary: LLMは「自信たっぷりに間違える」ことがあります。確信度が高くても事実に基づいていなければ、特に法務・医療・金融の領域では深刻な問題になりかねません。Evidence-First Answer は、この問題に対処するために、回答生成のワークフローを「まず根拠を集め、次にそれに基づいて回答を構成する」という二段階に分離するパターンです。根拠が見つからない場合は「わからない」と明示的に返します。回答には引用（出典ドキュメント、チャンク、URL）を付与し、ユーザーや監査者が検証できるようにします。
    design: "```mermaid\nflowchart LR\n    Q[質問] --> Search[根拠検索]\n    Search --> Judge{根拠は<br/>十分か?}\n    Judge -->|十分| Gen[回答生成<br/>引用付き]\n    Judge -->|不十分| Decline[不明と回答<br/>or 追加質問]\n    Gen --> Out[出典付き回答]\n\
      ```\n\n検索フェーズでは [#24 Context Pack / Assembly](../05-memory-context/24-context-pack-assembly.md) と同じ仕組みを使いますが、ここでは「回答可能か」の判定ステップが加わります。引用形式はインライン脚注（`[1]`）やメタデータブロックなど、下流の用途に合わせて選びます。"
    primary_decision: decisions/tradeoffs-catalog/rag-vs-finetuning.md
