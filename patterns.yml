        if_privilege:
        - 18
      alternatives: []
    prevents_anti_patterns: []
    summary: 'SaaS型のエージェントサービスで、ある顧客の問い合わせ内容が別の顧客への回答に混入してしまったら、信頼の失墜だけでなく法的責任にも発展しかねません。複数テナントが同一インフラを共有する環境では、LLMのコンテキスト窓やメモリストア、ツール呼び出し先がテナント間で混在すると、プロンプトインジェクションや単純なバグによってこうした漏洩が起こりえます。


      本パターンでは、リクエスト受付時にテナントIDを検証し、以降の実行パス全体――コンテキスト、メモリ、ツールバインディング、ログ――をテナント単位で隔離します。'
    design: "```mermaid\nflowchart LR\n    R[リクエスト] --> GW[API Gateway]\n    GW -->|tenant_id 検証| D{ディスパッチャ}\n    D --> RT_A[Runtime A<br/>テナントA専用]\n    D --> RT_B[Runtime B<br/>テナントB専用]\n    RT_A --> M_A[(Memory\
      \ A)]\n    RT_B --> M_B[(Memory B)]\n    RT_A --> T_A[Tools A]\n    RT_B --> T_B[Tools B]\n```\n\nディスパッチャはテナントIDに基づき、専用のランタイムインスタンス（またはコンテナ／名前空間）へルーティングします。メモリストアはテナントごとにスキーマまたはプレフィックスで分離し、ツールバインディングにもテナント固有の認可スコープを適用します。ログにはテナントIDを必ず付与し、テナントをまたぐ検索を防ぐアクセス制御を設けます。"
    primary_decision: foundations/forces/f5-input-trust.md
  - num: 42
    slug: data-boundary-firewall
    title: Data Boundary Firewall｜データ境界ファイアウォール
    tagline: 入出力でPII/機密を検査・マスク
    forces:
    - F5
    - F8
    related:
    - 41
    - 29
    - 17
    dials: []
    tradeoffs: []
    when_to_use: PII/健康/金融データを扱うエージェント、外部LLM API、GDPR/規制対象
    when_not:
    - 公開データのみ
    - マスキングがビジネスロジックを破壊
    element_tech:
    - Presidio
    - DLP
    - spaCy NER
    - PIIマスキング
    - OPA/Rego
    - 監査イベントログ
    summary_plain: エージェントへの入力前と出力後にファイアウォール層を設置し、PII検出・機密分類・マスキングを実行して意図しない情報漏洩を防ぐ。
    selection_criteria:
      primary_trigger: F5=low AND F8=high（PII・医療・財務データを扱うエージェント）
      skip_if:
      - 公開データのみ
      - マスキングが業務ロジックを破壊
      combine_with:
        always:
        - 41
        if_guardrail:
        - 29
        if_gateway:
        - 17
      alternatives: []
    prevents_anti_patterns:
    - ap-10
    summary: 'ユーザーがクレジットカード番号や住所を含むメッセージを送ったとき、LLMがそれをそのまま要約やツール呼び出しの引数に含めてしまったら、深刻な情報漏洩になります。LLMは入力に含まれた個人情報や機密データを、意図せず出力に混入させることがあります。


      本パターンでは、エージェントへの入力前と出力後の両方にファイアウォール層を設置し、PII検出・機密分類・マスキング・ブロックを実行します。データが信頼境界を越えるたびに検査することで、プロンプトインジェクション経由の情報抽出にも対処できます。'
    design: "```mermaid\nflowchart LR\n    U[ユーザー入力] --> FW_IN[入力ファイアウォール<br/>PII検出・マスク]\n    FW_IN --> AG[エージェント]\n    AG --> FW_OUT[出力ファイアウォール<br/>機密検査・除去]\n    FW_OUT --> R[レスポンス]\n    AG --> T[ツール呼び出し]\n\
      \    T --> FW_T[ツール境界検査]\n    FW_T --> EXT[外部システム]\n```\n\n入力側ではPII（氏名・メール・電話番号・クレジットカード番号等）を正規表現＋NERモデルで検出し、マスクまたはトークン化してからLLMに渡します。出力側では機密ラベル付きデータの露出がないかを検査します。ツール呼び出しの引数・戻り値についても同様に検査の対象とします。"
    primary_decision: foundations/forces/f5-input-trust.md
  - num: 43
    slug: confused-deputy-damage-limitation
    title: Confused-Deputy Damage Limitation｜被害限定
    tagline: 騙されても被害半径を制限
    forces:
    - F5
    related:
    - 44
    - 41
    - 18
    - 4
    dials: []
    tradeoffs: []
    when_to_use: 外部データ処理（メール・Web・ユーザー入力）、高インパクトツールアクセス
    when_not:
    - 読み取り専用で副作用なし
    - 信頼境界が明確（全て内部）
    element_tech:
    - 最小権限
    - レートリミッタ/金額上限
    - 承認キュー
    - コンテナ隔離/RLS
    summary_plain: エージェントが騙される前提で、最小権限・操作上限・不可逆操作の遅延・影響範囲分離を組み合わせ、インジェクション被害の半径を構造的に最小化する。
    selection_criteria:
      primary_trigger: F5=low（外部データ処理エージェント全般）
      skip_if:
      - 読み取り専用で副作用なし
      combine_with:
        always:
        - 44
        if_tenant:
        - 41
        if_privilege:
        - 18
        if_saga:
        - 4
      alternatives: []
    prevents_anti_patterns:
    - ap-10
    summary: 'メールの本文に仕込まれた悪意ある指示により、エージェントが顧客データを外部に送信してしまう――プロンプトインジェクションによるこうした「騙し」を100%防ぐことは、現時点のLLMでは極めて困難です。


      Confused Deputy（混乱した代理人）問題とは、権限を持つ主体が第三者に騙されて、その権限を意図しない操作に使われてしまうことを指します。LLMエージェントは自然言語入力を信頼境界なく処理するため、間接プロンプトインジェクションにより「騙される」リスクが常にあります。本パターンは「騙されること自体は防げない」という前提に立ち、騙された場合でも被害半径（Blast Radius）を最小化する設計を採ります。'
    design: '被害限定は単一コンポーネントではなく、複数の制約を組み合わせて実現します。


      1. **最小権限**: セッションごとにツール・データアクセスを必要最小限に束縛します

      2. **操作上限**: 1セッションあたりの書き込み回数・金額・影響範囲に上限を設けます

      3. **不可逆操作の遅延**: 削除・送金・公開などは即時実行せず、承認キューに入れます

      4. **影響範囲の分離**: 1エージェントが触れるリソースのスコープを限定します


      これらを重ねることで、単一の防御が破られても被害が全体に波及しません。'
    primary_decision: foundations/forces/f5-input-trust.md
  - num: 44
    slug: dual-llm-privilege-separation
    title: Dual-LLM Privilege Separation｜デュアルLLM権限分離
    tagline: 隔離LLMと特権LLMを分離
    forces:
    - F5
    - F2
    related:
    - 43
    - 15
    - 20
    dials: []
    tradeoffs: []
    when_to_use: 信頼できない入力→ツールチェーン、高リスク副作用（決済・削除・通知）
    when_not:
    - 信頼入力のクローズド環境
    - 2LLMデュアルパスのレイテンシ/コスト不許容
    element_tech:
    - 隔離LLM（小型/サンドボックス）
    - スキーマバリデーション
    - 特権LLM（ツール実行）
    summary_plain: 信頼できない入力を処理する隔離LLM（ツール権限なし）と副作用を実行する特権LLMを別プロセス・別権限で分離し、構造化スキーマ経由でのみ情報を渡す。
    selection_criteria:
      primary_trigger: F5=low AND F2=high（信頼できない入力→ツール実行パイプライン）
      skip_if:
      - 信頼入力のクローズド環境
      - 2LLMのレイテンシ/コスト増が許容不可
      combine_with:
        always:
        - 43
        if_inverted:
        - 15
        if_sandbox:
        - 20
      alternatives:
      - pattern: 単一LLM
        when: 入力が信頼できる環境で副作用の失敗コストが低い
    prevents_anti_patterns:
    - ap-10
    summary: 'メール本文を読んで自動返信するエージェントを考えてみましょう。もしメール本文にプロンプトインジェクションが仕込まれていたら、返信だけでなく送金や顧客データの送信といった副作用まで実行されてしまう可能性があります。外部入力を処理するLLMにそのままツール実行権限を与えることの危険性は大きいです。


      本パターンでは、信頼できない入力を扱う「隔離LLM（Quarantined LLM）」と、実際に副作用を実行する「特権LLM（Privileged LLM）」を別プロセス・別権限で動かします。隔離LLMの出力は構造化された中間表現に限定し、特権LLMはその中間表現のみを入力として受け取る仕組みです。'
    design: "```mermaid\nflowchart LR\n    U[信頼できない入力] --> Q[隔離LLM<br/>ツール権限なし]\n    Q -->|構造化中間表現| V[バリデーション]\n    V --> P[特権LLM<br/>ツール実行可]\n    P --> T[ツール / 副作用]\n```\n\n隔離LLMは自然言語の解析・分類・要約のみを行い、出力は\
      \ JSON スキーマ等の構造化フォーマットに制約します。バリデーション層でスキーマ検証・範囲チェックを行った後、特権LLMが構造化入力に基づいてツール呼び出しを実行します。特権LLMは生の自然言語入力に一切触れません。"
    primary_decision: foundations/forces/f5-input-trust.md
- id: 10-deployment
  roman: X
  title: デプロイ・ベンダー抽象化・移行
  summary: 特定SDK/モデルへのロックインを避け、既存システムへ漸進導入する。
