# patterns.yml — 59パターンの正本（single source of truth）
# scripts/generate.py がこのファイル + decisions.yml から機械可読成果物を生成します。
# 新パターンの追加・改名・並び替えは必ずここで行い、mkdocs.yml の nav も合わせて更新すること。

site:
  title: AIエージェント本番アーキテクチャ・パターン
  principle: 確率的なコアを、決定論的な殻——契約・検証・予算・権限・観測——で囲む。
forces:
- id: F1
  name: 可逆性
  note: 失敗をやり直せるか
- id: F2
  name: 失敗コスト
  note: 金銭/法務/安全の痛み
- id: F3
  name: 1リクエストの価値
  note: 売上/意思決定への寄与
- id: F4
  name: レイテンシ予算
  note: ユーザーの待機耐性
- id: F5
  name: 入力の信頼度
  note: 攻撃/汚染の混入可能性
- id: F6
  name: タスクの変動性
  note: 定型↔探索
- id: F7
  name: コスト感度・スケール
  note: QPS・月間コスト上限
- id: F8
  name: 説明責任・規制
  note: 監査・コンプラ要件
- id: F9
  name: プロバイダ信頼度
  note: 外部LLMの可用性
categories:
- id: 01-execution
  roman: I
  title: 実行・セッション・オーケストレーション
  summary: 長時間・予測不能・失敗しうる実行を、Web層から切り離して安全に走らせる土台。
  patterns:
  - num: 1
    slug: request-to-job-gateway
    title: Request-to-Job Gateway｜非同期受付ゲートウェイ
    tagline: 1リクエストを非同期ジョブとして受け付ける
    forces:
    - F4
    - F1
    related:
    - 2
    - 7
    - 58
    dials:
    - timeout
    tradeoffs:
    - sync-vs-async
    - push-vs-pull
    when_to_use: マルチステップの調査・コンテンツ生成・分析など、数秒〜数分かかるタスク
    when_not:
    - F4=低（数秒以内に同期で完了できるタスク）
    element_tech:
    - FastAPI
    - Next.js API Routes
    - SQS
    - Cloud Pub/Sub
    - Kafka
    - Cloud Tasks
    - Celery
    - Redis
    - PostgreSQL
    - SSE
    - WebSocket
    summary_plain: ユーザーリクエストを即座にジョブIDで応答し、LLM処理をバックグラウンドで実行する。HTTPタイムアウトによる切断を防ぎ、Web層とエージェント層を独立にスケールさせる。
    selection_criteria:
      primary_trigger: F4=high（数秒〜数分かかるタスク）
      skip_if:
      - F4=low（数秒以内に同期で完了）
      - オートコンプリートや単純分類
      combine_with:
        always:
        - 2
        - 7
        if_mixed_workload:
        - 58
      alternatives:
      - pattern: 58
        when: 同期・非同期が混在するハイブリッドワークロード
    prevents_anti_patterns:
    - ap-01
    - ap-07
    summary: 'AIエージェントにリサーチや資料作成を任せると、処理に数分以上かかることも珍しくありません。これを通常のHTTPリクエストのように同期で待つと、ロードバランサやプロキシのタイムアウトで途中切断されてしまいます。


      このパターンでは、ユーザーからのリクエストに対して同期レスポンスを返すのではなく、受付時に `session_id` / `job_id` を即座に発行して `202 Accepted` を返します。実処理はキューやワークフローエンジンへ渡し、ワーカー群が背後で実行します。進捗と最終結果は polling・SSE・WebSocket・Webhook で受け取ります。Web層は「受付」だけを担い、エージェント実行層と独立にスケールします。'
    design: "```mermaid\nflowchart LR\n    U[クライアント] -->|\"POST /tasks\"| GW[API Gateway / 受付]\n    GW -->|\"202 + job_id\"| U\n    GW -->|enqueue| Q[(Job Queue)]\n    Q --> W[Agent Worker]\n    W -->|状態保存|\
      \ S[(State Store)]\n    W -->|進捗/結果 push| PS[(Pub/Sub)]\n    PS -->|SSE / WebSocket| U\n```\n\n受付APIはジョブをキュー（SQS / Pub/Sub / Redis Stream など）に投入し、その状態を `pending → running → (partial) → done / failed\
      \ / timeout` として外部ストアに永続化します。中間トークンや進捗は別チャネルを通じてストリーミングします。"
    primary_decision: decisions/tradeoffs-catalog/sync-vs-async.md
  - num: 2
    slug: durable-agent-session
    title: Durable Agent Session｜耐久エージェントセッション
    tagline: 状態を永続化し中断・再開に耐える
    forces:
    - F1
    related:
    - 1
    - 6
    - 4
    - 32
    dials:
    - checkpoint-frequency
    tradeoffs:
    - in-context-vs-external
    when_to_use: マルチステップの研究・コード生成・データパイプライン、ローリングデプロイ環境
    when_not:
    - 単発LLM呼び出し
    - シリアライズコストが利益を上回るリアルタイム対話
    element_tech:
    - Redis
    - PostgreSQL
    - DynamoDB
    - Temporal
    - Azure Durable Functions
    - JSON/Protobuf
    summary_plain: エージェントの状態を外部ストアにチェックポイント保存し、プロセス障害やローリングデプロイ後も最後の保存地点から再開できるようにする。
    selection_criteria:
      primary_trigger: F1=low（マルチステップの長時間タスクで中断・再開が必要）
      skip_if:
      - 単発LLM呼び出し
      - シリアライズコストが利益を上回るリアルタイム対話
      combine_with:
        always:
        - 1
        if_compensation_needed:
        - 4
        if_audit_required:
        - 32
      alternatives:
      - pattern: Temporal/Durable Functions
        when: ワークフローエンジンが耐久実行をネイティブ提供
    prevents_anti_patterns: []
    summary: 'エージェントが数十分かけて調査を進めている途中でプロセスがクラッシュしたら、最初からやり直しになります――これは本番環境では許容できません。


      このパターンでは、エージェントのセッション状態（会話履歴、中間結果、ステップカウンタ、取得済みコンテキスト）をインメモリではなく外部の耐久ストアに書き出します。これにより、プロセスが落ちてもストアから状態を復元し、最後のチェックポイントから再開できるようになります。また、ステートレスなワーカーが任意のセッションをピックアップできるため、スケールアウトやローリングデプロイとも両立しやすくなっています。'
    design: "```mermaid\nflowchart LR\n    W[Agent Worker] -->|\"read/write\"| SS[(Session Store)]\n    W -->|\"checkpoint\"| CP[Checkpoint Log]\n    LB[Load Balancer] -->|\"任意のworkerへ\"| W\n    SS -->|\"\
      復元\"| W2[別 Worker（再開）]\n```\n\nセッション状態は各ステップの完了時にストアへ書き出します（チェックポイント）。キーは `session_id` で、TTLを付けて古いセッションを自動的に失効させます。復元時は最新のチェックポイントを読み込み、副作用のあるステップについては冪等キーを用いて重複実行を防ぎます。"
    primary_decision: decisions/tradeoffs-catalog/in-context-vs-external.md
  - num: 3
    slug: workflow-backbone-agent-node
    title: Workflow Backbone + Agent Node｜決定論骨格＋ノード
    tagline: 骨格は決定論、判断だけ委譲
    forces:
    - F6
    - F8
    related:
    - 59
    - 11
    - 5
    - 14
    dials: []
    tradeoffs:
    - workflow-vs-agent
    - orchestration-vs-choreography
    when_to_use: 固定手順にAI判断を組み込む場面、規制業種で再現性が必要
    when_not:
    - F6=高（探索的タスク）
    - 手順が動的に変化する場合
    element_tech:
    - Temporal
    - Airflow
    - Step Functions
    - Prefect
    - Hatchet
    - LangGraph
    - OpenAI Agents SDK
    summary_plain: 決定論的なワークフローエンジンを骨格とし、判断が必要なノードだけをLLMエージェントに委譲する。再現性と監査性を確保しつつAI判断を組み込む。
    selection_criteria:
      primary_trigger: F6=low AND F8=high（固定手順＋規制要件）
      skip_if:
      - F6=high（探索的タスク）
      - 手順が動的に変化する場合
      combine_with:
        always:
        - 14
        if_budget_needed:
        - 5
      alternatives:
      - pattern: 59
        when: サブタスクごとにワークフロー/エージェントを選定する必要がある
    prevents_anti_patterns:
    - ap-08
    summary: '「データを取得して、分類して、DBに書き込んで、通知する」といった業務フローの大半は定型処理であり、AI判断が必要なのは一部のステップだけです。それなのにフロー全体をエージェントに委ねると、順序の再現性が失われ、監査もコスト管理も難しくなります。


      このパターンでは、ワークフローエンジン（DAG実行器）が骨格となり、定型ステップを決定論的に実行します。そのうえで、LLMの判断力が必要なノード――分類、要約、計画立案など――だけをエージェントに委ねます。骨格が全体の進行を制御するため、監査ログの取得やリトライ制御は既存のワークフロー技術で対応できます。'
    design: "```mermaid\nflowchart TD\n    WF[Workflow Engine] -->|\"1. データ取得\"| S1[ETLステップ]\n    WF -->|\"2. 分類判断\"| AN[Agent Node / LLM]\n    AN -->|\"構造化結果\"| WF\n    WF -->|\"3. 後処理\"| S2[DB書き込み]\n\
      \    WF -->|\"4. 通知\"| S3[Slack / Email]\n```\n\nエージェントノードはワークフローの1タスクとして呼ばれ、入力スキーマと出力スキーマが契約化されています。タイムアウト・リトライ・フォールバックはワークフロー側で定義します。"
    primary_decision: decisions/tradeoffs-catalog/workflow-vs-agent.md
  - num: 4
    slug: agent-saga
    title: Agent Saga｜補償トランザクション
    tagline: 副作用連鎖を補償で巻き戻す
    forces:
    - F1
    - F2
    related:
    - 2
    - 19
    - 31
    - 1
    dials:
    - checkpoint-frequency
    tradeoffs: []
    when_to_use: 複数外部システムへの書き込み連鎖（カレンダー→チケット→メール）
    when_not:
    - 読み取り専用
    - 単一サービスのDBトランザクションで完結
    - 物理的に不可逆な操作
    element_tech:
    - Temporal
    - Step Functions
    - 冪等キー
    summary_plain: 複数外部システムへの書き込み連鎖で途中失敗した場合に、補償アクションを逆順に実行して一貫性を回復する分散Sagaパターンのエージェント版。
    selection_criteria:
      primary_trigger: F1=low AND F2=high（複数外部システムへの書き込み連鎖）
      skip_if:
      - 読み取り専用
      - 単一サービスのDBトランザクションで完結
      - 物理的に不可逆な操作
      combine_with:
        always:
        - 2
        - 19
        if_approval_needed:
        - 31
      alternatives: []
    prevents_anti_patterns: []
    summary: 'たとえばエージェントが「カレンダー予約 → チケット作成 → メール送信」を自動実行する場面を考えてみましょう。メール送信で失敗したとき、予約とチケットだけが残って不整合が生じてしまいます。送ったメールは取り消せませんし、予約も手動でキャンセルしなければなりません。


      Sagaパターンでは、各ステップに対応する補償アクション（予約取り消し、チケットクローズ、訂正メール送信）を事前に定義しておき、失敗時に逆順で実行します。これは分散トランザクションのSagaパターンを、エージェントの文脈に適用したものです。'
    design: "```mermaid\nsequenceDiagram\n    participant O as Orchestrator\n    participant A as サービスA\n    participant B as サービスB\n    participant C as サービスC\n    O->>A: ステップ1実行\n    A-->>O: OK\n    O->>B:\
      \ ステップ2実行\n    B-->>O: OK\n    O->>C: ステップ3実行\n    C-->>O: 失敗\n    O->>B: 補償2（取り消し）\n    O->>A: 補償1（取り消し）\n```\n\nオーケストレータ（ワークフローエンジンまたはエージェント自身）が実行済みステップのスタックを保持し、失敗検知で補償を逆順に発火します。各補償アクションも冪等に設計します。"
    primary_decision: decisions/dials/checkpoint-frequency.md
  - num: 5
    slug: time-budgeted-agent-loop
    title: Time-Budgeted Agent Loop｜予算付きループ
    tagline: 時間・回数・コストを予算化し暴走を止める
    forces:
    - F7
    - F3
    related:
    - 55
    - 6
    - 37
    dials:
    - budget-cap
    - timeout
    tradeoffs: []
    when_to_use: SaaSでのコスト制限、マルチテナントの公平性確保
    when_not:
    - バッチで必要な分だけ使う方針（ただしコスト上限は常に推奨）
    element_tech:
    - フレームワーク callback/middleware
    - LLM usage API
    - ツール呼び出しカウンタ
    summary_plain: エージェントループに時間・ステップ数・トークン数・金額の予算を注入し、予算超過時にベスト・ソー・ファーの返却やエスカレーションで暴走を防ぐ。
    selection_criteria:
      primary_trigger: F7=high（コスト制約下でのエージェントループ）
      skip_if:
      - バッチで必要な分だけ使う方針（ただしコスト上限は常に推奨）
      combine_with:
        always:
        - 55
        if_cost_routing:
        - 37
      alternatives: []
    prevents_anti_patterns:
    - ap-01
    - ap-09
    summary: 'エージェントに「この技術を調べて」と頼んだら、関連論文を延々と読み続けて数百回のAPI呼び出しと数万トークンを消費していた――そんな暴走が本番で起きたら、コストもレイテンシも制御不能になります。


      エージェントの ReAct / Plan-Execute ループは、本質的に終了条件が不確定であり、無限ループや想定外の深掘りが起こりえます。このパターンでは、ループ開始時に予算（wall-clock時間、最大ステップ数、累積トークン数、API呼び出し回数、金額上限）を注入し、各イテレーションで残予算をチェックします。予算を超過した場合は、「現時点の最善回答を返す」「要約して終了する」「人間にエスカレーションする」のいずれかに縮退させます。'
    design: "```mermaid\nflowchart TD\n    Start[ループ開始 + 予算注入] --> Check{残予算 > 0?}\n    Check -->|Yes| Step[LLM推論 + ツール実行]\n    Step -->|予算消費を記録| Check\n    Check -->|No| Degrade[縮退: 最善結果を返却]\n```\n\n予算は構造体として保持し、LLM呼び出し・ツール実行ごとに消費量を加算します。残予算はプロンプトにも含め、LLM自身にも「あと何ステップか」を認識させます。"
    primary_decision: decisions/dials/budget-cap.md
  - num: 6
    slug: interruptible-agent
    title: Interruptible Agent｜中断可能エージェント
    tagline: 途中で停止・方針修正できる
    forces:
    - F4
    related:
    - 2
    - 5
    - 31
    - 7
    dials: []
    tradeoffs: []
    when_to_use: 長時間稼働のインタラクティブエージェント、人間が途中で方針変更する場面
    when_not:
    - サブ秒完了タスク
    - フラグチェックのオーバーヘッドが許容できない超低レイテンシパス
    element_tech:
    - Redis Pub/Sub
    - DB flag
    - WebSocket
    - graceful shutdown
    summary_plain: 実行中のエージェントに外部からの中断シグナルを安全に受け取るチェックポイントを挿入し、状態を保存した上で一時停止・再開を可能にする。
    selection_criteria:
      primary_trigger: F4=high（長時間稼働のインタラクティブエージェント）
      skip_if:
      - サブ秒完了タスク
      - フラグチェックのオーバーヘッドが許容できない超低レイテンシパス
      combine_with:
        always:
        - 2
        if_budget:
        - 5
        if_approval:
        - 31
      alternatives: []
    prevents_anti_patterns: []
    summary: 'ユーザーが「やっぱり違う条件で調べてほしい」と思ったのに、エージェントが止まらずに古い指示のまま走り続けている――そんな状況は無駄なコスト消費だけでなく、誤った副作用まで生みかねません。


      このパターンでは、エージェントの推論ループに**中断ポイント**を設け、外部からのキャンセル信号や方針変更を受け取れるようにします。中断時には、現在のステップを安全に完了（またはロールバック）したうえで、状態を永続化して停止します。ユーザーが方針を修正した後は、同じセッションから再開できます。「止められないエージェント」は本番運用で最も危険な存在であり、中断可能性は安全弁として欠かせません。'
    design: "```mermaid\nflowchart TD\n    Loop[推論ループ] --> CP{中断ポイント}\n    CP -->|\"中断信号なし\"| Next[次ステップ実行]\n    Next --> Loop\n    CP -->|\"中断信号あり\"| Save[状態永続化]\n    Save --> Pause[一時停止 / 返却]\n    Pause\
      \ -->|\"再開指示\"| Loop\n```\n\n各ステップ間にチェックポイントを挿入し、中断フラグ（Redis / DB / インメモリ）をポーリングまたはイベントで受信します。中断後のセッション状態は [#2 Durable Agent Session](02-durable-agent-session.md) で永続化します。"
    primary_decision: foundations/forces/f4-latency-budget.md
  - num: 7
    slug: streaming-progress
    title: Streaming Progress｜進捗ストリーミング
    tagline: 過程を監査可能な要約で逐次表示
    forces:
    - F4
    related:
    - 1
    - 6
    - 32
    dials: []
    tradeoffs:
    - push-vs-pull
    when_to_use: 5秒以上のタスク、ユーザーのインタラクティブ監視、規制トレースログ
    when_not:
    - サブ秒処理
    - バッチのサイレントモード
    element_tech:
    - SSE
    - WebSocket
    - gRPC streaming
    - Redis Streams
    - Kafka
    - JSON Lines
    summary_plain: 5秒以上かかるタスクの各ステップを構造化された進捗イベントとしてSSE/WebSocket経由でリアルタイム配信し、ユーザーの体感待ち時間を短縮する。
    selection_criteria:
      primary_trigger: F4=high（5秒以上のタスクで体感レイテンシ管理が必要）
      skip_if:
      - サブ秒処理
      - バッチのサイレントモード
      combine_with:
        always:
        - 1
        if_interrupt:
        - 6
      alternatives:
      - pattern: ポーリング
        when: 永続接続が不可の環境
    prevents_anti_patterns:
    - ap-07
    summary: 'エージェントに調査を任せたまま2分間画面が無反応だったら、ユーザーは「フリーズしたのでは」と不安になり、ブラウザをリロードしたくなります。処理が順調に進んでいたとしても、見えなければ伝わりません。


      このパターンでは、ステップ完了・ツール呼び出し・中間判断などのイベントを、構造化された進捗メッセージとしてリアルタイムに配信します。単なるトークンストリーミングではなく、「何を意図し、何を実行し、何が返ったか」というセマンティックな進捗を送る点が特徴です。'
    design: "```mermaid\nflowchart LR\n    W[Agent Worker] -->|\"イベント発行\"| PS[Pub/Sub / Stream]\n    PS -->|\"SSE\"| UI[クライアント UI]\n    PS -->|\"永続化\"| LOG[(イベントログ)]\n```\n\nワーカーは各ステップで構造化イベント（ステップ名、入出力の要約、所要時間、残予算）を発行します。イベントはPub/Sub経由でクライアントへSSE/WebSocketで配信されると同時に、永続ストアにも蓄積されて監査ログとして機能します。クライアント側では進捗バーやステップリストとして描画します。"
    primary_decision: decisions/tradeoffs-catalog/push-vs-pull.md
  - num: 55
    slug: deadline-budget-cascade
    title: Deadline & Budget Cascade｜期限・予算のカスケード
