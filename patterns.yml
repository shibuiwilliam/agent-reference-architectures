    summary: 'エージェントのトレースをすべてリアルタイム検索可能なDBに置いておくと、月間数百万リクエスト規模ではストレージ費用が急激に膨らんでいきます。かといって全部をオブジェクトストレージに移してしまうと、障害発生時に「直近1時間のトレースを見たい」という要求にすぐ応えられません。


      二層観測では、直近データ（数時間〜数日）をHot層に保持してリアルタイムのアラート・ダッシュボードに活用し、古いデータはCold層へ自動移行して長期保存・監査用途に備えます。'
    design: "```mermaid\nflowchart LR\n    Agent[Agent] -->|emit| Collector[Collector / Buffer]\n    Collector --> Hot[(Hot Store<br/>直近N日)]\n    Hot -->|TTL超過| Cold[(Cold Store<br/>長期保存)]\n    Hot -->\
      \ Dash[Dashboard / Alert]\n    Cold --> Audit[監査・Replay]\n```\n\nCollectorがデータを受け取り、まずHot層（時系列DB・検索エンジン）へ書き込みます。TTLポリシーに基づいて、期限切れのデータをHot層からCold層（オブジェクトストレージ＋カラムナDB）へ移行します。監査やリプレイが必要なときは、Cold層からバッチクエリで取得します。"
