    - Modal
    - cgroups/seccomp
    summary_plain: エージェントが生成・実行するコードやコマンドを、ファイルシステム・ネットワーク・リソースが制限された隔離環境（コンテナ・VM・WASM）で実行し、ホストへの影響を防ぐ。
    selection_criteria:
      primary_trigger: F5=low（エージェントがコード/コマンドを生成・実行）
      skip_if:
      - 直接FS/ネットアクセスが必須（デプロイ/sysadmin）
      combine_with:
        always:
        - 18
        if_mcp:
        - 21
      alternatives:
      - pattern: 18
        when: 完全サンドボックスが重すぎる場合のツール制限
    prevents_anti_patterns:
    - ap-10
    summary: 'エージェントが生成したPythonスクリプトをホスト環境でそのまま実行したら、無限ループでCPUを食い尽くしたり、意図しないファイルを削除したりする事態は十分にありえます。LLMが生成するコードは常に正しいとは限らず、プロンプトインジェクションで悪意あるコードが混入する可能性もあります。


      本パターンでは、ツール実行をコンテナ・VM・WASM などの隔離環境に閉じ込め、ファイルシステム・ネットワーク・CPU/メモリにリソース制限を適用します。エージェントには実行結果だけを安全なチャネル経由で返します。'
    design: "```mermaid\nflowchart LR\n    AG[Agent] -->|code / command| SB[Sandbox Runtime]\n    SB -->|isolated exec| ENV[Container / VM / WASM]\n    ENV -->|stdout / result| SB\n    SB -->|sanitized\
      \ output| AG\n    ENV -.->|blocked| NET[外部ネットワーク]\n    ENV -.->|blocked| FS[ホストFS]\n```\n\nサンドボックスには以下の制約を適用します: (1) ファイルシステムは一時ディレクトリのみ書き込み可、(2) ネットワークはホワイトリスト制、(3) 実行時間・メモリに上限を設定、(4) 終了後にサンドボックスを破棄。"
    primary_decision: foundations/forces/f5-input-trust.md
  - num: 21
    slug: mcp-adapter-isolation
    title: MCP Adapter Isolation｜MCPアダプタ分離
    tagline: MCPを信頼境界ごとに分離
    forces:
    - F5
    - F8
    related:
    - 17
    - 20
    - 41
    dials: []
    tradeoffs: []
    when_to_use: 信頼度が異なるアダプタの混在（内部DB＋外部API）、PCI-DSS規制データ
    when_not:
    - 単一アダプタ
    - 全て同一信頼レベル
    - 分離コストが利益を超える
    element_tech:
    - Kubernetes Pod/Sidecar
    - Docker Compose
    - stdio/SSE MCP transport
    - Vault
    - AWS Secrets Manager
    summary_plain: 信頼レベルが異なるMCPアダプタ（内部DB vs 外部API）を別プロセス/コンテナに分離し、個別のネットワークポリシーとシークレットスコープを適用する。
    selection_criteria:
      primary_trigger: F5=mixed AND F8=high（信頼度の異なるMCPサーバの混在）
      skip_if:
      - 単一アダプタ
      - 全て同一信頼レベル
      combine_with:
        always:
        - 17
        if_sandbox:
        - 20
      alternatives: []
    prevents_anti_patterns: []
    summary: '社内データベースのMCPサーバーと、外部の第三者APIを接続するMCPサーバーを同じプロセスで動かしていたらどうなるでしょうか。外部APIアダプタの脆弱性を突かれた場合、攻撃者が社内DBのクレデンシャルまで手に入れてしまう可能性があります。


      本パターンでは、信頼レベル・データ分類・障害ドメインの異なる MCP サーバーを個別のプロセスまたはコンテナに分離します。ゲートウェイ（[#17](17-tool-mcp-gateway.md)）がルーティングを担い、各アダプタは自身の信頼境界内でのみ動作します。'
    design: "```mermaid\nflowchart LR\n    AG[Agent] --> GW[MCP Gateway]\n    GW --> A1[MCP: 社内DB<br/>高信頼]\n    GW --> A2[MCP: 外部API<br/>中信頼]\n    GW --> A3[MCP: ユーザー提供<br/>低信頼]\n    style A1 fill:#c8e6c9\n\
      \    style A2 fill:#fff9c4\n    style A3 fill:#ffcdd2\n```\n\n分離の粒度は信頼レベルごとに分けるのが基本ですが、規制要件によっては MCP サーバー1つにつき1プロセスまで細かく分離することもあります。各アダプタにはネットワークポリシー・シークレットスコープ・リソース制限を個別に適用します。"
    primary_decision: foundations/forces/f5-input-trust.md
  - num: 22
    slug: anti-corruption-layer
    title: Anti-Corruption Layer｜アンチコラプション層
    tagline: レガシーとの概念汚染を防ぐ翻訳層
    forces:
    - F8
    related:
    - 48
    - 17
    - 14
    dials: []
    tradeoffs: []
    when_to_use: レガシーシステム統合、外部APIモデルの正規化
    when_not:
    - 外部モデルが内部と一致
    - 変換オーバーヘッドが無視できる
    element_tech:
    - Adapter/Facade パターン
    - MCP as ACL
    - Protocol Buffers
    - GraphQL スキーマ変換
    summary_plain: レガシーシステムの非標準な命名・形式・概念がエージェントのプロンプトに浸透するのを防ぐ翻訳層を設置し、クリーンな内部ドメイン語彙を維持する。
    selection_criteria:
      primary_trigger: F8=high（ドメインモデルが異なる外部システムとの統合）
      skip_if:
      - 外部モデルが内部と一致
      - 変換オーバーヘッドが無視できる
      combine_with:
        if_strangler:
        - 48
        if_gateway:
        - 17
      alternatives: []
    prevents_anti_patterns: []
    summary: 'レガシーERPでは顧客IDが `CUST_NO`、CRMでは `customer_id`、会計システムでは `KNR` と呼ばれている――こうしたバラバラな命名やデータ形式が、エージェントのプロンプトやツール定義にそのまま流れ込むと、プロンプトが肥大化しモデルの理解精度が下がってしまいます。


      Anti-Corruption Layer（ACL）はドメイン駆動設計に由来するパターンで、外部モデルとエージェント内部モデルの間に翻訳層を挟みます。エージェント側は自分のドメイン語彙だけを扱い、ACL が双方向の変換を担います。'
    design: "```mermaid\nflowchart LR\n    AG[Agent<br/>内部モデル] --> ACL[Anti-Corruption Layer]\n    ACL -->|変換| LEG[レガシーAPI<br/>外部モデル]\n    LEG -->|応答| ACL\n    ACL -->|変換| AG\n```\n\nACL は (1) リクエスト変換（内部から外部へ）、(2)\
      \ レスポンス変換（外部から内部へ）、(3) エラー正規化の3つの役割を担います。外部 API のフィールド名変更やバージョンアップは ACL の内部で吸収するため、エージェント側のプロンプトやロジックには影響が及びません。"
    primary_decision: foundations/forces/f8-accountability.md
- id: 05-memory-context
  roman: V
  title: メモリ・コンテキスト管理
  summary: コンテキスト窓の有限性と、主体を跨ぐ状態受け渡しを扱う。
  patterns:
  - num: 23
    slug: layered-memory
    title: Layered Memory｜階層化メモリ
    tagline: 短期/長期/共有に記憶を階層化
    forces:
    - F8
    related:
    - 24
    - 25
    - 26
    - 12
    dials:
    - summarization-timing
    tradeoffs:
    - in-context-vs-external
    when_to_use: 長時間ユーザー対話、マルチエージェント協調、パーソナライズが必要
    when_not:
    - ステートレスな単発Q&A
    - 階層のオーバーヘッドが利益を超える
    element_tech:
    - Redis TTL
    - PostgreSQL+pgvector
    - Pinecone
    - Weaviate
    - LLM要約
    summary_plain: エージェントの記憶を短期（現セッション）・長期（永続的事実）・共有（マルチエージェント）の3層に分け、各層に書き込みポリシー・スコープ・寿命を設定する。
    selection_criteria:
      primary_trigger: F8=high（長時間対話・マルチエージェント協調・パーソナライズ）
      skip_if:
      - ステートレスな単発Q&A
      - 階層のオーバーヘッドが利益を超える
      combine_with:
        always:
        - 24
        - 25
        - 26
        if_blackboard:
        - 12
      alternatives: []
    prevents_anti_patterns:
    - ap-05
    summary: チャットボットと長時間やり取りしていると、序盤に伝えた要件や好みを「忘れて」しまうことがあります。これはLLMのコンテキストウィンドウに上限があるためで、すべての情報を一度に保持することはできません。Layered Memory は記憶を3つの層に分離します。**短期メモリ**（ワーキングメモリ）は現セッション内のやり取りを保持し、**長期メモリ**はセッションをまたいで永続化されたファクトやユーザー嗜好を格納します。そして**共有メモリ**は、複数エージェント間で参照可能な知識ストアとして機能します。各層は書き込み・読み出しのポリシーが異なり、プロンプトへの注入タイミングも個別に制御されます。
    design: "```mermaid\nflowchart TB\n    Agent[エージェント] -->|参照| WM[短期メモリ<br/>セッション内]\n    Agent -->|検索| LM[(長期メモリ<br/>永続ストア)]\n    Agent -->|検索| SM[(共有メモリ<br/>チーム知識)]\n    WM -->|昇格| LM\n    LM -->|公開|\
      \ SM\n```\n\n短期メモリはセッションのメッセージ履歴そのものであり、コンテキストウィンドウの上限に達すると要約やスライディングウィンドウで圧縮します。長期メモリへの昇格は [#25 Memory Write Gate](25-memory-write-gate.md) で制御し、無条件には書き込みません。共有メモリはベクトルDB やナレッジグラフとして実装し、テナントやロールに基づいてアクセス制御をかけます。"
    primary_decision: decisions/tradeoffs-catalog/in-context-vs-external.md
  - num: 24
    slug: context-pack-assembly
    title: Context Pack / Assembly｜コンテキスト組立・RAG
    tagline: 文脈を組み立てグラウンディング
    forces:
    - F4
    - F7
    related:
    - 23
    - 27
    - 39
    dials:
    - retrieval-top-k
    tradeoffs:
    - rag-vs-finetuning
    when_to_use: 社内ナレッジ、サポート、法務・医療の最新情報依存
    when_not:
    - モデルの汎用知識で十分
    - 極端なリアルタイムストリーム要求
    element_tech:
    - Pinecone
    - pgvector
    - Cohere Rerank
    - HyDE
    - RecursiveCharacterTextSplitter
    summary_plain: ベクトルDB・SQL・API等の複数ソースから関連情報を検索・リランクし、トークン予算内に収まるよう組み立ててプロンプトに注入するRAGパイプライン。
    selection_criteria:
      primary_trigger: F4=medium AND F7=medium（モデルの汎用知識では不十分で外部知識が必要）
      skip_if:
      - モデルの汎用知識で十分
      - 極端なリアルタイムストリーム要求
      combine_with:
        always:
        - 23
        if_evidence:
        - 27
        if_cache:
        - 39
      alternatives:
      - pattern: Fine-Tuning
        when: 知識が安定し大量クエリでFTコストが正当化される
    prevents_anti_patterns:
    - ap-05
    summary: 社内の最新マニュアルや個別顧客の契約内容について質問したとき、モデルの学習データだけでは正しい答えが返ってきません。こうした「モデルが知らない情報」を使って正確に回答するには、外部から必要な文脈を取り込む仕組みが必要になります。Context Pack は、長期メモリ・外部ドキュメント・API応答・ユーザー履歴といった複数のソースから関連情報を検索し、トークン予算内に収まるよう選別・圧縮してプロンプトへ組み立てる工程を指します。RAG（Retrieval-Augmented
      Generation）はこのパターンの代表的な実装ですが、検索ソースはベクトルDBに限らず、SQL・API・ファイルシステムなど多岐にわたります。
    design: "```mermaid\nflowchart LR\n    Q[ユーザー入力] --> R[Retriever<br/>検索・抽出]\n    R --> VS[(ベクトルDB)]\n    R --> SQL[(業務DB)]\n    R --> API[外部API]\n    R --> Ranker[Reranker<br/>関連度順位付け]\n    Ranker -->\
      \ Pack[Context Pack<br/>トークン予算内に組立]\n    Pack --> LLM[LLM推論]\n```\n\n検索クエリはユーザー入力をそのまま使う場合と、LLMでクエリ変換（HyDE、クエリ分解など）を行う場合があります。取得したチャンクはRerankerで関連度を再順位付けし、トークン予算を超える分を切り捨てます。組み立て順序は「システム指示 → 取得文脈\
      \ → 会話履歴 → ユーザー入力」が基本形です。"
    primary_decision: decisions/tradeoffs-catalog/rag-vs-finetuning.md
  - num: 25
    slug: memory-write-gate
    title: Memory Write Gate｜メモリ書き込みゲート
    tagline: 長期保存を承認制にする
    forces:
    - F8
    related:
    - 23
    - 26
    - 31
    dials:
    - memory-write-eagerness
    tradeoffs: []
    when_to_use: 顧客対話履歴、医療・法務記録、マルチセッションのパーソナライズ
    when_not:
    - 使い捨てタスク
    - ステートレス
    - ゲートのオーバーヘッドが不適
    element_tech:
    - Presidio
    - DLP
    - NER
    - ルール/LLM分類
    - メタデータ付きKVS/VectorDB
    summary_plain: 短期メモリから長期メモリへの書き込みパスに分類・検証ゲートを設置し、関連性・カテゴリ・機密性の基準を通過した情報のみを永続化する。
    selection_criteria:
      primary_trigger: F8=high（長期メモリの品質・プライバシー管理が必要）
      skip_if:
      - 使い捨てタスク
      - ステートレス設計
      combine_with:
        always:
        - 23
        - 26
        if_approval:
        - 31
        if_data_boundary:
        - 42
      alternatives: []
    prevents_anti_patterns:
    - ap-05
    summary: ユーザーが冗談で言ったことや、一時的な検証用データまでエージェントが「永久に覚えて」しまったら、次のセッションで的外れな応答を返したり、個人情報が意図せず残り続けたりします。エージェントがセッション中に得た情報をすべて長期メモリに書き込んでしまうと、誤情報・一時的な文脈・個人情報が無差別に蓄積され、後続セッションの品質を劣化させてしまいます。Memory Write Gate
      は、短期メモリから長期メモリへの昇格パスに検証ロジックを挟むパターンです。書き込み候補を「保存すべきか」「分類（ファクト/嗜好/手順）」「機密度」の観点で評価し、条件を満たしたものだけを永続化します。
    design: "```mermaid\nflowchart LR\n    Session[セッション内やり取り] --> Extract[抽出・候補化]\n    Extract --> Gate{Write Gate<br/>分類・検証}\n    Gate -->|承認| LM[(長期メモリ)]\n    Gate -->|棄却| Drop[破棄]\n    Gate -->|要確認|\
      \ Human[人間レビュー]\n```\n\nゲートの実装は段階的に選ぶことができます。最も軽量なのはルールベース（キーワードフィルタ、PII検出）であり、次にLLMによる要約・分類判定、最も厳格なのは人間承認を挟む方式です。書き込み時にはメタデータ（出典セッションID、タイムスタンプ、信頼度スコア）を付与しておき、後から監査や失効ができるようにします。"
    primary_decision: decisions/dials/memory-write-eagerness.md
  - num: 26
    slug: forgetting-and-expiration
    title: Forgetting and Expiration｜忘却・失効
    tagline: 記憶に失効・鮮度を持たせる
    forces:
    - F8
    related:
    - 23
    - 25
    - 32
    dials:
    - memory-ttl
    tradeoffs: []
    when_to_use: 顧客データの継続性、ニュース・市場情報の鮮度、GDPR/データ保持コンプライアンス
    when_not:
    - 法的アーカイブ（失効ではなく保持が必要）
    - 不変のマスタデータ
    element_tech:
    - Redis TTL
    - DynamoDB TTL
    - PostgreSQL パーティションプルーニング
    - cron/Cloud Scheduler
    summary_plain: 全メモリエントリにTTL・鮮度スコア・上書きフラグを付与し、期限切れや陳腐化した情報を自動排除することでメモリの品質とGDPR準拠を維持する。
    selection_criteria:
      primary_trigger: F8=high（メモリの鮮度・データ保持規制への準拠）
      skip_if:
      - 法的アーカイブ（保持が必要）
      - 不変のマスタデータ
      combine_with:
        always:
        - 23
        - 25
        if_audit:
        - 32
      alternatives: []
    prevents_anti_patterns: []
    summary: 昨年の価格表や旧バージョンの仕様書をエージェントが「正しい情報」として参照し続けたら、顧客に誤った見積もりを出してしまう事態は十分に起きえます。長期メモリに情報を蓄積し続けると、古い事実が新しい事実と矛盾してしまい、エージェントの判断品質が低下します。Forgetting and Expiration は、すべての記憶エントリに有効期限または鮮度メトリクスを設定し、期限切れのエントリを検索結果から除外するか物理削除する仕組みを導入するパターンです。「忘れる」ことを設計上の機能として明示的に扱うことで、記憶の衛生を維持します。
    design: '記憶エントリには以下のメタデータを付与します。


      - **TTL**: 作成時に設定する絶対有効期限（例: 90日）

      - **鮮度スコア**: 参照されるたびに更新し、長期間未参照のエントリはスコアが減衰

      - **上書きフラグ**: 同一キーの新しい記憶が書き込まれた場合に旧版を無効化


      失効処理はバッチ（日次の掃除ジョブ）またはクエリ時フィルタ（検索時にTTL超過分を除外する方式）で実装します。規制要件でデータ保持期間が定められている場合 `[F8]` は、TTLをその期間に合わせたうえで、削除ログを監査証跡として残しておきます。'
    primary_decision: decisions/dials/memory-ttl.md
