      - AP-07 フィードバックループの飢餓: antipatterns/ap07-feedback-loop-starvation.md
      - AP-08 決定論の演劇: antipatterns/ap08-determinism-theater.md
      - AP-09 コスト崖への無知: antipatterns/ap09-cost-cliff-ignorance.md
