      - AIエージェントの特性: foundations/characteristics.md
      - 駆動変数（フォース）: foundations/forces.md
      - 程度（ダイヤル）: decisions/tuning-dials.md
      - 相反（二者択一）: decisions/tradeoffs.md
      - ダイヤル×二者択一の相互作用: decisions/interactions.md
      - フォース別逆引き: decisions/by-force.md
      - 意思決定記録（ADR）: decisions/adr-template.md
