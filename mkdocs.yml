# ===== 公開前に置換すること =====
site_name: AIエージェント本番アーキテクチャ・パターン
site_description: >-
  意思決定層（程度の調整・相反する仕組みの選定基準）を中心に、AIエージェントを
  本番システムに組み込むためのソフトウェアアーキテクチャ・パターン集。
site_url: https://shibuiwilliam.github.io/agent-reference-architectures/
repo_url: https://github.com/shibuiwilliam/agent-reference-architectures
repo_name: shibuiwilliam/agent-reference-architectures
docs_dir: docs

theme:
  name: material
  language: ja
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.action.view   # 各ページに「ソース(.md)を見る」アクションを表示
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: ダークモードへ }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: ライトモードへ }

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: ja
  # コーディングエージェント向け：/llms.txt・/llms-full.txt・各ページ .md を生成
  - llmstxt:
      markdown_description: >-
        意思決定層（程度の調整・相反する仕組みの選定基準）を中心に、AIエージェントを
        本番システムに組み込むためのアーキテクチャ・パターン集。各パターンは frontmatter に
        forces / driving_variables / forks の機械可読メタを持つ。
      full_output: llms-full.txt
      sections:
        Concepts (地盤):
          - concepts/*.md
        Degrees (程度):
          - degrees/*.md
        Forks (相反):
          - forks/*.md
        Decision & Anti-patterns:
          - decision/*.md
          - antipatterns/*.md
        For Agents:
          - for-agents/*.md
        Patterns A - Execution:
          - patterns/a-execution/*.md
        Patterns B - Orchestration:
          - patterns/b-orchestration/*.md
        Patterns C - Tools & Security:
          - patterns/c-tools-security/*.md
        Patterns D - Memory & Context:
          - patterns/d-memory-context/*.md
        Patterns E - Safety & HITL:
          - patterns/e-safety-hitl/*.md
        Patterns F - Data Integrity:
          - patterns/f-data-integrity/*.md
        Patterns G - Observability & Ops:
          - patterns/g-observability-ops/*.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - ホーム: index.md
  - エージェント向け:
      - for-agents/index.md
      - 設計提案プロトコル: for-agents/decision-protocol.md
  - 地盤 (Concepts):
      - concepts/index.md
      - 設計力学 F1–F17: concepts/design-forces.md
      - 7つの予算: concepts/budgets.md
      - 9つの駆動変数: concepts/driving-variables.md
  - 程度 (Degrees): degrees/index.md
  - 相反 (Forks): forks/index.md
  - 意思決定フロー: decision/decision-flow.md
  - アンチパターン: antipatterns/index.md
  - パターン (Patterns):
      - patterns/index.md
      - テンプレート: patterns/_template.md
      - A. 実行方式:
          - patterns/a-execution/index.md
          - patterns/a-execution/a1-sync-edge-agent.md
          - patterns/a-execution/a2-durable-async-agent.md
          - patterns/a-execution/a3-sync-facade-async-core.md
          - patterns/a-execution/a4-streaming-progressive-commit.md
          - patterns/a-execution/a6-adaptive-timeout-retry.md
          - patterns/a-execution/a7-deadline-budget-cascade.md
      - B. オーケストレーション:
          - patterns/b-orchestration/index.md
          - patterns/b-orchestration/b1-deterministic-shell.md
          - patterns/b-orchestration/b2-workflow-backbone.md
          - patterns/b-orchestration/b3-agentic-loop-budget.md
          - patterns/b-orchestration/b4-planner-executor-verifier.md
          - patterns/b-orchestration/b6-critic-judge-sampling.md
          - patterns/b-orchestration/b7-model-router-adaptive-effort.md
      - C. ツール・セキュリティ:
          - patterns/c-tools-security/index.md
          - patterns/c-tools-security/c1-tool-gateway-mcp-broker.md
          - patterns/c-tools-security/c2-read-free-write-gated.md
          - patterns/c-tools-security/c3-dry-run-commit.md
          - patterns/c-tools-security/c4-idempotent-command-envelope.md
          - patterns/c-tools-security/c6-confused-deputy-defense.md
      - D. メモリ・コンテキスト:
          - patterns/d-memory-context/index.md
          - patterns/d-memory-context/d1-tiered-memory.md
          - patterns/d-memory-context/d2-context-budget-allocator.md
          - patterns/d-memory-context/d3-memory-write-gate.md
          - patterns/d-memory-context/d5-prompt-registry.md
          - patterns/d-memory-context/d6-semantic-cache-nocache-zones.md
      - E. 安全性・HITL:
          - patterns/e-safety-hitl/index.md
          - patterns/e-safety-hitl/e1-risk-based-approval.md
          - patterns/e-safety-hitl/e2-policy-as-code.md
          - patterns/e-safety-hitl/e3-guardrail-sandwich.md
          - patterns/e-safety-hitl/e4-verified-structured-output.md
      - F. データ整合性:
          - patterns/f-data-integrity/index.md
          - patterns/f-data-integrity/f1-short-tx-long-session.md
      - G. 観測・運用:
          - patterns/g-observability-ops/index.md
          - patterns/g-observability-ops/g1-tiered-observability.md
          - patterns/g-observability-ops/g2-end-to-end-tracing.md
          - patterns/g-observability-ops/g4-eval-harness.md
  - リファレンス:
      - 機械可読インデックス: reference/pattern-index.md
