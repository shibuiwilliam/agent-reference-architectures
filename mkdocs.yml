site_name: AIエージェント本番アーキテクチャ・パターン
site_description: 意思決定（フォース・程度・相反）を中心に、AIエージェントを本番システムへ組み込むアーキテクチャパターンの統合カタログ
# GitHub Pages の公開URL。<user> と <repo> を自分のものに置き換える
site_url: https://shibuiwilliam.github.io/agent-reference-architectures/
docs_dir: docs

# リポジトリ連携（右上の編集リンク・リポジトリリンク）
repo_name: shibuiwilliam/agent-reference-architectures
repo_url: https://github.com/shibuiwilliam/agent-reference-architectures
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

