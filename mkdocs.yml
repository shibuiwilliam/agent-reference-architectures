          - メモリ TTL: decisions/dials/memory-ttl.md
          - メモリ書き込み積極度: decisions/dials/memory-write-eagerness.md
          - 要約タイミング: decisions/dials/summarization-timing.md
          - 露出ツール数: decisions/dials/exposed-tool-count.md
