site_name: AIエージェント本番アーキテクチャ・パターン
site_description: 意思決定（フォース・程度・相反）を中心に、AIエージェントを本番システムへ組み込むアーキテクチャパターンの統合カタログ
# GitHub Pages の公開URL。<user> と <repo> を自分のものに置き換える
site_url: https://shibuiwilliam.github.io/agent-reference-architectures/
docs_dir: docs

# リポジトリ連携（右上の編集リンク・リポジトリリンク）
repo_name: shibuiwilliam/agent-reference-architectures
repo_url: https://github.com/shibuiwilliam/agent-reference-architectures
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

