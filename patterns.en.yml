      - num: 33
        slug: version-pinning
        title: "Prompt/Model/Tool Version Pinning"
        tagline: "Pin prompts, models, and tools to specific versions"
        forces: [F8]
        related: [34, 32, 35]
        dials: [prompt-storage]
        tradeoffs: []
        when_to_use: "Production agents, multi-model comparison, model auto-upgrade risk"
        when_not: ["Experimental prototypes where latest is preferred"]
        element_tech: ["Git tag+hash", "Langfuse Registry", "Humanloop", "Model snapshot ID", "Docker image tag"]
      - num: 34
