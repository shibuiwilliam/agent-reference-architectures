# patterns.yml — Single source of truth for 59 patterns
# scripts/scaffold.py generates stubs under docs/ from this file.
# scripts/generate.py generates machine-readable artifacts from this file + decisions.yml.
# Adding, renaming, or reordering patterns must be done here, and mkdocs.yml nav must be updated accordingly.

version: "1.0.0"

site:
  title: "AI Agent Production Architecture Patterns"
  principle: "Surround a probabilistic core with a deterministic shell—contracts, verification, budgets, permissions, and observability."

forces:
  - { id: F1, name: Reversibility, note: "Can failures be undone?" }
  - { id: F2, name: Failure Cost, note: "Financial/legal/safety pain" }
  - { id: F3, name: Per-Request Value, note: "Contribution to revenue/decisions" }
  - { id: F4, name: Latency Budget, note: "User's tolerance for waiting" }
  - { id: F5, name: Input Trustworthiness, note: "Likelihood of attack/contamination" }
  - { id: F6, name: Task Variability, note: "Routine vs. exploratory" }
  - { id: F7, name: Cost Sensitivity & Scale, note: "QPS and monthly cost cap" }
  - { id: F8, name: Accountability & Regulation, note: "Audit and compliance requirements" }
  - { id: F9, name: Provider Reliability, note: "External LLM availability" }

categories:
  - id: "01-execution"
    roman: "I"
    title: "Execution, Sessions & Orchestration"
    summary: "The foundation for safely running long-running, unpredictable, failure-prone executions decoupled from the web tier."
    patterns:
      - num: 1
        slug: request-to-job-gateway
        title: "Request-to-Job Gateway | Async Intake Gateway"
        tagline: "Accept a request as an asynchronous job"
        forces: [F4, F1]
        related: [2, 7, 58]
        dials: [timeout]
        tradeoffs: [sync-vs-async, push-vs-pull]
        when_to_use: "Multi-step research, content generation, or analysis tasks taking seconds to minutes"
        when_not: ["F4=low (tasks completable synchronously within seconds)"]
        element_tech: [FastAPI, "Next.js API Routes", SQS, "Cloud Pub/Sub", Kafka, "Cloud Tasks", Celery, Redis, PostgreSQL, SSE, WebSocket]
      - num: 2
        slug: durable-agent-session
        title: "Durable Agent Session"
        tagline: "Persist state to survive interruption and resume"
        forces: [F1]
        related: [1, 6, 4, 32]
        dials: [checkpoint-frequency]
        tradeoffs: [in-context-vs-external]
        when_to_use: "Multi-step research, code generation, data pipelines, rolling-deployment environments"
        when_not: ["Single-shot LLM calls", "Real-time conversations where serialization cost exceeds benefit"]
        element_tech: [Redis, PostgreSQL, DynamoDB, Temporal, "Azure Durable Functions", "JSON/Protobuf"]
      - num: 3
        slug: workflow-backbone-agent-node
        title: "Workflow Backbone + Agent Node | Deterministic Skeleton + Node"
        tagline: "Deterministic skeleton, delegate only the judgments"
        forces: [F6, F8]
        related: [59, 11, 5, 14]
        dials: []
        tradeoffs: [workflow-vs-agent]
        when_to_use: "Embedding AI judgments into fixed procedures; regulated industries requiring reproducibility"
        when_not: ["F6=high (exploratory tasks)", "Procedures that change dynamically"]
        element_tech: [Temporal, Airflow, "Step Functions", Prefect, Hatchet, LangGraph, "OpenAI Agents SDK"]
      - num: 4
        slug: agent-saga
        title: "Agent Saga | Compensating Transactions"
        tagline: "Roll back side-effect chains via compensation"
        forces: [F1, F2]
        related: [2, 19, 31, 1]
        dials: [checkpoint-frequency]
        tradeoffs: []
        when_to_use: "Chained writes to multiple external systems (calendar -> ticket -> email)"
        when_not: ["Read-only operations", "Completable within a single-service DB transaction", "Physically irreversible operations"]
        element_tech: [Temporal, "Step Functions", "Idempotency keys"]
      - num: 5
        slug: time-budgeted-agent-loop
        title: "Time-Budgeted Agent Loop"
        tagline: "Budget time, iterations, and cost to prevent runaway"
        forces: [F7, F3]
        related: [55, 6, 37]
        dials: [budget-cap, timeout]
        tradeoffs: []
        when_to_use: "Cost limits in SaaS, ensuring fairness in multi-tenant environments"
        when_not: ["Batch workloads that use as much as needed (though cost caps are always recommended)"]
        element_tech: ["Framework callback/middleware", "LLM usage API", "Tool call counter"]
      - num: 6
        slug: interruptible-agent
        title: "Interruptible Agent"
        tagline: "Can be stopped or redirected mid-execution"
        forces: [F4]
        related: [2, 5, 31, 7]
        dials: []
        tradeoffs: []
        when_to_use: "Long-running interactive agents where humans may change direction mid-task"
        when_not: ["Sub-second tasks", "Ultra-low-latency paths where flag-checking overhead is unacceptable"]
        element_tech: ["Redis Pub/Sub", "DB flag", WebSocket, "graceful shutdown"]
      - num: 7
        slug: streaming-progress
        title: "Streaming Progress"
        tagline: "Stream auditable summaries of progress in real time"
        forces: [F4]
        related: [1, 6, 32]
        dials: []
        tradeoffs: [push-vs-pull]
        when_to_use: "Tasks over 5 seconds, interactive user monitoring, regulatory trace logs"
        when_not: ["Sub-second processing", "Silent batch mode"]
        element_tech: [SSE, WebSocket, "gRPC streaming", "Redis Streams", Kafka, "JSON Lines"]
      - num: 55
        slug: deadline-budget-cascade
        title: "Deadline & Budget Cascade"
        tagline: "Propagate deadlines and budgets down the call tree"
        forces: [F7, F3]
        related: [5, 9, 37]
        dials: [budget-cap]
        tradeoffs: []
        when_to_use: "Multi-agent setups, recursive tool calls, strict SaaS cost limits"
        when_not: ["Single-agent one-shot calls", "Lightweight tasks where overhead exceeds benefit"]
        element_tech: ["gRPC metadata", "HTTP header context", "Context object"]
      - num: 58
        slug: sync-facade-over-async-core
        title: "Sync Facade over Async Core"
        tagline: "Respond synchronously if fast enough, promote to async otherwise"
        forces: [F4, F1]
        related: [1, 2, 7]
        dials: [timeout]
        tradeoffs: [sync-vs-async]
        when_to_use: "Hybrid workloads where light greetings and heavy research share the same endpoint"
        when_not: ["Uniformly fast or slow workloads", "Fully async-only client design"]
        element_tech: ["FastAPI asyncio.wait_for", "Next.js AbortController"]
      - num: 59
        slug: workflow-agent-spectrum-selector
        title: "Workflow-Agent Spectrum Selector | Selection Meta-Pattern"
        tagline: "Choose deterministic vs. autonomous per sub-task"
        forces: [F6, F2]
        related: [3, 11, 57, 48]
        dials: []
        tradeoffs: [workflow-vs-agent]
        when_to_use: "System design with multiple sub-tasks mixing routine and exploratory work"
        when_not: ["Single-task obvious cases", "Everything is clearly routine or clearly exploratory"]
        element_tech: ["Scoring matrix", "Dynamic classifier"]

  - id: "02-composition"
    roman: "II"
    title: "Agent Composition & Division of Labor"
    summary: "Overcoming the limits of a single agent's capability, context window, and self-misattribution through role separation."
    patterns:
      - num: 8
        slug: planner-executor-reviewer
        title: "Planner-Executor-Reviewer"
        tagline: "Separate planning, execution, and review into distinct roles"
        forces: [F2, F3]
        related: [10, 28, 50, 5]
        dials: [self-correction-loops]
        tradeoffs: [plan-vs-react]
        when_to_use: "Code generation -> test -> fix, report fact-checking, multi-step research with clear verification criteria"
        when_not: ["Simple Q&A", "Computation overhead exceeds the task", "F4=low (real-time)"]
        element_tech: ["LangGraph", "CrewAI", "LLM/rule verification"]
      - num: 9
        slug: supervisor-specialist-agents
        title: "Supervisor & Specialist Agents"
        tagline: "A supervisor delegates to specialists"
        forces: [F6, F7]
        related: [8, 12, 47, 37]
        dials: []
        tradeoffs: [single-vs-multi-agent]
        when_to_use: "Diverse task types (FAQ/technical/billing), multi-modal, separable domain expertise"
        when_not: ["Few task types", "Marginal specialization benefit", "Tight coupling between specialists"]
        element_tech: ["LangGraph conditional routing", "OpenAI Swarm", "Custom routing"]
      - num: 10
        slug: agent-ensemble-debate
        title: "Agent Ensemble & Debate"
        tagline: "Multiple agents solve and deliberate for robustness"
        forces: [F2, F3]
        related: [8, 28, 37]
        dials: [best-of-n]
        tradeoffs: [same-vs-different-model]
        when_to_use: "High-risk decisions (medical/financial), accuracy verification, high-value disagreement detection"
        when_not: ["High-volume low-cost requests (N-times cost)", "Subjective creative tasks", "F4=strict (synchronous)"]
        element_tech: ["Parallel asyncio/thread pool", "Model mix", "Voting/scoring"]
      - num: 11
        slug: deterministic-core-probabilistic-edge
        title: "Deterministic Core, Probabilistic Edge"
        tagline: "Keep the core deterministic, AI only at the edges"
        forces: [F2, F8]
        related: [3, 14, 30]
        dials: []
        tradeoffs: [prompt-vs-code]
        when_to_use: "Finance/insurance/medical protocols, exact amounts and logic required"
        when_not: ["Exploratory research", "Creative generation", "Rules too ambiguous to codify"]
        element_tech: ["Drools/OPA", "Rule engine", "State machine", "Template+LLM"]
      - num: 12
        slug: blackboard
        title: "Blackboard | Shared Blackboard"
        tagline: "Loosely-coupled coordination via a shared blackboard"
        forces: [F6]
        related: [9, 23, 3]
        dials: []
        tradeoffs: [orchestration-vs-choreography]
        when_to_use: "Complex multi-agent analysis, dynamic agent participation, exploratory problem solving"
        when_not: ["Fixed-order workflows (use #3)", "High-contention concurrent writes"]
        element_tech: ["Redis", "PostgreSQL JSONB", "Firebase", "Pub/Sub"]

  - id: "03-io-contract"
    roman: "III"
    title: "Input/Output & Contracts"
    summary: "The boundary that converts natural language and probabilistic output into 'contracts' that conventional software can safely consume."
    patterns:
      - num: 13
        slug: natural-language-boundary-adapter
        title: "Natural Language Boundary Adapter"
        tagline: "Convert natural language to structured intent"
        forces: [F5]
        related: [14, 16, 29]
        dials: []
        tradeoffs: []
        when_to_use: "Clear action classification (orders, tickets, search), finite intent types"
        when_not: ["Free-form creative writing", "Ambiguous intent enumeration"]
        element_tech: ["LLM function calling", "Claude tool_use", "Rasa", "Dialogflow", "Amazon Lex", "JSON Schema", "Pydantic"]
      - num: 14
        slug: structured-output-contract
        title: "Structured Output Contract"
        tagline: "Contractualize output with a schema"
        forces: [F8]
        related: [13, 15, 30]
        dials: []
        tradeoffs: [structured-vs-freeform]
        when_to_use: "API response generation, form filling, data extraction, workflow routing"
        when_not: ["Free text (reports, emails)", "Format kills expressiveness"]
        element_tech: ["OpenAI response_format", "Anthropic tool_use", "Pydantic", "Zod", "JSON Schema", "Instructor"]
      - num: 15
        slug: inverted-structured-output
        title: "Inverted Structured Output"
        tagline: "Extract intermediate decisions, not final execution"
        forces: [F2]
        related: [14, 3, 19]
        dials: []
        tradeoffs: [llm-vs-tool]
        when_to_use: "Approval/classification/routing decisions; judgment only (execution in code)"
        when_not: ["LLM produces the final artifact (code, text)", "Infinite choice space"]
        element_tech: ["Function calling", "Enum actions", "Deterministic executor"]
      - num: 16
        slug: ambiguity-negotiation
        title: "Ambiguity Negotiation"
        tagline: "Clarify before executing when ambiguous"
        forces: [F1, F2]
        related: [13, 31, 51]
        dials: []
        tradeoffs: []
        when_to_use: "Reversible operations, multi-interpretation inputs (file deletion), under-specified slots"
        when_not: ["Real-time instant response", "Pre-structured form input"]
        element_tech: ["Confidence/logprobs", "Slot fill rate", "Interactive UI"]

  - id: "04-tools-mcp"
    roman: "IV"
    title: "Tools, MCP & External System Integration"
    summary: "The permission, isolation, and idempotency layer for a 'thinking agent' to produce side effects in the external world."
    patterns:
      - num: 17
        slug: tool-mcp-gateway
        title: "Tool / MCP Gateway"
        tagline: "Aggregate tool connections with authorization and auditing"
        forces: [F5, F8]
        related: [18, 21, 32]
        dials: []
        tradeoffs: []
        when_to_use: "Multiple tools/MCP systems, multi-tenant, centralized authorization and auditing needed"
        when_not: ["1-2 tools", "No authentication required", "Ultra-low latency intolerant"]
        element_tech: ["MCP Gateway/Proxy", "Kong", "Envoy", "AWS API Gateway", "OPA/Cedar", "OpenTelemetry"]
      - num: 18
        slug: least-privilege-tool-binding
        title: "Least-Privilege Tool Binding"
        tagline: "Bind minimum permissions per session"
        forces: [F5, F2]
        related: [17, 43, 44]
        dials: [exposed-tool-count]
        tradeoffs: []
        when_to_use: "10+ tools, multi-tenant, per-user varying permissions"
        when_not: ["2-3 tools with uniform permissions for all users", "Exploratory discovery needed"]
        element_tech: ["MCP tools/list filtering", "RBAC/ABAC", "OPA/Cedar"]
      - num: 19
        slug: dry-run-first-tool-execution
        title: "Dry-Run First Tool Execution"
        tagline: "Simulate side effects first, then approve"
        forces: [F1, F2]
        related: [4, 31, 15]
        dials: []
        tradeoffs: []
        when_to_use: "Data mutations (delete, API writes), infrastructure changes (Terraform-like operations)"
        when_not: ["Read-only operations", "Low failure cost", "Real-time speed priority"]
        element_tech: ["--dry-run flag", "DB transaction->result->rollback", "API dryRun parameter", "diff-view UI"]
      - num: 20
        slug: sandboxed-tool-runtime
        title: "Sandboxed Tool Runtime"
        tagline: "Execute code/operations in an isolated environment"
        forces: [F5]
        related: [18, 21, 43]
        dials: []
        tradeoffs: []
        when_to_use: "Code execution agents, data analysis, user-provided code, CI/CD"
        when_not: ["Direct FS/network access required", "Native deploy/sysadmin tasks"]
        element_tech: ["Docker gVisor", "Firecracker", "WASM", "AWS Lambda", "Cloud Run", "Modal", "cgroups/seccomp"]
      - num: 21
        slug: mcp-adapter-isolation
        title: "MCP Adapter Isolation"
        tagline: "Isolate MCP adapters per trust boundary"
        forces: [F5, F8]
        related: [17, 20, 41]
        dials: []
        tradeoffs: []
        when_to_use: "Mixed-trust adapters (internal DB + external API), PCI-DSS regulated data"
        when_not: ["Single adapter", "All at same trust level", "Isolation cost exceeds benefit"]
        element_tech: ["Kubernetes Pod/Sidecar", "Docker Compose", "stdio/SSE MCP transport", "Vault", "AWS Secrets Manager"]
      - num: 22
        slug: anti-corruption-layer
        title: "Anti-Corruption Layer"
        tagline: "A translation layer to prevent concept pollution from legacy systems"
        forces: [F8]
        related: [48, 17, 14]
        dials: []
        tradeoffs: []
        when_to_use: "Legacy system integration, normalizing external API models"
        when_not: ["External model matches internal model", "Translation overhead is negligible"]
        element_tech: ["Adapter/Facade pattern", "MCP as ACL", "Protocol Buffers", "GraphQL schema transformation"]

  - id: "05-memory-context"
    roman: "V"
    title: "Memory & Context Management"
    summary: "Dealing with the finite context window and state handoff across agents."
    patterns:
      - num: 23
        slug: layered-memory
        title: "Layered Memory"
        tagline: "Organize memory into short-term, long-term, and shared tiers"
        forces: [F8]
        related: [24, 25, 26, 12]
        dials: [summarization-timing]
        tradeoffs: [in-context-vs-external]
        when_to_use: "Long user conversations, multi-agent coordination, personalization needed"
        when_not: ["Stateless single-shot Q&A", "Tier overhead exceeds benefit"]
        element_tech: ["Redis TTL", "PostgreSQL+pgvector", "Pinecone", "Weaviate", "LLM summarization"]
      - num: 24
        slug: context-pack-assembly
        title: "Context Pack / Assembly | RAG"
        tagline: "Assemble context for grounding"
        forces: [F4, F7]
        related: [23, 27, 39]
        dials: [retrieval-top-k]
        tradeoffs: [rag-vs-finetuning]
        when_to_use: "Internal knowledge bases, support, legal/medical domains dependent on up-to-date information"
        when_not: ["Model's general knowledge is sufficient", "Extreme real-time streaming requirements"]
        element_tech: ["Pinecone", "pgvector", "Cohere Rerank", "HyDE", "RecursiveCharacterTextSplitter"]
      - num: 25
        slug: memory-write-gate
        title: "Memory Write Gate"
        tagline: "Gate long-term storage behind approval"
        forces: [F8]
        related: [23, 26, 31]
        dials: [memory-write-eagerness]
        tradeoffs: []
        when_to_use: "Customer conversation history, medical/legal records, multi-session personalization"
        when_not: ["Throwaway tasks", "Stateless", "Gate overhead is unacceptable"]
        element_tech: ["Presidio", "DLP", "NER", "Rule/LLM classification", "KVS/VectorDB with metadata"]
      - num: 26
        slug: forgetting-and-expiration
        title: "Forgetting and Expiration"
        tagline: "Give memories an expiration and freshness"
        forces: [F8]
        related: [23, 25, 32]
        dials: [memory-ttl]
        tradeoffs: []
        when_to_use: "Customer data continuity, news/market info freshness, GDPR/data retention compliance"
        when_not: ["Legal archives (retention required, not expiration)", "Immutable master data"]
        element_tech: ["Redis TTL", "DynamoDB TTL", "PostgreSQL partition pruning", "cron/Cloud Scheduler"]

  - id: "06-reliability"
    roman: "VI"
    title: "Reliability, Verification, Guardrails & Autonomy"
    summary: "The layer that detects and recovers from hallucinations and deviations before shipping. The goal is containment, not control."
    patterns:
      - num: 27
        slug: evidence-first-answer
        title: "Evidence-First Answer"
        tagline: "Retrieve and cite evidence before answering"
        forces: [F8]
        related: [24, 28, 14]
        dials: []
        tradeoffs: [rag-vs-finetuning]
        when_to_use: "Legal/medical/financial Q&A, internal knowledge search, support requiring audit trails"
        when_not: ["Creative brainstorming (no authoritative source)", "No evidence source exists"]
        element_tech: ["RAG pipeline", "Web search API", "Internal document API", "Confidence scoring", "Citation metadata"]
      - num: 28
        slug: verifier-agent-critic
        title: "Verifier Agent / Critic"
        tagline: "Independent verifier for pre-ship inspection"
        forces: [F2, F4]
        related: [8, 27, 29]
        dials: [self-correction-loops]
        tradeoffs: [inline-vs-post-verification, same-vs-different-model]
        when_to_use: "Code generation (test verification), financial reports, legal documents, public content"
        when_not: ["Real-time chat", "Low-cost brainstorming where failure cost is low"]
        element_tech: ["Separate LLM/rule checker", "Unit test execution", "URL validation", "max-retry+timeout"]
      - num: 29
        slug: guardrail-sidecar-self-correction
        title: "Guardrail Sidecar + Self-Correction"
        tagline: "Inspect input/output and self-correct errors"
        forces: [F5, F4]
        related: [30, 28, 44]
        dials: [guardrail-strictness]
        tradeoffs: [inline-vs-post-verification]
        when_to_use: "Public chatbots, external API input, compliance requirements, auto-correction acceptable"
        when_not: ["Trusted internal input only", "Real-time zero-latency requirement", "Offline batch"]
        element_tech: ["Guardrails AI", "NeMo Guardrails", "LLM-Guard", "PII detection", "Toxicity classifier"]
      - num: 30
        slug: policy-as-code-guardrail
        title: "Policy-as-Code Guardrail"
        tagline: "Codify constraints and evaluate separately"
        forces: [F2, F8]
        related: [29, 18, 52]
        dials: []
        tradeoffs: [prompt-vs-code]
        when_to_use: "High-failure-cost operations in finance/medical/legal, audit trails needed, deterministic rules possible"
        when_not: ["Ambiguous rules (tone judgment)", "Domains with ill-defined formalization"]
        element_tech: ["OPA/Rego", "Google CEL", "AWS Cedar", "Python functions", "Git-managed", "Policy test suite"]
      - num: 31
        slug: human-approval-checkpoint
        title: "Human Approval Checkpoint"
        tagline: "Require human approval before high-risk actions"
        forces: [F2, F1]
        related: [57, 19, 6]
        dials: [autonomy-level, hitl-frequency]
        tradeoffs: []
        when_to_use: "Finance, infrastructure changes, customer email sending, contract confirmation"
        when_not: ["Real-time chat", "No human available (switch to #30 automation)", "Read-only"]
        element_tech: ["Durable Session", "Slack/Teams/email notifications", "Approval UI dashboard", "RBAC", "Timeout logic"]
      - num: 57
        slug: autonomy-ladder
        title: "Autonomy Ladder"
        tagline: "Gradually promote autonomy based on track record"
        forces: [F1, F2]
        related: [31, 5, 51]
        dials: [autonomy-level]
        tradeoffs: []
        when_to_use: "Gradual rollout of agent permissions, varying risk levels per task type"
        when_not: ["Fixed requirements (always L1 or L3)", "Insufficient task volume for statistics"]
        element_tech: ["Feature Flag (LaunchDarkly/Unleash)", "Success/failure counters", "Confidence interval scoring"]

  - id: "07-observability"
    roman: "VII"
    title: "Observability, Auditing & Evaluation"
