        when_not: ["High masking cost for sensitive PII", "No trace history"]
        element_tech: ["BigQuery/ClickHouse extraction", "promptfoo/Braintrust replay", "LLM-as-Judge", "Presidio/DLP masking"]
      - num: 36
        slug: shadow-canary-deployment
        title: "Shadow / Canary Deployment"
        tagline: "Gradual rollout with automatic rollback"
        forces: [F9]
        related: [34, 35, 33]
        dials: []
        tradeoffs: []
        when_to_use: "Sufficient production volume, strict SLA, model upgrades or major prompt revisions"
        when_not: ["Low request volume", "Complex read-only mocking of side effects", "Uniform tasks"]
        element_tech: ["Envoy/Istio/ALB weighted routing", "LaunchDarkly", "Datadog/Prometheus", "Argo Rollouts", "Flagger"]

  - id: "08-cost-scaling"
